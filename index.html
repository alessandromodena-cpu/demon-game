<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survive Until 6AM · The Baphomet</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body { background: #030405; min-height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Courier New', Courier, monospace; overflow: hidden; color: #b3c7e5; }
    .game-wrapper { background: #10131a; padding: 16px; border-radius: 16px; box-shadow: 0 0 60px #6a0a0a, inset 0 0 12px #2f3742; }
    canvas { display: block; width: 900px; height: 600px; image-rendering: crisp-edges; image-rendering: pixelated; border: 4px solid #3e4a5b; border-radius: 12px; background: #050608; cursor: pointer; }
    .info-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 8px; font-weight: bold; letter-spacing: 1px; font-size: 0.8rem; }
    .info-bar span { background: #1f262e; padding: 5px 10px; border-radius: 40px; border: 2px solid #4b5e77; box-shadow: inset 0 0 6px #000; }
    .restart-btn { background: #3a1212; border: none; color: #ffdede; font-family: inherit; font-weight: bold; padding: 5px 14px; border-radius: 40px; font-size: 0.85rem; cursor: pointer; border: 2px solid #8a2a2a; box-shadow: 0 4px 0 #0e0505; }
    .restart-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #0e0505; }
    .hint { text-align: center; margin-top: 6px; font-size: 0.72rem; color: #6a7a8a; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="game-wrapper">
    <canvas id="gameCanvas" width="900" height="600"></canvas>
    <div class="info-bar">
        <span>🔒 <span id="lockCount">12/12</span></span>
        <span>⏳ <span id="clockDisplay">12:00 AM</span></span>
        <span>🔋 <span id="batteryDisplay">100%</span></span>
        <span>⚡ <span id="staminaDisplay">100%</span></span>
        <button class="restart-btn" id="restartButton">↻ RESTART</button>
    </div>
    <div class="hint">A/D walk · E lock doors · SPACE flashlight · SHIFT sprint · TAB / click tabs to change room · ESC pause</div>
</div>
<script>
(function() {
"use strict";

var canvas = document.getElementById('gameCanvas');
var ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
var lockCountSpan = document.getElementById('lockCount');
var clockDisplaySpan = document.getElementById('clockDisplay');
var batteryDisplaySpan = document.getElementById('batteryDisplay');
var staminaDisplaySpan = document.getElementById('staminaDisplay');

// ============ AUDIO ============
var audioCtx = null;
function initAudio() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { audioCtx = null; } }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(f, d, t, v, s) {
    if (!audioCtx) return;
    try {
        var o = audioCtx.createOscillator(); var g = audioCtx.createGain();
        o.type = t || 'square';
        o.frequency.setValueAtTime(f, audioCtx.currentTime);
        if (s) o.frequency.exponentialRampToValueAtTime(s, audioCtx.currentTime + d);
        g.gain.setValueAtTime(v || 0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + d);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + d);
    } catch(e) {}
}
function sfxLock()      { beep(220, 0.14, 'sawtooth', 0.09, 110); }
function sfxUnlock()    { beep(180, 0.12, 'square', 0.07, 300); }
function sfxBreak()     { beep(90, 0.5, 'sawtooth', 0.16, 30); }
function sfxGrowl()     { beep(60, 0.7, 'sawtooth', 0.14, 30); }
function sfxHeartbeat() { beep(55, 0.12, 'sine', 0.15); }
function sfxStep()      { beep(110 + Math.random()*40, 0.03, 'square', 0.02); }
function sfxBarricade() { beep(150, 0.2, 'square', 0.09, 80); }
function sfxFlash()     { beep(400, 0.05, 'square', 0.03); }
function sfxDoor()      { beep(280, 0.15, 'square', 0.05, 160); }
function sfxCut()       { beep(200, 0.3, 'triangle', 0.08, 100); }
function sfxScream() {
    if (!audioCtx) return;
    try {
        var o = audioCtx.createOscillator(); var g = audioCtx.createGain();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(1400, audioCtx.currentTime);
        o.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 1.5);
        g.gain.setValueAtTime(0.3, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + 1.5);
    } catch(e) {}
}
function sfxWin() {
    [523, 659, 784, 1047].forEach(function(f, i) { setTimeout(function(){ beep(f, 0.25, 'sine', 0.12); }, i * 180); });
}

// ============ CONSTANTS ============
var HOURS = ['12:00 AM','1:00 AM','2:00 AM','3:00 AM','4:00 AM','5:00 AM','6:00 AM'];
var DIFFICULTIES = {
    easy:      { hourLen: 22, baseInterval: 6.5, label: 'EASY',      color: '#4a8a4a' },
    normal:    { hourLen: 17, baseInterval: 4.8, label: 'NORMAL',    color: '#a8803a' },
    nightmare: { hourLen: 13, baseInterval: 3.2, label: 'NIGHTMARE', color: '#8a2a2a' }
};
var PLAYER_SPEED = 270;
var PLAYER_SPRINT_MULT = 1.85;
var INTERACT_RANGE = 95;
var FLOOR_Y = 500;

// ============ ROOMS (7 rooms) ============
function buildRooms() {
    return [
        { id: 'bedroom', name: 'BEDROOM', wall: '#1e1424', floor: '#100a16', wallpaper: 'stripes', accent: '#3a2050',
            entryPoints: [
                { x: 130, y: 290, w: 140, h: 230, type: 'window', label: 'WINDOW', locked: true, barricade: 0, maxBarricade: 3, anchorX: 200 },
                { x: 640, y: 200, w: 130, h: 280, type: 'door', label: 'CLOSET', locked: true, barricade: 0, maxBarricade: 4, anchorX: 700 }
            ],
            objects: [
                { type: 'bed', x: 330, y: 380, w: 220, h: 110 },
                { type: 'poster', x: 500, y: 140, w: 80, h: 100, variant: 0 },
                { type: 'lamp', x: 60, y: 140, w: 30, h: 60, on: false }
            ] },
        { id: 'hallway', name: 'HALLWAY', wall: '#181826', floor: '#0f1018', wallpaper: 'papers', accent: '#3a2a20',
            entryPoints: [
                { x: 380, y: 190, w: 140, h: 260, type: 'door', label: 'FRONT', locked: true, barricade: 0, maxBarricade: 5, anchorX: 450 },
                { x: 90,  y: 240, w: 100, h: 180, type: 'vent', label: 'VENT',  locked: true, barricade: 0, maxBarricade: 2, anchorX: 140 },
                { x: 710, y: 240, w: 100, h: 180, type: 'vent', label: 'VENT',  locked: true, barricade: 0, maxBarricade: 2, anchorX: 760 }
            ],
            objects: [
                { type: 'painting', x: 240, y: 120, w: 70, h: 90, variant: 0 },
                { type: 'painting', x: 590, y: 120, w: 70, h: 90, variant: 1 },
                { type: 'coatrack', x: 200, y: 380, w: 50, h: 100 }
            ] },
        { id: 'kitchen', name: 'KITCHEN', wall: '#1e1a14', floor: '#14100c', wallpaper: 'tiles', accent: '#4a3020',
            entryPoints: [
                { x: 720, y: 270, w: 150, h: 240, type: 'window', label: 'WINDOW', locked: true, barricade: 0, maxBarricade: 3, anchorX: 790 },
                { x: 390, y: 170, w: 130, h: 90, type: 'vent', label: 'VENT', locked: true, barricade: 0, maxBarricade: 2, anchorX: 455 }
            ],
            objects: [
                { type: 'counter', x: 100, y: 400, w: 240, h: 70 },
                { type: 'stove', x: 380, y: 400, w: 100, h: 80 },
                { type: 'fridge', x: 50, y: 200, w: 80, h: 190 }
            ] },
        { id: 'living', name: 'LIVING ROOM', wall: '#1a1620', floor: '#100c14', wallpaper: 'floral', accent: '#3a2040',
            entryPoints: [
                { x: 90,  y: 250, w: 150, h: 250, type: 'door', label: 'PATIO', locked: true, barricade: 0, maxBarricade: 4, anchorX: 160 },
                { x: 640, y: 250, w: 150, h: 250, type: 'window', label: 'WINDOW', locked: true, barricade: 0, maxBarricade: 3, anchorX: 710 }
            ],
            objects: [
                { type: 'sofa', x: 340, y: 420, w: 240, h: 80 },
                { type: 'tv', x: 380, y: 190, w: 140, h: 100, on: false },
                { type: 'fireplace', x: 500, y: 330, w: 130, h: 130 }
            ] },
        { id: 'bathroom', name: 'BATHROOM', wall: '#1a2028', floor: '#0f1418', wallpaper: 'tiles', accent: '#2a4048',
            entryPoints: [
                { x: 720, y: 260, w: 140, h: 220, type: 'window', label: 'WINDOW', locked: true, barricade: 0, maxBarricade: 2, anchorX: 790 },
                { x: 130, y: 200, w: 100, h: 120, type: 'vent', label: 'VENT', locked: true, barricade: 0, maxBarricade: 2, anchorX: 180 }
            ],
            objects: [
                { type: 'sink', x: 300, y: 380, w: 90, h: 100 },
                { type: 'mirror', x: 300, y: 200, w: 90, h: 120 },
                { type: 'tub', x: 460, y: 400, w: 300, h: 100 }
            ] },
        { id: 'basement', name: 'BASEMENT', wall: '#141210', floor: '#0a0806', wallpaper: 'concrete', accent: '#2a2018',
            entryPoints: [
                { x: 100, y: 240, w: 150, h: 200, type: 'hatch', label: 'HATCH', locked: true, barricade: 0, maxBarricade: 4, anchorX: 175 },
                { x: 620, y: 420, w: 130, h: 60,  type: 'drain', label: 'DRAIN', locked: true, barricade: 0, maxBarricade: 3, anchorX: 685 }
            ],
            objects: [
                { type: 'boiler', x: 380, y: 300, w: 120, h: 200 },
                { type: 'crate', x: 550, y: 380, w: 80, h: 80 },
                { type: 'crate', x: 650, y: 400, w: 60, h: 60 }
            ] },
        { id: 'attic', name: 'ATTIC', wall: '#1a1410', floor: '#100c08', wallpaper: 'wood_panels', accent: '#3a2818',
            entryPoints: [
                { x: 400, y: 130, w: 140, h: 100, type: 'window', label: 'SKYLIGHT', locked: true, barricade: 0, maxBarricade: 3, anchorX: 470 },
                { x: 720, y: 380, w: 130, h: 100, type: 'hatch', label: 'HATCH', locked: true, barricade: 0, maxBarricade: 3, anchorX: 785 }
            ],
            objects: [
                { type: 'boxes', x: 100, y: 380, w: 100, h: 90 },
                { type: 'boxes', x: 220, y: 420, w: 80, h: 70 },
                { type: 'oldchair', x: 600, y: 400, w: 80, h: 90 },
                { type: 'cobweb', x: 60, y: 40, w: 120, h: 120 }
            ] }
    ];
}

// ============ STATE ============
var gameState = {};
function freshState() {
    return {
        scene: 'title', difficulty: 'normal',
        hour: 0, hourTimer: 0, hourLength: 17,
        attackTimer: 0, attackInterval: 4.8, baseInterval: 4.8,
        demonForm: 'baphomet', formTimer: 8,
        flickerTimer: 0, demonBob: 0, demonPose: 'idle', poseTimer: 0,
        msg: '', msgTimer: 0, shake: 0, warning: 0,
        roomIndex: 0,
        stamina: 100, maxStamina: 100, sprinting: false,
        flashlight: false, battery: 100, maxBattery: 100,
        noise: 0, rooms: buildRooms(),
        demonTargetRoom: 0, demonTargetEntry: 0,
        timeSurvived: 0, deathTimer: 0, winTimer: 0,
        jumpscareTimer: 0, jumpscareForm: 'baphomet', deathReason: '',
        heartbeatTimer: 0, heartbeatInterval: 1.5,
        moonFlicker: 0, paused: false,
        cutsceneFrame: 0, cutsceneTimer: 0,
        bloodSplats: [], sparks: [], keys: {},
        seenBaphometApproach: false,
        player: {
            x: 450, y: FLOOR_Y, facing: 1, state: 'idle',
            walkTimer: 0, lockTimer: 0, lockTarget: null,
            walkTargetX: null, idleBreathe: 0
        }
    };
}

// ============ HELPERS ============
function currentRoom() { return gameState.rooms[gameState.roomIndex]; }
function totalLocked() {
    var c = 0;
    for (var i = 0; i < gameState.rooms.length; i++)
        for (var j = 0; j < gameState.rooms[i].entryPoints.length; j++)
            if (gameState.rooms[i].entryPoints[j].locked) c++;
    return c;
}
function totalEntryPoints() {
    var c = 0;
    for (var i = 0; i < gameState.rooms.length; i++) c += gameState.rooms[i].entryPoints.length;
    return c;
}
function updateHUD() {
    lockCountSpan.textContent = totalLocked() + '/' + totalEntryPoints();
    clockDisplaySpan.textContent = HOURS[gameState.hour];
    batteryDisplaySpan.textContent = Math.max(0, Math.floor(gameState.battery)) + '%';
    staminaDisplaySpan.textContent = Math.max(0, Math.floor(gameState.stamina)) + '%';
}
function findNearestEntry() {
    var room = currentRoom();
    var px = gameState.player.x;
    var nearest = null; var nd = INTERACT_RANGE;
    for (var i = 0; i < room.entryPoints.length; i++) {
        var ep = room.entryPoints[i];
        var d = Math.abs(px - ep.anchorX);
        if (d < nd) { nd = d; nearest = ep; }
    }
    return nearest;
}

// ============ START ============
function startGame(difficulty) {
    initAudio();
    var savedDiff = difficulty;
    gameState = freshState();
    gameState.difficulty = savedDiff;
    var d = DIFFICULTIES[savedDiff];
    gameState.hourLength = d.hourLen;
    gameState.baseInterval = d.baseInterval;
    gameState.attackInterval = d.baseInterval;
    gameState.scene = 'playing';
    gameState.msg = 'Lock every window. Lock every door.';
    gameState.msgTimer = 3.5;
    updateHUD();
}

// ============ INPUT ============
window.addEventListener('keydown', function(e) {
    if (!gameState.keys) gameState.keys = {};
    var k = e.key.toLowerCase();
    gameState.keys[k] = true;
    var sc = gameState.scene;
    if (sc === 'cutscene_intro' || sc === 'cutscene_baphomet') {
        if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();
            gameState.cutsceneFrame++;
            gameState.cutsceneTimer = 0;
            sfxCut();
            if (gameState.cutsceneFrame >= 4) {
                gameState.scene = sc === 'cutscene_intro' ? 'title' : 'playing';
            }
        }
        return;
    }
    if (sc === 'title') {
        if (e.key === '1') startGame('easy');
        if (e.key === '2') startGame('normal');
        if (e.key === '3') startGame('nightmare');
        return;
    }
    if (sc === 'playing' || sc === 'paused') {
        if (e.key === 'Escape') { gameState.paused = !gameState.paused; return; }
        if (gameState.paused) return;
        if (e.key === ' ') { e.preventDefault(); toggleFlashlight(); }
        if (k === 'e') tryInteract();
        if (e.key === 'Tab') { e.preventDefault(); switchRoom(1); }
    }
    if (sc === 'dead' || sc === 'win') {
        if (e.key === 'Enter' || e.key === ' ') gameState.scene = 'title';
    }
});
window.addEventListener('keyup', function(e) {
    if (gameState.keys) gameState.keys[e.key.toLowerCase()] = false;
});
canvas.addEventListener('click', function(e) {
    initAudio();
    var r = canvas.getBoundingClientRect();
    var mx = (e.clientX - r.left) * (canvas.width / r.width);
    var my = (e.clientY - r.top) * (canvas.height / r.height);
    var sc = gameState.scene;
    if (sc === 'cutscene_intro' || sc === 'cutscene_baphomet') {
        gameState.cutsceneFrame++;
        gameState.cutsceneTimer = 0;
        sfxCut();
        if (gameState.cutsceneFrame >= 4) {
            gameState.scene = sc === 'cutscene_intro' ? 'title' : 'playing';
        }
        return;
    }
    if (sc === 'title') {
        var btnY = 400;
        if (my > btnY && my < btnY + 55) {
            if (mx > 200 && mx < 340) startGame('easy');
            else if (mx > 360 && mx < 540) startGame('normal');
            else if (mx > 560 && mx < 700) startGame('nightmare');
        }
        return;
    }
    if (sc !== 'playing' || gameState.paused) return;
    if (gameState.player.state === 'locking') return;
    var tabW = 128, tabY = 555, startX = 450 - (gameState.rooms.length * tabW) / 2;
    if (my >= tabY && my <= tabY + 32) {
        for (var ti = 0; ti < gameState.rooms.length; ti++) {
            var tx = startX + ti * tabW;
            if (mx >= tx + 4 && mx <= tx + tabW - 4) {
                if (ti !== gameState.roomIndex) switchRoomTo(ti);
                return;
            }
        }
    }
    var room = currentRoom();
    for (var i = 0; i < room.entryPoints.length; i++) {
        var ep = room.entryPoints[i];
        if (mx >= ep.x && mx <= ep.x + ep.w && my >= ep.y && my <= ep.y + ep.h) {
            gameState.player.walkTargetX = ep.anchorX;
            gameState.player.state = 'walking';
            return;
        }
    }
});
function toggleFlashlight() {
    if (gameState.battery <= 0) { gameState.flashlight = false; return; }
    gameState.flashlight = !gameState.flashlight; sfxFlash();
}
function tryInteract() {
    if (gameState.player.state === 'locking') return;
    var ep = findNearestEntry();
    if (!ep) { gameState.msg = 'Nothing nearby'; gameState.msgTimer = 1; return; }
    gameState.player.facing = (ep.anchorX > gameState.player.x) ? 1 : -1;
    gameState.player.state = 'locking';
    gameState.player.lockTimer = 0.55;
    gameState.player.lockTarget = ep;
}
function switchRoom(dir) {
    if (gameState.player.state === 'locking') return;
    var n = gameState.rooms.length;
    switchRoomTo((gameState.roomIndex + dir + n) % n);
}
function switchRoomTo(idx) {
    gameState.roomIndex = idx;
    gameState.player.x = 450;
    gameState.player.walkTargetX = null;
    gameState.player.state = 'idle';
    sfxDoor();
    gameState.noise = Math.min(100, gameState.noise + 10);
    updateHUD();
}
function applyLockAction(ep) {
    if (ep.locked) { ep.locked = false; sfxUnlock(); gameState.msg = ep.label + ' unlocked!'; }
    else if (ep.barricade < ep.maxBarricade) { ep.barricade++; sfxBarricade(); gameState.msg = 'Barricade ' + ep.barricade + '/' + ep.maxBarricade; }
    else { ep.locked = true; ep.barricade = 0; sfxLock(); gameState.msg = ep.label + ' locked again'; }
    gameState.msgTimer = 1.2;
    updateHUD();
}

// ============ UPDATE ============
function update(dt) {
    if (gameState.scene === 'title') { gameState.demonBob = Math.sin(Date.now()*0.003)*4; return; }
    if (gameState.scene === 'cutscene_intro' || gameState.scene === 'cutscene_baphomet') {
        gameState.cutsceneTimer += dt;
        return;
    }
    if (gameState.scene === 'dead') { gameState.deathTimer += dt; gameState.jumpscareTimer += dt; gameState.shake = Math.max(0, gameState.shake - dt*2); return; }
    if (gameState.scene === 'win') { gameState.winTimer += dt; return; }
    if (gameState.paused) return;
    gameState.timeSurvived += dt;
    updatePlayer(dt);

    gameState.sprinting = !!gameState.keys['shift'];
    if (gameState.sprinting && gameState.stamina > 0 && gameState.player.state === 'walking') {
        gameState.stamina = Math.max(0, gameState.stamina - dt*18);
        gameState.noise = Math.min(100, gameState.noise + dt*25);
    } else {
        gameState.stamina = Math.min(gameState.maxStamina, gameState.stamina + dt*12);
    }
    if (gameState.flashlight) {
        gameState.battery = Math.max(0, gameState.battery - dt*4.5);
        if (gameState.battery <= 0) { gameState.flashlight = false; gameState.msg = 'Battery dead!'; gameState.msgTimer = 2; }
    } else {
        gameState.battery = Math.min(gameState.maxBattery, gameState.battery + dt*0.6);
    }
    gameState.noise = Math.max(0, gameState.noise - dt*20);

    if (gameState.msgTimer > 0) gameState.msgTimer -= dt;
    if (gameState.formTimer > 0) gameState.formTimer -= dt;
    if (gameState.flickerTimer > 0) gameState.flickerTimer -= dt;
    if (gameState.shake > 0) gameState.shake = Math.max(0, gameState.shake - dt*2.5);
    if (gameState.warning > 0) gameState.warning = Math.max(0, gameState.warning - dt);
    if (gameState.poseTimer > 0) gameState.poseTimer -= dt;
    gameState.demonBob = Math.sin(Date.now()*0.008)*3;

    for (var i = gameState.bloodSplats.length-1; i >= 0; i--) {
        gameState.bloodSplats[i].life -= dt;
        if (gameState.bloodSplats[i].life <= 0) gameState.bloodSplats.splice(i, 1);
    }
    for (var j = gameState.sparks.length-1; j >= 0; j--) {
        gameState.sparks[j].life -= dt;
        gameState.sparks[j].vy += dt*200;
        gameState.sparks[j].y += gameState.sparks[j].vy * dt;
        if (gameState.sparks[j].life <= 0) gameState.sparks.splice(j, 1);
    }
    var lockedRatio = totalLocked() / totalEntryPoints();
    gameState.heartbeatInterval = 0.5 + lockedRatio*1.5 + gameState.noise*0.003;
    gameState.heartbeatTimer += dt;
    if (gameState.heartbeatTimer >= gameState.heartbeatInterval) { gameState.heartbeatTimer = 0; sfxHeartbeat(); }
    if (Math.random() < 0.004) gameState.flickerTimer = 0.3;
    gameState.moonFlicker = Math.random() < 0.015 ? 0.15 : 0;
    if (gameState.formTimer <= 0) {
        var forms = ['baphomet', 'baphomet_panther', 'baphomet_wolf'];
        var nf = forms[Math.floor(Math.random()*3)];
        if (nf === gameState.demonForm) nf = forms[(forms.indexOf(nf)+1)%3];
        gameState.demonForm = nf;
        gameState.msg = 'Demon reveals: ' + nf.toUpperCase().replace('_', '-');
        gameState.msgTimer = 2;
        gameState.formTimer = 7 + Math.random()*6;
    }
    gameState.attackTimer += dt;
    if (gameState.attackTimer >= gameState.attackInterval - 0.9 && gameState.warning <= 0) { gameState.warning = 0.9; sfxGrowl(); }
    if (gameState.attackTimer >= gameState.attackInterval) { gameState.attackTimer = 0; performAttack(); }

    gameState.hourTimer += dt;
    if (gameState.hourTimer >= gameState.hourLength) {
        gameState.hourTimer = 0;
        if (gameState.hour < 6) {
            gameState.hour++;
            updateHUD();
            if (gameState.hour === 4 && !gameState.seenBaphometApproach) {
                gameState.seenBaphometApproach = true;
                gameState.scene = 'cutscene_baphomet';
                gameState.cutsceneFrame = 0;
                gameState.cutsceneTimer = 0;
                return;
            }
            var scaleTable = [1, 0.85, 0.72, 0.60, 0.50, 0.38];
            var scale = scaleTable[gameState.hour] || 0.38;
            gameState.baseInterval = DIFFICULTIES[gameState.difficulty].baseInterval * scale;
            gameState.attackInterval = Math.min(gameState.attackInterval, gameState.baseInterval);
            gameState.battery = Math.min(gameState.maxBattery, gameState.battery + 25);
            gameState.stamina = gameState.maxStamina;
            if (gameState.hour >= 6) { gameState.scene = 'win'; gameState.winTimer = 0; sfxWin(); }

}
function updatePlayer(dt) {
    var p = gameState.player;
    p.idleBreathe += dt;
    var moveDir = 0;
    if (p.state !== 'locking') {
        var left = gameState.keys['a'] || gameState.keys['arrowleft'];
        var right = gameState.keys['d'] || gameState.keys['arrowright'];
        if (left) moveDir = -1;
        if (right) moveDir = 1;
        if (moveDir !== 0) { p.walkTargetX = null; p.state = 'walking'; p.facing = moveDir; }
    }
    var speed = PLAYER_SPEED;
    if (gameState.sprinting && gameState.stamina > 0) speed *= PLAYER_SPRINT_MULT;
    if (p.state === 'walking' && p.walkTargetX !== null && moveDir === 0) {
        var diff = p.walkTargetX - p.x;
        if (Math.abs(diff) < 6) { p.x = p.walkTargetX; p.walkTargetX = null; p.state = 'idle'; tryInteract(); }
        else { moveDir = diff > 0 ? 1 : -1; p.facing = moveDir; }
    }
    if (moveDir !== 0 && p.state !== 'locking') {
        p.x += moveDir * speed * dt;
        if (p.x < 60) p.x = 60;
        if (p.x > 840) p.x = 840;
        p.state = 'walking';
        p.walkTimer += dt;
        if (Math.floor(p.walkTimer * 6) % 2 === 0 && Math.random() < 0.35) sfxStep();
    } else if (p.state !== 'locking') { p.state = 'idle'; p.walkTimer = 0; }
    if (p.state === 'locking') {
        p.lockTimer -= dt;
        if (p.lockTimer <= 0) { if (p.lockTarget) applyLockAction(p.lockTarget); p.lockTarget = null; p.state = 'idle'; }
    }
}

// ============ DEMON AI ============
function performAttack() {
    var rooms = gameState.rooms;
    var candidates = [];
    for (var ri = 0; ri < rooms.length; ri++) {
        var r = rooms[ri];
        for (var ei = 0; ei < r.entryPoints.length; ei++) {
            var ep = r.entryPoints[ei];
            var weight = 1.0;
            if (!ep.locked) weight += 2.8;
            if (ep.barricade > 0) weight -= ep.barricade * 0.4;
            if (ri === gameState.roomIndex) weight += 0.6;
            if (ri === gameState.demonTargetRoom && ei === gameState.demonTargetEntry) weight += 1.3;
            if (weight < 0.1) weight = 0.1;
            candidates.push({ ri: ri, ei: ei, w: weight });
        }
    }
    var total = 0;
    for (var i = 0; i < candidates.length; i++) total += candidates[i].w;
    var roll = Math.random() * total;
    var pick = candidates[0];
    for (var k = 0; k < candidates.length; k++) { roll -= candidates[k].w; if (roll <= 0) { pick = candidates[k]; break; } }
    var room = rooms[pick.ri];
    var entry = room.entryPoints[pick.ei];
    var preferredType = gameState.demonForm === 'baphomet' ? 'door'
                      : gameState.demonForm === 'baphomet_panther' ? 'window' : 'vent';
    if (entry.type !== preferredType && Math.random() < 0.45) {
        var matching = [];
        for (var m = 0; m < candidates.length; m++)
            if (rooms[candidates[m].ri].entryPoints[candidates[m].ei].type === preferredType) matching.push(candidates[m]);
        if (matching.length > 0) { pick = matching[Math.floor(Math.random()*matching.length)]; room = rooms[pick.ri]; entry = room.entryPoints[pick.ei]; }
    }
    gameState.demonTargetRoom = pick.ri;
    gameState.demonTargetEntry = pick.ei;
    attackEntry(room, entry);
}
function attackEntry(room, ep) {
    gameState.demonPose = 'attack';
    gameState.poseTimer = 0.5;
    gameState.shake = 1.0;
    sfxBreak();
    if (ep.barricade > 0) {
        ep.barricade--;
        gameState.msg = gameState.demonForm.toUpperCase().replace('_','-') + ' destroys a barricade!';
        gameState.msgTimer = 1.8;
        for (var i = 0; i < 14; i++)
            gameState.sparks.push({ x: ep.x + ep.w/2 + (Math.random()-0.5)*ep.w, y: ep.y + ep.h/2 + (Math.random()-0.5)*ep.h, vy: -Math.random()*200, life: 0.6 + Math.random()*0.5 });
        return;
    }
    if (ep.locked) {
        ep.locked = false;
        gameState.msg = gameState.demonForm.toUpperCase().replace('_','-') + ' broke ' + ep.label + ' in ' + room.name + '!';
        gameState.msgTimer = 1.8;
        gameState.bloodSplats.push({ x: ep.x + ep.w/2, y: ep.y + ep.h/2, life: 3 });
        updateHUD();
        return;
    }
    gameState.scene = 'dead';
    gameState.deathTimer = 0;
    gameState.jumpscareTimer = 0;
    gameState.jumpscareForm = gameState.demonForm;
    gameState.deathReason = 'The demon found an opening in ' + room.name + '.';
    sfxScream();
    gameState.shake = 2;
}

function drawPlayer() {
    var p = gameState.player;
    var cx = Math.floor(p.x), cy = p.y, facing = p.facing;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.beginPath(); ctx.ellipse(cx, cy+4, 26, 8, 0, 0, Math.PI*2); ctx.fill();
    var breathe = Math.sin(p.idleBreathe*3) * 1;
    var walking = p.state === 'walking';
    var walkPhase = Math.sin(p.walkTimer*14);
    var bob = walking ? Math.abs(Math.sin(p.walkTimer*14)) * 2 : 0;
    var legOffset = walking ? walkPhase*4 : 0;
    var armSwing = walking ? walkPhase*4 : 0;
    var locking = p.state === 'locking';
    var lockProgress = locking ? (1 - p.lockTimer/0.55) : 0;
    var lean = locking ? Math.sin(lockProgress*Math.PI)*3 : 0;
    var reachArm = locking ? Math.sin(lockProgress*Math.PI)*22 : 0;
    var baseY = cy - bob;
    px(cx-14, baseY-20+legOffset, 10, 20, '#2a3040');
    px(cx-14, baseY-20+legOffset, 10, 4, '#3a4050');
    px(cx+4, baseY-20-legOffset, 10, 20, '#2a3040');
    px(cx+4, baseY-20-legOffset, 10, 4, '#3a4050');
    px(cx-16, baseY-2+legOffset, 14, 6, '#1a1010');
    px(cx+2, baseY-2-legOffset, 14, 6, '#1a1010');
    var torsoY = baseY - 46;
    px(cx-14, torsoY, 28, 26, '#5a7090');
    px(cx-14, torsoY, 28, 4, '#7a90b0');
    px(cx-14, torsoY+22, 28, 4, '#3a5070');
    px(cx-20, torsoY+4+armSwing, 8, 20, '#5a7090');
    px(cx-20, torsoY+22+armSwing, 8, 6, '#e8c0a0');
    var rightArmY = torsoY+4-armSwing;
    if (locking) {
        px(cx+14, rightArmY-reachArm, 8, 20-reachArm*0.5, '#5a7090');
        px(cx+14, rightArmY-reachArm-6, 8, 8, '#e8c0a0');
        if (lockProgress > 0.6) {
            ctx.fillStyle = 'rgba(255,220,100,' + ((lockProgress-0.6)*2.5) + ')';
            ctx.beginPath(); ctx.arc(cx+18, rightArmY-reachArm-10, 6, 0, Math.PI*2); ctx.fill();
        }
    } else {
        px(cx+14, rightArmY, 8, 20, '#5a7090');
        px(cx+14, rightArmY+18, 8, 6, '#e8c0a0');
    }
    var headY = torsoY-26+breathe*0.5+lean;
    px(cx-4, torsoY-2, 8, 4, '#d8b090');
    px(cx-12, headY, 24, 24, '#f0c8a0');
    px(cx-12, headY, 24, 3, '#f8d8b0');
    px(cx-13, headY-4, 26, 10, '#3a2010');
    px(cx-13, headY-4, 26, 3, '#5a3820');
    if (facing === 1) {
        px(cx-2, headY+10, 4, 5, '#1a1010'); px(cx+6, headY+10, 4, 5, '#1a1010');
        px(cx-2, headY+10, 2, 2, '#fff'); px(cx+6, headY+10, 2, 2, '#fff');
    } else {
        px(cx-6, headY+10, 4, 5, '#1a1010'); px(cx+2, headY+10, 4, 5, '#1a1010');
        px(cx-6, headY+10, 2, 2, '#fff'); px(cx+2, headY+10, 2, 2, '#fff');
    }
    px(cx-3, headY+18, 6, 2, '#8a5040');
    var near = findNearestEntry();
    if (near && p.state !== 'locking') {
        var dist = Math.abs(p.x - near.anchorX);
        var alpha2 = Math.max(0, 1 - dist/INTERACT_RANGE) * 0.9;
        if (alpha2 > 0.1) {
            ctx.save();

            ctx.fillStyle = '#f0e0a0';
            ctx.font = 'bold 14px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('[E]', cx, headY - 20 + Math.sin(Date.now()*0.01)*3);
            ctx.restore();
        }
    }
}

// ============ HUD ============
function drawHUD() {
    if (gameState.msgTimer > 0 && gameState.msg) {
        ctx.textAlign = 'center'; ctx.font = 'bold 24px "Courier New", monospace';
        ctx.shadowColor = '#6a1e1e'; ctx.shadowBlur = 12;
        ctx.fillStyle = '#f0d0a0';
        ctx.fillText(gameState.msg, 450, 105);
        ctx.shadowBlur = 0;
    }
    if (gameState.warning > 0) {
        var a = Math.abs(Math.sin(Date.now()*0.03)) * 0.4;
        ctx.fillStyle = 'rgba(180,0,0,' + a + ')'; ctx.fillRect(0, 0, 900, 600);
    }
    var tabW = 128, tabY = 555, startX = 450 - (gameState.rooms.length * tabW) / 2;
    for (var i = 0; i < gameState.rooms.length; i++) {
        var tx = startX + i * tabW;
        var active = i === gameState.roomIndex;
        ctx.fillStyle = active ? 'rgba(90,120,160,0.85)' : 'rgba(30,40,55,0.75)';
        ctx.fillRect(tx+4, tabY, tabW-8, 32);
        ctx.strokeStyle = active ? '#a0c0ff' : '#4b5e77';
        ctx.lineWidth = 2; ctx.strokeRect(tx+4, tabY, tabW-8, 32);
        ctx.fillStyle = active ? '#e5efff' : '#8a9aad';
        ctx.font = 'bold 11px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(gameState.rooms[i].name, tx + tabW/2, tabY + 21);
    }
    var nw = 180, nx = 360, ny = 20;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(nx, ny, nw, 12);
    ctx.fillStyle = gameState.noise > 60 ? '#e05050' : '#6aa0d0';
    ctx.fillRect(nx, ny, nw * (gameState.noise/100), 12);
    ctx.strokeStyle = '#4b5e77'; ctx.lineWidth = 2; ctx.strokeRect(nx, ny, nw, 12);
    ctx.fillStyle = '#7a8a9a'; ctx.font = '10px "Courier New", monospace';
    ctx.textAlign = 'left'; ctx.fillText('NOISE', nx, ny - 3);
    ctx.textAlign = 'right'; ctx.font = 'bold 14px "Courier New", monospace';
    var formCol = gameState.demonForm === 'baphomet' ? '#ff2a2a'
                : gameState.demonForm === 'baphomet_panther' ? '#ff2a8c' : '#f0e13b';
    ctx.fillStyle = formCol;
    ctx.fillText('▲ ' + gameState.demonForm.toUpperCase().replace('_', '-'), 880, 25);
    var prog = Math.min(1, gameState.hourTimer / gameState.hourLength);
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(360, 40, 180, 6);
    ctx.fillStyle = '#c9a86a'; ctx.fillRect(360, 40, 180 * prog, 6);
}

// ============ DEATH SCREENS ============
function drawDeath() {
    var t = Math.min(1, gameState.jumpscareTimer);
    var scale = 1 + t * 3.2;
    var bx = 450, baseY = 300 + Math.sin(Date.now()*0.1)*20;
    ctx.save();
    ctx.translate(bx, baseY); ctx.scale(scale, scale); ctx.translate(-bx, -baseY);
    var form = gameState.jumpscareForm;
    if (form === 'baphomet') drawBaphomet(bx, baseY, true);
    else if (form === 'baphomet_panther') drawBaphometPanther(bx, baseY, true);
    else drawBaphometWolf(bx, baseY, true);
    ctx.restore();
    ctx.fillStyle = 'rgba(120,0,0,' + (t*0.55) + ')'; ctx.fillRect(0, 0, 900, 600);
    if (gameState.shake > 0) ctx.translate((Math.random()-0.5)*gameState.shake*30, (Math.random()-0.5)*gameState.shake*30);
    if (gameState.jumpscareTimer > 1.5) {
        ctx.fillStyle = 'rgba(0,0,0,0.9)'; ctx.fillRect(0, 0, 900, 600);
        if (gameState.jumpscareForm === 'baphomet') drawDeathBaphomet();
        else if (gameState.jumpscareForm === 'baphomet_panther') drawDeathPanther();
        else drawDeathWolf();
        ctx.textAlign = 'center';
        ctx.font = 'bold 56px "Courier New", monospace';
        ctx.fillStyle = '#c02020';
        ctx.shadowColor = '#500'; ctx.shadowBlur = 25;
        ctx.fillText('GAME OVER', 450, 520);
        ctx.shadowBlur = 0;
        ctx.font = '18px "Courier New", monospace';
        ctx.fillStyle = '#c0a0a0';
        ctx.fillText(gameState.deathReason || 'The demon got you.', 450, 555);
        ctx.fillStyle = '#7a8a9a'; ctx.font = '14px "Courier New", monospace';
        ctx.fillText('Survived ' + gameState.timeSurvived.toFixed(1) + 's · PRESS ENTER', 450, 580);
    }
}

    ctx.lineTo(760, 400); ctx.lineTo(680, 380);
    ctx.lineTo(620, 420); ctx.lineTo(600, 480);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(760, 380, 40, 0, Math.PI*2); ctx.fill();
    ctx.save(); ctx.shadowColor = '#ff2a8c'; ctx.shadowBlur = 30;
    px(742, 372, 10, 8, '#ff2a8c'); px(772, 372, 10, 8, '#ff2a8c');
    ctx.restore();
    drawPentagram(300, 220, 70, 'rgba(255,42,140,0.6)', 0.4, 20, true);
}
function drawDeathWolf() {
    px(0, 0, 900, 600, '#0a0808');
    for (var s = 0; s < 20; s++) {
        ctx.fillStyle = 'rgba(60,40,20,0.6)';
        ctx.beginPath();
        ctx.moveTo(s*50, 0); ctx.lineTo(s*50 + 30, 300); ctx.lineTo(s*50 + 10, 300);
        ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = 'rgba(100,10,10,0.85)';
    ctx.beginPath(); ctx.ellipse(450, 480, 300, 60, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(60,5,5,0.9)';
    ctx.beginPath(); ctx.ellipse(450, 485, 220, 40, 0, 0, Math.PI*2); ctx.fill();
    for (var b = 0; b < 50; b++) {
        ctx.fillStyle = 'rgba(' + (100 + Math.random()*60) + ',10,20,' + (0.4 + Math.random()*0.5) + ')';
        ctx.beginPath(); ctx.arc(Math.random()*900, Math.random()*400, 2 + Math.random()*10, 0, Math.PI*2); ctx.fill();
    }
    px(150, 460, 600, 20, 'rgba(80,5,10,0.7)');
    px(380, 440, 40, 20, '#3a2030');
    px(420, 450, 30, 14, '#3a2030');
    px(300, 460, 40, 14, '#2a1a20');
    px(430, 420, 40, 25, '#f0c8a0');
    px(435, 425, 5, 3, '#1a1010');
    px(455, 425, 5, 3, '#1a1010');
    ctx.fillStyle = '#0a0808';
    ctx.beginPath();
    ctx.moveTo(620, 500); ctx.lineTo(820, 500); ctx.lineTo(800, 400);
    ctx.lineTo(730, 370); ctx.lineTo(640, 400); ctx.lineTo(620, 500);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(760, 370, 45, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(730, 340); ctx.lineTo(740, 300); ctx.lineTo(755, 335); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(775, 340); ctx.lineTo(785, 300); ctx.lineTo(790, 340); ctx.closePath(); ctx.fill();
    ctx.save(); ctx.shadowColor = '#f0e13b'; ctx.shadowBlur = 30;
    px(745, 365, 10, 8, '#f0e13b'); px(775, 365, 10, 8, '#f0e13b');
    ctx.restore();
    drawPentagram(450, 220, 80, 'rgba(240,225,60,0.7)', 0.35, 22, true);
}

function drawWin() {
    var t = Math.min(1, gameState.winTimer / 3);
    var grad = ctx.createLinearGradient(0, 600, 0, 0);
    grad.addColorStop(0, 'rgb(' + Math.floor(40 + t*200) + ',' + Math.floor(20 + t*120) + ',' + Math.floor(30 + t*40) + ')');
    grad.addColorStop(0.5, 'rgb(' + Math.floor(20 + t*100) + ',' + Math.floor(30 + t*60) + ',' + Math.floor(50 + t*60) + ')');
    grad.addColorStop(1, 'rgb(10,15,30)');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, 900, 600);
    var sunY = 500 - t * 250;
    ctx.fillStyle = 'rgba(255,220,120,' + (0.6 + t*0.4) + ')';
    ctx.beginPath(); ctx.arc(450, sunY, 80, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,240,180,' + (0.4 + t*0.4) + ')';
    ctx.beginPath(); ctx.arc(450, sunY, 50, 0, Math.PI*2); ctx.fill();
    ctx.textAlign = 'center';
    ctx.font = 'bold 70px "Courier New", monospace';
    ctx.fillStyle = '#fff0c0';
    ctx.shadowColor = '#ffb040'; ctx.shadowBlur = 30;
    ctx.fillText('6:00 AM', 450, 190);
    ctx.shadowBlur = 0;
    ctx.font = 'bold 38px "Courier New", monospace';
    ctx.fillStyle = '#c8e0a0';
    ctx.fillText('YOU SURVIVED', 450, 260);
    ctx.font = '20px "Courier New", monospace';
    ctx.fillStyle = '#e0e8f0';
    ctx.fillText('Time: ' + gameState.timeSurvived.toFixed(1) + 's', 450, 320);
    ctx.fillStyle = '#a0c0ff';
    ctx.fillText('PRESS ENTER TO RETURN', 450, 400);
}
function drawPause() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, 900, 600);
    ctx.textAlign = 'center';
    ctx.font = 'bold 60px "Courier New", monospace';
    ctx.fillStyle = '#c8d8f0'; ctx.fillText('PAUSED', 450, 280);
    ctx.font = '18px "Courier New", monospace';
    ctx.fillStyle = '#8a9aad'; ctx.fillText('Press ESC to resume', 450, 340);
}

// ============ MAIN DRAW ============
function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (gameState.scene === 'title') { drawTitle(); return; }
    if (gameState.scene === 'cutscene_intro') { drawCutsceneIntro(); return; }
    if (gameState.scene === 'cutscene_baphomet') { drawCutsceneBaphomet(); return; }
    if (gameState.scene === 'dead') { drawDeath(); return; }
    if (gameState.scene === 'win') { drawWin(); return; }
    ctx.save();
    if (gameState.shake > 0) ctx.translate((Math.random()-0.5)*gameState.shake*12, (Math.random()-0.5)*gameState.shake*12);
    drawHouse();
    drawDemon();
    drawPlayer();
    ctx.restore();
    if (gameState.flickerTimer > 0) {
        ctx.fillStyle = 'rgba(80,0,0,' + (Math.random()*0.25) + ')';
        ctx.fillRect(0, 0, 900, 600);
        for (var i = 0; i < 30; i++) { ctx.fillStyle = 'rgba(255,255,255,' + (Math.random()*0.1) + ')'; ctx.fillRect(Math.random()*900, Math.random()*600, 8, 8); }
    }
    drawHUD();
    if (gameState.paused) drawPause();
}

// ============ LOOP ============
var lastTime = performance.now() / 1000;
function gameLoop(now) {
    var nowSec = now / 1000;
    var dt = nowSec - lastTime;
    if (dt > 0.1) dt = 0.1;
    lastTime = nowSec;
    update(dt);
    draw();
    requestAnimationFrame(gameLoop);
}

// ============ INIT ============
document.getElementById('restartButton').addEventListener('click', function() {
    gameState = freshState();
    gameState.scene = 'title';
    updateHUD();
});
gameState = freshState();
gameState.scene = 'cutscene_intro';
gameState.cutsceneFrame = 0;
gameState.cutsceneTimer = 0;
updateHUD();
requestAnimationFrame(gameLoop);

})();
</script>
