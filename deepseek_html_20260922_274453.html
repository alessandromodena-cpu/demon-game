<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survive until 6AM · Demon Stalker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #0a0c0f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
        }
        .game-wrapper {
            background: #1a1e24;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 0 30px #00000080, inset 0 0 10px #2f3742;
        }
        canvas {
            display: block;
            width: 800px;
            height: 600px;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            border: 4px solid #3e4a5b;
            border-radius: 12px;
            background: #0b0d10;
            cursor: crosshair;
        }
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            color: #b3c7e5;
            text-shadow: 2px 2px 0 #0f141c;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .info-bar span {
            background: #1f262e;
            padding: 6px 16px;
            border-radius: 40px;
            border: 2px solid #4b5e77;
            box-shadow: inset 0 0 8px #000000;
        }
        .restart-btn {
            background: #2d3847;
            border: none;
            color: #e5efff;
            font-family: inherit;
            font-weight: bold;
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
            border: 2px solid #6a7f9c;
            transition: all 0.1s;
            letter-spacing: 1px;
            box-shadow: 0 4px 0 #0e1217;
        }
        .restart-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #0e1217;
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="info-bar">
        <span>🔒 LOCKS: <span id="lockCount">3</span>/3</span>
        <span>⏳ <span id="clockDisplay">12:00 AM</span></span>
        <button class="restart-btn" id="restartButton">↻ RESTART</button>
    </div>
</div>
<script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        // ---------- DOM elements ----------
        const lockCountSpan = document.getElementById('lockCount');
        const clockDisplaySpan = document.getElementById('clockDisplay');

        // ---------- Game state ----------
        const HOURS = ['12:00 AM', '1:00 AM', '2:00 AM', '3:00 AM', '4:00 AM', '5:00 AM', '6:00 AM'];
        let gameState = {
            hour: 0,                // 0=12AM, 1=1AM ... 5=5AM, 6=6AM win
            lock1: true,            // lock 1 active
            lock2: true,
            lock3: true,
            gameOver: false,
            win: false,
            // demon attack timing (seconds)
            attackTimer: 0,
            attackInterval: 4.5,
            // form: 'panther', 'dog', 'wolf'
            demonForm: 'panther',
            formTimer: 0,
            // distraction / flicker
            flickerTimer: 0,
            // cooldown for clicks
            clickCooldown: 0,
            // demon position for animation (pixel sprite offset)
            demonBob: 0,
            // message flash
            msg: '',
            msgTimer: 0,
            // difficulty scaling
            baseInterval: 4.5,
        };

        // lock positions (x, y, radius) – used for clicks and drawing
        const lockPositions = [
            { x: 220, y: 440, r: 38, id: 0 },
            { x: 400, y: 440, r: 38, id: 1 },
            { x: 580, y: 440, r: 38, id: 2 }
        ];

        // ---------- Reset game ----------
        function resetGame() {
            gameState = {
                hour: 0,
                lock1: true,
                lock2: true,
                lock3: true,
                gameOver: false,
                win: false,
                attackTimer: 0,
                attackInterval: 4.5,
                demonForm: 'panther',
                formTimer: 0,
                flickerTimer: 0,
                clickCooldown: 0,
                demonBob: 0,
                msg: '',
                msgTimer: 0,
                baseInterval: 4.5,
            };
            updateUI();
        }

        // helper to get lock array
        function getLocks() {
            return [gameState.lock1, gameState.lock2, gameState.lock3];
        }

        // ---------- Update UI span ----------
        function updateUI() {
            const locks = getLocks();
            const activeCount = locks.filter(v => v).length;
            lockCountSpan.textContent = activeCount;
            clockDisplaySpan.textContent = HOURS[gameState.hour];
        }

        // ---------- Toggle lock ----------
        function toggleLock(index) {
            if (gameState.gameOver || gameState.win) return;
            if (gameState.clickCooldown > 0) return; // tiny cooldown to avoid double toggle
            // toggle
            if (index === 0) gameState.lock1 = !gameState.lock1;
            if (index === 1) gameState.lock2 = !gameState.lock2;
            if (index === 2) gameState.lock3 = !gameState.lock3;
            // cooldown to avoid flickering on double click (optional)
            gameState.clickCooldown = 0.12;
            updateUI();
        }

        // ---------- Check win / lose ----------
        function checkGameConditions() {
            if (gameState.gameOver || gameState.win) return;

            const locks = getLocks();
            const activeCount = locks.filter(v => v).length;

            // LOSE: all locks broken => demon gets in
            if (activeCount === 0) {
                gameState.gameOver = true;
                gameState.msg = 'THE DEMON GOT IN...';
                gameState.msgTimer = 3.0;
                updateUI();
                return;
            }

            // WIN: reached 6 AM
            if (gameState.hour >= 6) {
                gameState.win = true;
                gameState.msg = 'YOU SURVIVED! 6:00 AM';
                gameState.msgTimer = 5.0;
                updateUI();
                return;
            }
        }

        // ---------- Hour advance (called when time passes one hour) ----------
        function advanceHour() {
            if (gameState.gameOver || gameState.win) return;
            if (gameState.hour < 6) {
                gameState.hour++;
                updateUI();

                // Each hour demon gets smarter / faster
                if (gameState.hour === 1) {
                    gameState.baseInterval = 3.8;
                } else if (gameState.hour === 2) {
                    gameState.baseInterval = 3.2;
                } else if (gameState.hour === 3) {
                    gameState.baseInterval = 2.7;
                } else if (gameState.hour === 4) {
                    gameState.baseInterval = 2.2;
                } else if (gameState.hour === 5) {
                    gameState.baseInterval = 1.7;  // intense final hour
                } else if (gameState.hour === 6) {
                    // win condition will be checked in update
                }
                gameState.attackInterval = gameState.baseInterval;
                // reset attack timer a bit so it doesn't instantly attack after hour change
                gameState.attackTimer = Math.min(gameState.attackTimer, 0.8);
                // change form randomly on hour change
                const forms = ['panther', 'dog', 'wolf'];
                gameState.demonForm = forms[Math.floor(Math.random() * forms.length)];
                // show form message
                gameState.msg = `Demon shifts into ${gameState.demonForm.toUpperCase()}`;
                gameState.msgTimer = 2.0;
            }
        }

        // ---------- Update (dt in seconds) ----------
        function update(dt) {
            // cooldowns
            if (gameState.clickCooldown > 0) gameState.clickCooldown -= dt;
            if (gameState.msgTimer > 0) gameState.msgTimer -= dt;
            if (gameState.formTimer > 0) gameState.formTimer -= dt;

            // flicker effect for distraction
            if (gameState.flickerTimer > 0) gameState.flickerTimer -= dt;

            // demon bobbing animation
            gameState.demonBob = Math.sin(Date.now() * 0.008) * 3;

            if (gameState.gameOver || gameState.win) {
                return;
            }

            // Attack timer
            gameState.attackTimer += dt;

            // demon might distract: random flicker (visual only)
            if (Math.random() < 0.005) { // ~0.5% per frame at 60fps ~ 0.3 per sec
                gameState.flickerTimer = 0.4;
            }

            // Form change over time (every 8–12 seconds)
            if (gameState.formTimer <= 0) {
                const forms = ['panther', 'dog', 'wolf'];
                const newForm = forms[Math.floor(Math.random() * forms.length)];
                if (newForm !== gameState.demonForm) {
                    gameState.demonForm = newForm;
                    gameState.msg = `Demon is now a ${newForm.toUpperCase()}`;
                    gameState.msgTimer = 1.8;
                }
                gameState.formTimer = 6 + Math.random() * 7;
            }

            // Attack behavior: after attackInterval seconds, demon breaks a random active lock
            if (gameState.attackTimer >= gameState.attackInterval) {
                gameState.attackTimer = 0; // reset

                // find active locks
                const activeIndices = [];
                const locks = getLocks();
                for (let i = 0; i < locks.length; i++) {
                    if (locks[i]) activeIndices.push(i);
                }

                if (activeIndices.length > 0) {
                    // pick a random active lock and break it
                    const randIdx = activeIndices[Math.floor(Math.random() * activeIndices.length)];
                    if (randIdx === 0) gameState.lock1 = false;
                    if (randIdx === 1) gameState.lock2 = false;
                    if (randIdx === 2) gameState.lock3 = false;
                    updateUI();
                    // visual feedback
                    gameState.msg = `💥 ${gameState.demonForm.toUpperCase()} broke a lock!`;
                    gameState.msgTimer = 1.2;

                    // each form has unique effect: panther faster? dog double attack? wolf extra distract?
                    // panther: 25% chance to immediately attack again (quick swipe)
                    // dog: 25% chance to break an additional lock (if any)
                    // wolf: 25% chance to cause flicker + confusion (no extra break but flicker)
                    if (gameState.demonForm === 'panther' && Math.random() < 0.25 && activeIndices.length > 1) {
                        // immediately break another lock
                        const remainingActive = activeIndices.filter(i => getLocks()[i] === true);
                        if (remainingActive.length > 0) {
                            const idx2 = remainingActive[Math.floor(Math.random() * remainingActive.length)];
                            if (idx2 === 0) gameState.lock1 = false;
                            if (idx2 === 1) gameState.lock2 = false;
                            if (idx2 === 2) gameState.lock3 = false;
                            updateUI();
                            gameState.msg = `🐾 PANTHER double swipe!`;
                            gameState.msgTimer = 1.2;
                        }
                    } else if (gameState.demonForm === 'dog' && Math.random() < 0.3) {
                        // dog breaks a second lock if available
                        const remainingActive = activeIndices.filter(i => getLocks()[i] === true);
                        if (remainingActive.length > 0) {
                            const idx2 = remainingActive[Math.floor(Math.random() * remainingActive.length)];
                            if (idx2 === 0) gameState.lock1 = false;
                            if (idx2 === 1) gameState.lock2 = false;
                            if (idx2 === 2) gameState.lock3 = false;
                            updateUI();
                            gameState.msg = `🐕 DOG bites another lock!`;
                            gameState.msgTimer = 1.2;
                        }
                    } else if (gameState.demonForm === 'wolf' && Math.random() < 0.35) {
                        // wolf causes heavy flicker
                        gameState.flickerTimer = 0.9;
                        gameState.msg = `🐺 WOLF howls! Vision blurs...`;
                        gameState.msgTimer = 1.5;
                    }
                }

                // check lose condition immediately
                checkGameConditions();

                // adjust next attack interval (slightly random)
                gameState.attackInterval = gameState.baseInterval * (0.8 + Math.random() * 0.4);
                // clamp minimum
                if (gameState.attackInterval < 0.9) gameState.attackInterval = 0.9;
            }

            // Advance hour every ~12 seconds of game time (feels tense)
            // We'll use a separate timer based on dt: gameState.hourTimer?
            // We need to add hour progress. I'll piggyback on attackTimer? No, separate variable.
            // Let's add a hidden hourTimer to gameState.
            if (gameState.hourTimer === undefined) gameState.hourTimer = 0;
            gameState.hourTimer += dt;
            // each hour lasts 15 seconds (adjustable)
            if (gameState.hourTimer >= 15) {
                gameState.hourTimer = 0;
                advanceHour();
                // after hour advance, check win
                checkGameConditions();
                if (gameState.win || gameState.gameOver) return;
            }

            // ensure win condition (if hour reached 6 via advanceHour)
            if (gameState.hour >= 6 && !gameState.win && !gameState.gameOver) {
                gameState.win = true;
                gameState.msg = 'YOU SURVIVED! 6:00 AM';
                gameState.msgTimer = 5.0;
                updateUI();
            }
        }

        // ---------- Drawing ----------

        // draw pixel-art style monster based on form
        function drawDemon() {
            const baseX = 400;
            const baseY = 120 + gameState.demonBob * 0.8;
            const form = gameState.demonForm;

            // flicker effect makes demon semi-transparent
            let alpha = 1.0;
            if (gameState.flickerTimer > 0) {
                alpha = Math.sin(Date.now() * 0.05) * 0.5 + 0.6; // flicker
            }

            ctx.save();
            ctx.globalAlpha = Math.min(1, alpha);

            // Dark aura behind demon
            ctx.fillStyle = '#1f0b0b';
            ctx.beginPath();
            ctx.arc(baseX, baseY, 85, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#2e0f0f';
            ctx.beginPath();
            ctx.arc(baseX, baseY-5, 65, 0, Math.PI * 2);
            ctx.fill();

            // draw based on form
            if (form === 'panther') {
                // pixel panther (black with magenta eyes)
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(baseX-45, baseY-30, 90, 80);
                // head
                ctx.fillStyle = '#0f0f0f';
                ctx.fillRect(baseX-35, baseY-65, 70, 50);
                // ears
                ctx.fillStyle = '#0f0f0f';
                ctx.fillRect(baseX-40, baseY-80, 18, 25);
                ctx.fillRect(baseX+22, baseY-80, 18, 25);
                // eyes (glowing magenta)
                ctx.fillStyle = '#ff3b8d';
                ctx.fillRect(baseX-22, baseY-50, 12, 12);
                ctx.fillRect(baseX+10, baseY-50, 12, 12);
                ctx.fillStyle = '#ff9acb';
                ctx.fillRect(baseX-18, baseY-46, 6, 6);
                ctx.fillRect(baseX+14, baseY-46, 6, 6);
                // whiskers
                ctx.fillStyle = '#aaa';
                ctx.fillRect(baseX-50, baseY-40, 20, 2);
                ctx.fillRect(baseX-50, baseY-30, 20, 2);
                ctx.fillRect(baseX+30, baseY-40, 20, 2);
                ctx.fillRect(baseX+30, baseY-30, 20, 2);
            } else if (form === 'dog') {
                // pixel dog (brownish, red eyes)
                ctx.fillStyle = '#3b2a1a';
                ctx.fillRect(baseX-40, baseY-20, 80, 70);
                // head
                ctx.fillStyle = '#2a1e12';
                ctx.fillRect(baseX-30, baseY-55, 60, 45);
                // ears (floppy)
                ctx.fillStyle = '#1f160e';
                ctx.fillRect(baseX-40, baseY-65, 20, 30);
                ctx.fillRect(baseX+20, baseY-65, 20, 30);
                // snout
                ctx.fillStyle = '#1f160e';
                ctx.fillRect(baseX-15, baseY-35, 30, 20);
                // eyes (red)
                ctx.fillStyle = '#ff2a2a';
                ctx.fillRect(baseX-18, baseY-48, 10, 10);
                ctx.fillRect(baseX+8, baseY-48, 10, 10);
                ctx.fillStyle = '#ff8888';
                ctx.fillRect(baseX-15, baseY-45, 5, 5);
                ctx.fillRect(baseX+11, baseY-45, 5, 5);
                // nose
                ctx.fillStyle = '#000';
                ctx.fillRect(baseX-5, baseY-25, 10, 8);
                // teeth
                ctx.fillStyle = '#ddd';
                ctx.fillRect(baseX-10, baseY-20, 4, 8);
                ctx.fillRect(baseX+6, baseY-20, 4, 8);
            } else { // wolf
                // grey wolf, yellow eyes, bigger
                ctx.fillStyle = '#4d4d5c';
                ctx.fillRect(baseX-50, baseY-30, 100, 80);
                // head
                ctx.fillStyle = '#3a3a48';
                ctx.fillRect(baseX-40, baseY-70, 80, 55);
                // ears (pointy)
                ctx.fillStyle = '#2d2d38';
                ctx.beginPath();
                ctx.moveTo(baseX-40, baseY-80);
                ctx.lineTo(baseX-20, baseY-110);
                ctx.lineTo(baseX-5, baseY-80);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(baseX+40, baseY-80);
                ctx.lineTo(baseX+20, baseY-110);
                ctx.lineTo(baseX+5, baseY-80);
                ctx.fill();
                // eyes (yellow)
                ctx.fillStyle = '#f0e13b';
                ctx.fillRect(baseX-28, baseY-58, 14, 14);
                ctx.fillRect(baseX+14, baseY-58, 14, 14);
                ctx.fillStyle = '#fff7b0';
                ctx.fillRect(baseX-24, baseY-54, 7, 7);
                ctx.fillRect(baseX+18, baseY-54, 7, 7);
                // snout
                ctx.fillStyle = '#2d2d38';
                ctx.fillRect(baseX-20, baseY-38, 40, 22);
                // nose
                ctx.fillStyle = '#111';
                ctx.fillRect(baseX-8, baseY-30, 16, 10);
                // fangs
                ctx.fillStyle = '#eee';
                ctx.fillRect(baseX-15, baseY-20, 6, 12);
                ctx.fillRect(baseX+9, baseY-20, 6, 12);
            }
            ctx.restore();
        }

        function drawLocks() {
            const locks = getLocks();
            for (let i = 0; i < lockPositions.length; i++) {
                const pos = lockPositions[i];
                const isLocked = locks[i];

                // draw padlock base
                ctx.save();
                // shadow
                ctx.fillStyle = '#0a0c0f';
                ctx.beginPath();
                ctx.ellipse(pos.x, pos.y+6, pos.r, pos.r*0.5, 0, 0, Math.PI*2);
                ctx.fill();

                // body
                if (isLocked) {
                    ctx.fillStyle = '#e5b13b';
                } else {
                    ctx.fillStyle = '#4a3a2a';
                }
                ctx.beginPath();
                ctx.ellipse(pos.x, pos.y, pos.r, pos.r*0.8, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.strokeStyle = '#1e1e1e';
                ctx.lineWidth = 4;
                ctx.stroke();

                // shackle (only if locked)
                if (isLocked) {
                    ctx.strokeStyle = '#b0b0b0';
                    ctx.lineWidth = 8;
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y-18, 24, Math.PI, 0);
                    ctx.stroke();
                    // inner highlight
                    ctx.strokeStyle = '#f0f0f0';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y-18, 24, Math.PI, 0);
                    ctx.stroke();
                } else {
                    // broken shackle
                    ctx.strokeStyle = '#6a6a6a';
                    ctx.lineWidth = 6;
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y-18, 24, Math.PI, 0);
                    ctx.stroke();
                    // crack
                    ctx.fillStyle = '#2a1a0a';
                    ctx.fillRect(pos.x-8, pos.y-40, 16, 16);
                }

                // keyhole
                ctx.fillStyle = '#1e1e1e';
                ctx.beginPath();
                ctx.arc(pos.x, pos.y-4, 8, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#3a3a3a';
                ctx.fillRect(pos.x-3, pos.y-2, 6, 14);

                // status text
                ctx.font = 'bold 16px "Courier New", monospace';
                ctx.fillStyle = isLocked ? '#c9e0a0' : '#c96f6f';
                ctx.shadowColor = '#000';
                ctx.shadowBlur = 6;
                ctx.fillText(isLocked ? 'LOCKED' : 'OPEN', pos.x-45, pos.y+55);
                ctx.restore();
            }
        }

        function drawHouseBackground() {
            // dark room
            ctx.fillStyle = '#11161c';
            ctx.fillRect(0, 0, 800, 600);
            // floor
            ctx.fillStyle = '#1e262f';
            ctx.fillRect(0, 380, 800, 220);
            // window with moonlight
            ctx.fillStyle = '#0d1219';
            ctx.fillRect(520, 80, 220, 180);
            ctx.strokeStyle = '#3f5568';
            ctx.lineWidth = 6;
            ctx.strokeRect(520, 80, 220, 180);
            // crossbars
            ctx.beginPath();
            ctx.moveTo(630, 80);
            ctx.lineTo(630, 260);
            ctx.strokeStyle = '#3f5568';
            ctx.lineWidth = 8;
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(520, 170);
            ctx.lineTo(740, 170);
            ctx.stroke();
            // pale moon glow
            ctx.fillStyle = '#b3c9e0';
            ctx.globalAlpha = 0.08;
            ctx.beginPath();
            ctx.arc(630, 170, 70, 0, Math.PI*2);
            ctx.fill();
            ctx.globalAlpha = 1.0;

            // door (where demon tries to enter)
            ctx.fillStyle = '#2a1f1a';
            ctx.fillRect(80, 300, 200, 250);
            ctx.strokeStyle = '#5b4a3a';
            ctx.lineWidth = 8;
            ctx.strokeRect(80, 300, 200, 250);
            // door handle
            ctx.fillStyle = '#b08d5c';
            ctx.beginPath();
            ctx.arc(240, 430, 12, 0, Math.PI*2);
            ctx.fill();
            // door scratches
            ctx.fillStyle = '#3f2f22';
            ctx.fillRect(120, 350, 30, 8);
            ctx.fillRect(180, 400, 30, 8);
            ctx.fillRect(140, 470, 40, 6);
        }

        function drawUI() {
            // draw message
            if (gameState.msgTimer > 0 && gameState.msg) {
                ctx.save();
                ctx.font = 'bold 32px "Courier New", monospace';
                ctx.fillStyle = '#f0d0a0';
                ctx.shadowColor = '#6a1e1e';
                ctx.shadowBlur = 16;
                ctx.textAlign = 'center';
                ctx.fillText(gameState.msg, 400, 60);
                ctx.restore();
            }

            // game over / win overlay
            if (gameState.gameOver) {
                ctx.fillStyle = '#000000cc';
                ctx.fillRect(0, 0, 800, 600);
                ctx.font = 'bold 64px "Courier New", monospace';
                ctx.fillStyle = '#d44';
                ctx.shadowColor = '#500';
                ctx.shadowBlur = 20;
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', 400, 280);
                ctx.font = '28px monospace';
                ctx.fillStyle = '#e0b0b0';
                ctx.fillText('the demon ate you...', 400, 380);
            } else if (gameState.win) {
                ctx.fillStyle = '#0a1a0acc';
                ctx.fillRect(0, 0, 800, 600);
                ctx.font = 'bold 58px "Courier New", monospace';
                ctx.fillStyle = '#8ae08a';
                ctx.shadowColor = '#1a4a1a';
                ctx.shadowBlur = 20;
                ctx.textAlign = 'center';
                ctx.fillText('6:00 AM', 400, 260);
                ctx.font = '36px monospace';
                ctx.fillStyle = '#cfefcf';
                ctx.fillText('YOU SURVIVED', 400, 360);
            }

            // draw timer bar (hour progress)
            if (gameState.hourTimer !== undefined && !gameState.gameOver && !gameState.win) {
                const progress = Math.min(1, gameState.hourTimer / 15);
                ctx.fillStyle = '#3a4a5a';
                ctx.fillRect(300, 570, 200, 12);
                ctx.fillStyle = '#c9a86a';
                ctx.fillRect(300, 570, 200 * progress, 12);
                ctx.strokeStyle = '#6a7f9c';
                ctx.lineWidth = 2;
                ctx.strokeRect(300, 570, 200, 12);
            }

            // small hint
            ctx.font = '18px "Courier New", monospace';
            ctx.fillStyle = '#6a7a8a';
            ctx.textAlign = 'left';
            ctx.fillText('click padlocks to lock/unlock', 20, 560);
        }

        // ---------- Render loop ----------
        function draw() {
            drawHouseBackground();

            // flicker overlay (distraction)
            if (gameState.flickerTimer > 0) {
                ctx.fillStyle = `rgba(80, 0, 0, ${Math.random() * 0.3})`;
                ctx.fillRect(0, 0, 800, 600);
            }

            drawDemon();
            drawLocks();
            drawUI();

            // draw pixelated "static" effect if flickering
            if (gameState.flickerTimer > 0) {
                for (let i = 0; i < 40; i++) {
                    ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.15})`;
                    ctx.fillRect(Math.random() * 800, Math.random() * 600, 8, 8);
                }
            }
        }

        // ---------- Game loop with requestAnimationFrame ----------
        let lastTime = performance.now() / 1000;
        function gameLoop(now) {
            const nowSec = now / 1000;
            let dt = nowSec - lastTime;
            if (dt > 0.1) dt = 0.1; // clamp
            lastTime = nowSec;

            update(dt);
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ---------- Click handler ----------
        function handleCanvasClick(e) {
            if (gameState.gameOver || gameState.win) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;

            // check each lock
            for (let i = 0; i < lockPositions.length; i++) {
                const pos = lockPositions[i];
                const dx = mouseX - pos.x;
                const dy = mouseY - pos.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist <= pos.r + 10) {
                    toggleLock(i);
                    break;
                }
            }
        }

        // ---------- Initialize ----------
        function init() {
            resetGame();
            canvas.addEventListener('click', handleCanvasClick);
            document.getElementById('restartButton').addEventListener('click', () => {
                resetGame();
                gameState.hourTimer = 0;
                gameState.msg = 'Lock the doors!';
                gameState.msgTimer = 2.0;
            });
            // start the loop
            requestAnimationFrame(gameLoop);

            // initial UI update
            updateUI();
        }

        init();
    })();
</script>
</body>
</html>
