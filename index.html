<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survive Until 6AM · The Baphomet</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
body{background:#030405;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:'Courier New',monospace;overflow:hidden;color:#b3c7e5}
.game-wrapper{background:#10131a;padding:16px;border-radius:16px;box-shadow:0 0 60px #6a0a0a,inset 0 0 12px #2f3742}
canvas{display:block;width:900px;height:600px;image-rendering:crisp-edges;image-rendering:pixelated;border:4px solid #3e4a5b;border-radius:12px;background:#050608;cursor:pointer}
.info-bar{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;font-weight:bold;letter-spacing:1px;font-size:.8rem}
.info-bar span{background:#1f262e;padding:5px 10px;border-radius:40px;border:2px solid #4b5e77;box-shadow:inset 0 0 6px #000}
.restart-btn{background:#3a1212;border:none;color:#ffdede;font-family:inherit;font-weight:bold;padding:5px 14px;border-radius:40px;font-size:.85rem;cursor:pointer;border:2px solid #8a2a2a;box-shadow:0 4px 0 #0e0505}
.restart-btn:active{transform:translateY(4px);box-shadow:0 0 0 #0e0505}
.hint{text-align:center;margin-top:6px;font-size:.72rem;color:#6a7a8a;letter-spacing:1px}
</style>
</head>
<body>
<div class="game-wrapper">
<canvas id="gameCanvas" width="900" height="600"></canvas>
<div class="info-bar">
<span>🔒 <span id="lockCount">12/12</span></span>
<span>⏳ <span id="clockDisplay">12:00 AM</span></span>
<span>🧠 <span id="sanityDisplay">100%</span></span>
<span>🔋 <span id="batteryDisplay">100%</span></span>
<span>⚡ <span id="staminaDisplay">100%</span></span>
<button class="restart-btn" id="restartButton">↻ RESTART</button>
</div>
<div class="hint">A/D walk · E interact/hide · F peek · L lights · SPACE flashlight · SHIFT sprint · TAB switch room · ESC pause</div>
</div>
<script>
(function(){
"use strict";

var canvas=document.getElementById('gameCanvas');
var ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
var lockCountSpan=document.getElementById('lockCount');
var clockDisplaySpan=document.getElementById('clockDisplay');
var sanityDisplaySpan=document.getElementById('sanityDisplay');
var batteryDisplaySpan=document.getElementById('batteryDisplay');
var staminaDisplaySpan=document.getElementById('staminaDisplay');

// ============ AUDIO ============
var audioCtx=null;
function initAudio(){if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){audioCtx=null}}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume()}
function beep(f,d,t,v,s){if(!audioCtx)return;try{var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t||'square';o.frequency.setValueAtTime(f,audioCtx.currentTime);if(s)o.frequency.exponentialRampToValueAtTime(s,audioCtx.currentTime+d);g.gain.setValueAtTime(v||.08,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}catch(e){}}
function sfxLock(){beep(220,.14,'sawtooth',.09,110)}
function sfxUnlock(){beep(180,.12,'square',.07,300)}
function sfxBreak(){beep(90,.5,'sawtooth',.16,30)}
function sfxGrowl(){beep(60,.7,'sawtooth',.14,30)}
function sfxHeartbeat(){beep(55,.12,'sine',.15)}
function sfxStep(){beep(110+Math.random()*40,.03,'square',.02)}
function sfxBarricade(){beep(150,.2,'square',.09,80)}
function sfxFlash(){beep(400,.05,'square',.03)}
function sfxDoor(){beep(280,.15,'square',.05,160)}
function sfxCut(){beep(200,.3,'triangle',.08,100)}
function sfxWhisper(){beep(180,.4,'triangle',.04,140)}
function sfxHide(){beep(200,.1,'sine',.05,120)}
function sfxScream(){if(!audioCtx)return;try{var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(1400,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(50,audioCtx.currentTime+1.5);g.gain.setValueAtTime(.3,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+1.5);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+1.5)}catch(e){}}
function sfxWin(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){beep(f,.25,'sine',.12)},i*180)})}

// ============ CONSTANTS ============
var HOURS=['12:00 AM','1:00 AM','2:00 AM','3:00 AM','4:00 AM','5:00 AM','6:00 AM'];
var DIFFS={
 easy:{hourLen:22,baseInterval:6.5},
 normal:{hourLen:17,baseInterval:4.8},
 nightmare:{hourLen:13,baseInterval:3.2}
};
var PLAYER_SPEED=270,SPRINT_MULT=1.85,INTERACT_RANGE=95,FLOOR_Y=500;

// ============ ROOMS ============
function buildRooms(){return[
{id:'bedroom',name:'BEDROOM',wall:'#1e1424',floor:'#100a16',wallpaper:'stripes',
 entryPoints:[
  {x:130,y:290,w:140,h:230,type:'window',label:'WINDOW',locked:true,barricade:0,maxBarricade:3,anchorX:200},
  {x:640,y:200,w:130,h:280,type:'door',label:'CLOSET',locked:true,barricade:0,maxBarricade:4,anchorX:700}
 ],
 objects:[
  {type:'bed',x:330,y:380,w:220,h:110},
  {type:'poster',x:500,y:140,w:80,h:100},
  {type:'lamp',x:60,y:140,w:30,h:60,on:false}
 ]},
{id:'hallway',name:'HALLWAY',wall:'#181826',floor:'#0f1018',wallpaper:'papers',
 entryPoints:[
  {x:380,y:190,w:140,h:260,type:'door',label:'FRONT',locked:true,barricade:0,maxBarricade:5,anchorX:450},
  {x:90,y:240,w:100,h:180,type:'vent',label:'VENT',locked:true,barricade:0,maxBarricade:2,anchorX:140},
  {x:710,y:240,w:100,h:180,type:'vent',label:'VENT',locked:true,barricade:0,maxBarricade:2,anchorX:760}
 ],
 objects:[
  {type:'painting',x:240,y:120,w:70,h:90,variant:0},
  {type:'painting',x:590,y:120,w:70,h:90,variant:1},
  {type:'sofa',x:180,y:420,w:150,h:70}
 ]},
{id:'kitchen',name:'KITCHEN',wall:'#1e1a14',floor:'#14100c',wallpaper:'tiles',
 entryPoints:[
  {x:720,y:270,w:150,h:240,type:'window',label:'WINDOW',locked:true,barricade:0,maxBarricade:3,anchorX:790},
  {x:390,y:170,w:130,h:90,type:'vent',label:'VENT',locked:true,barricade:0,maxBarricade:2,anchorX:455}
 ],
 objects:[
  {type:'counter',x:100,y:400,w:240,h:70},
  {type:'stove',x:380,y:400,w:100,h:80},
  {type:'fridge',x:50,y:200,w:80,h:190}
 ]},
{id:'living',name:'LIVING ROOM',wall:'#1a1620',floor:'#100c14',wallpaper:'floral',
 entryPoints:[
  {x:90,y:250,w:150,h:250,type:'door',label:'PATIO',locked:true,barricade:0,maxBarricade:4,anchorX:160},
  {x:640,y:250,w:150,h:250,type:'window',label:'WINDOW',locked:true,barricade:0,maxBarricade:3,anchorX:710}
 ],
 objects:[
  {type:'sofa',x:340,y:420,w:240,h:80},
  {type:'tv',x:380,y:190,w:140,h:100,on:false},
  {type:'fireplace',x:500,y:330,w:130,h:130}
 ]},
{id:'bathroom',name:'BATHROOM',wall:'#1a2028',floor:'#0f1418',wallpaper:'tiles',
 entryPoints:[
  {x:720,y:260,w:140,h:220,type:'window',label:'WINDOW',locked:true,barricade:0,maxBarricade:2,anchorX:790},
  {x:130,y:200,w:100,h:120,type:'vent',label:'VENT',locked:true,barricade:0,maxBarricade:2,anchorX:180}
 ],
 objects:[
  {type:'sink',x:300,y:380,w:90,h:100},
  {type:'mirror',x:300,y:200,w:90,h:120},
  {type:'tub',x:460,y:400,w:300,h:100}
 ]},
{id:'basement',name:'BASEMENT',wall:'#141210',floor:'#0a0806',wallpaper:'concrete',
 entryPoints:[
  {x:100,y:240,w:150,h:200,type:'hatch',label:'HATCH',locked:true,barricade:0,maxBarricade:4,anchorX:175},
  {x:620,y:420,w:130,h:60,type:'drain',label:'DRAIN',locked:true,barricade:0,maxBarricade:3,anchorX:685}
 ],
 objects:[
  {type:'boiler',x:380,y:300,w:120,h:200},
  {type:'crate',x:550,y:380,w:80,h:80},
  {type:'crate',x:650,y:400,w:60,h:60},
  {type:'boxes',x:180,y:420,w:80,h:70}
 ]},
{id:'attic',name:'ATTIC',wall:'#1a1410',floor:'#100c08',wallpaper:'wood_panels',
 entryPoints:[
  {x:400,y:130,w:140,h:100,type:'window',label:'SKYLIGHT',locked:true,barricade:0,maxBarricade:3,anchorX:470},
  {x:720,y:380,w:130,h:100,type:'hatch',label:'HATCH',locked:true,barricade:0,maxBarricade:3,anchorX:785}
 ],
 objects:[
  {type:'boxes',x:100,y:380,w:100,h:90},
  {type:'boxes',x:220,y:420,w:80,h:70},
  {type:'oldchair',x:600,y:400,w:80,h:90},
  {type:'cobweb',x:60,y:40,w:120,h:120}
 ]}
]}

// ============ STATE ============
var gameState={};
function freshState(){return{
 scene:'title',difficulty:'normal',
 hour:0,hourTimer:0,hourLength:17,
 attackTimer:0,attackInterval:4.8,baseInterval:4.8,
 demonForm:'baphomet',formTimer:8,
 demonRoomIndex:3,demonMoveTimer:5,
 flickerTimer:0,demonBob:0,demonPose:'idle',poseTimer:0,
 msg:'',msgTimer:0,shake:0,warning:0,
 roomIndex:0,
 stamina:100,maxStamina:100,sprinting:false,
 sanity:100,maxSanity:100,
 flashlight:false,battery:100,maxBattery:100,
 hideTarget:null,hiding:false,peekTimer:0,peekResult:'',
 noise:0,rooms:buildRooms(),
 demonTargetRoom:0,demonTargetEntry:0,
 timeSurvived:0,deathTimer:0,winTimer:0,
 jumpscareTimer:0,jumpscareForm:'baphomet',deathReason:'',
 heartbeatTimer:0,heartbeatInterval:1.5,
 moonFlicker:0,paused:false,
 cutsceneFrame:0,cutsceneTimer:0,
 bloodSplats:[],sparks:[],keys:{},
 seenBaphometApproach:false,
 roomLights:{0:false,1:false,2:false,3:false,4:false,5:false,6:false},
 player:{x:450,y:FLOOR_Y,facing:1,state:'idle',walkTimer:0,lockTimer:0,lockTarget:null,walkTargetX:null,idleBreathe:0}
}}

// ============ HELPERS ============
function currentRoom(){return gameState.rooms[gameState.roomIndex]}
function totalLocked(){var c=0;for(var i=0;i<gameState.rooms.length;i++)for(var j=0;j<gameState.rooms[i].entryPoints.length;j++)if(gameState.rooms[i].entryPoints[j].locked)c++;return c}
function totalEntryPoints(){var c=0;for(var i=0;i<gameState.rooms.length;i++)c+=gameState.rooms[i].entryPoints.length;return c}
function updateHUD(){
 lockCountSpan.textContent=totalLocked()+'/'+totalEntryPoints();
 clockDisplaySpan.textContent=HOURS[gameState.hour];
 sanityDisplaySpan.textContent=Math.max(0,Math.floor(gameState.sanity))+'%';
 batteryDisplaySpan.textContent=Math.max(0,Math.floor(gameState.battery))+'%';
 staminaDisplaySpan.textContent=Math.max(0,Math.floor(gameState.stamina))+'%';
}
function findNearestEntry(){var room=currentRoom();var px=gameState.player.x;var nearest=null;var nd=INTERACT_RANGE;for(var i=0;i<room.entryPoints.length;i++){var ep=room.entryPoints[i];var d=Math.abs(px-ep.anchorX);if(d<nd){nd=d;nearest=ep}}return nearest}
function findNearestHideable(){
 var room=currentRoom();var px=gameState.player.x;var nearest=null;var nd=90;
 for(var i=0;i<room.objects.length;i++){
  var o=room.objects[i];
  var ox=o.x+o.w/2;
  if(o.type==='bed'||o.type==='sofa'||o.type==='tub'||o.type==='oldchair'||o.type==='crate'||o.type==='boxes'){
   var d=Math.abs(px-ox);
   if(d<nd){nd=d;nearest=o}
  }
 }
 return nearest;
}

// ============ START ============
function startGame(d){
 initAudio();
 var sd=d;
 gameState=freshState();
 gameState.difficulty=sd;
 var D=DIFFS[sd];
 gameState.hourLength=D.hourLen;
 gameState.baseInterval=D.baseInterval;
 gameState.attackInterval=D.baseInterval;
 gameState.scene='playing';
 gameState.msg='Lock every entry. Stay sane.';
 gameState.msgTimer=3.5;
 updateHUD();
}

// ============ INPUT ============
window.addEventListener('keydown',function(e){
 if(!gameState.keys)gameState.keys={};
 var k=e.key.toLowerCase();
 gameState.keys[k]=true;
 var sc=gameState.scene;
 if(sc==='cutscene_intro'||sc==='cutscene_baphomet'){
  if(e.key===' '||e.key==='Enter'){e.preventDefault();advanceCutscene(sc);}
  return;
 }
 if(sc==='title'){
  if(e.key==='1')startGame('easy');
  if(e.key==='2')startGame('normal');
  if(e.key==='3')startGame('nightmare');
  return;
 }
 if(sc==='playing'||sc==='paused'){
  if(e.key==='Escape'){gameState.paused=!gameState.paused;return}
  if(gameState.paused)return;
  if(e.key===' '){e.preventDefault();toggleFlashlight()}
  if(k==='e')tryInteract();
  if(k==='f')tryPeek();
  if(k==='l')toggleLights();
  if(e.key==='Tab'){e.preventDefault();switchRoom(1)}
 }
 if(sc==='dead'||sc==='win'){if(e.key==='Enter'||e.key===' ')gameState.scene='title'}
});
window.addEventListener('keyup',function(e){if(gameState.keys)gameState.keys[e.key.toLowerCase()]=false});

canvas.addEventListener('click',function(e){
 initAudio();
 var r=canvas.getBoundingClientRect();
 var mx=(e.clientX-r.left)*(canvas.width/r.width);
 var my=(e.clientY-r.top)*(canvas.height/r.height);
 var sc=gameState.scene;
 if(sc==='cutscene_intro'||sc==='cutscene_baphomet'){advanceCutscene(sc);return}
 if(sc==='title'){
  var btnY=400;
  if(my>btnY&&my<btnY+55){
   if(mx>200&&mx<340)startGame('easy');
   else if(mx>360&&mx<540)startGame('normal');
   else if(mx>560&&mx<700)startGame('nightmare');
  }
  return;
 }
 if(sc!=='playing'||gameState.paused)return;
 if(gameState.player.state==='locking')return;
 var tabW=128,tabY=555,startX=450-(gameState.rooms.length*tabW)/2;
 if(my>=tabY&&my<=tabY+32){
  for(var ti=0;ti<gameState.rooms.length;ti++){
   var tx=startX+ti*tabW;
   if(mx>=tx+4&&mx<=tx+tabW-4){
    if(ti!==gameState.roomIndex)switchRoomTo(ti);
    return;
   }
  }
 }
 var room=currentRoom();
 for(var i=0;i<room.entryPoints.length;i++){
  var ep=room.entryPoints[i];
  if(mx>=ep.x&&mx<=ep.x+ep.w&&my>=ep.y&&my<=ep.y+ep.h){
   gameState.player.walkTargetX=ep.anchorX;
   gameState.player.state='walking';
   return;
  }
 }
});
function advanceCutscene(sc){
 gameState.cutsceneFrame++;
 gameState.cutsceneTimer=0;
 sfxCut();
 if(gameState.cutsceneFrame>=4){
  gameState.scene=sc==='cutscene_intro'?'title':'playing';
 }
}
function toggleFlashlight(){if(gameState.battery<=0){gameState.flashlight=false;return}gameState.flashlight=!gameState.flashlight;sfxFlash()}
function toggleLights(){var idx=gameState.roomIndex;gameState.roomLights[idx]=!gameState.roomLights[idx];sfxFlash();gameState.msg=gameState.roomLights[idx]?'Lights on.':'Lights off.';gameState.msgTimer=1.2}
function tryPeek(){
 var ep=findNearestEntry();
 if(!ep){gameState.msg='Nothing to peek through';gameState.msgTimer=1;return}
 gameState.peekTimer=1.2;
 var epRoomIdx=gameState.roomIndex;
 if(gameState.demonRoomIndex===epRoomIdx){
  gameState.peekResult='IT\'S RIGHT THERE';
  gameState.sanity=Math.max(0,gameState.sanity-8);
  sfxWhisper();
 } else {
  gameState.peekResult='All clear... for now';
 }
}
function tryInteract(){
 if(gameState.player.state==='locking')return;
 if(gameState.hiding){
  gameState.hiding=false;
  gameState.hideTarget=null;
  gameState.msg='You come out of hiding.';
  gameState.msgTimer=1.2;
  sfxHide();
  return;
 }
 var hideable=findNearestHideable();
 var ep=findNearestEntry();
 if(hideable&&(!ep||Math.abs(gameState.player.x-(hideable.x+hideable.w/2))<Math.abs(gameState.player.x-ep.anchorX))){
  gameState.hiding=true;
  gameState.hideTarget=hideable;
  gameState.msg='Hidden. Press E to come out.';
  gameState.msgTimer=1.5;
  sfxHide();
  return;
 }
 if(!ep){gameState.msg='Nothing nearby';gameState.msgTimer=1;return}
 gameState.player.facing=(ep.anchorX>gameState.player.x)?1:-1;
 gameState.player.state='locking';
 gameState.player.lockTimer=.55;
 gameState.player.lockTarget=ep;
}
function switchRoom(dir){if(gameState.player.state==='locking')return;var n=gameState.rooms.length;switchRoomTo((gameState.roomIndex+dir+n)%n)}
function switchRoomTo(idx){
 gameState.roomIndex=idx;
 gameState.player.x=450;
 gameState.player.walkTargetX=null;
 gameState.player.state='idle';
 gameState.hiding=false;
 gameState.hideTarget=null;
 sfxDoor();
 gameState.noise=Math.min(100,gameState.noise+10);
 updateHUD();
}
function applyLockAction(ep){
 if(ep.locked){ep.locked=false;sfxUnlock();gameState.msg=ep.label+' unlocked!'}
 else if(ep.barricade<ep.maxBarricade){ep.barricade++;sfxBarricade();gameState.msg='Barricade '+ep.barricade+'/'+ep.maxBarricade}
 else{ep.locked=true;ep.barricade=0;sfxLock();gameState.msg=ep.label+' locked again'}
 gameState.msgTimer=1.2;
 updateHUD();
}

// ============ UPDATE ============
function update(dt){
 if(gameState.scene==='title'){gameState.demonBob=Math.sin(Date.now()*.003)*4;return}
 if(gameState.scene==='cutscene_intro'||gameState.scene==='cutscene_baphomet'){gameState.cutsceneTimer+=dt;return}
 if(gameState.scene==='dead'){gameState.deathTimer+=dt;gameState.jumpscareTimer+=dt;gameState.shake=Math.max(0,gameState.shake-dt*2);return}
 if(gameState.scene==='win'){gameState.winTimer+=dt;return}
 if(gameState.paused)return;
 gameState.timeSurvived+=dt;
 updatePlayer(dt);
 updateDemonRoom(dt);

 gameState.sprinting=!!gameState.keys['shift'];
 if(gameState.sprinting&&gameState.stamina>0&&gameState.player.state==='walking'){
  gameState.stamina=Math.max(0,gameState.stamina-dt*18);
  gameState.noise=Math.min(100,gameState.noise+dt*25);
 } else {
  gameState.stamina=Math.min(gameState.maxStamina,gameState.stamina+dt*12);
 }
 if(gameState.flashlight){
  gameState.battery=Math.max(0,gameState.battery-dt*4.5);
  if(gameState.battery<=0){gameState.flashlight=false;gameState.msg='Battery dead!';gameState.msgTimer=2}
 } else {
  gameState.battery=Math.min(gameState.maxBattery,gameState.battery+dt*.6);
 }
 gameState.noise=Math.max(0,gameState.noise-dt*20);

 // sanity
 var lit=gameState.roomLights[gameState.roomIndex];
 var demonHere=gameState.demonRoomIndex===gameState.roomIndex;
 var demonAdj=Math.abs(gameState.demonRoomIndex-gameState.roomIndex)===1||Math.abs(gameState.demonRoomIndex-gameState.roomIndex)===gameState.rooms.length-1;
 if(demonHere)gameState.sanity=Math.max(0,gameState.sanity-dt*6);
 else if(demonAdj&&!lit)gameState.sanity=Math.max(0,gameState.sanity-dt*1.5);
 else if(!lit)gameState.sanity=Math.max(0,gameState.sanity-dt*.8);
 else gameState.sanity=Math.min(gameState.maxSanity,gameState.sanity+dt*4);
 if(gameState.hiding&&demonHere)gameState.sanity=Math.max(0,gameState.sanity-dt*3);
 // low sanity hallucinations
 if(gameState.sanity<40&&Math.random()<.008){gameState.flickerTimer=.5;sfxWhisper()}

 if(gameState.msgTimer>0)gameState.msgTimer-=dt;
 if(gameState.formTimer>0)gameState.formTimer-=dt;
 if(gameState.flickerTimer>0)gameState.flickerTimer-=dt;
 if(gameState.shake>0)gameState.shake=Math.max(0,gameState.shake-dt*2.5);
 if(gameState.warning>0)gameState.warning=Math.max(0,gameState.warning-dt);
 if(gameState.poseTimer>0)gameState.poseTimer-=dt;
 if(gameState.peekTimer>0)gameState.peekTimer-=dt;
 gameState.demonBob=Math.sin(Date.now()*.008)*3;

 for(var i=gameState.bloodSplats.length-1;i>=0;i--){
  gameState.bloodSplats[i].life-=dt;
  if(gameState.bloodSplats[i].life<=0)gameState.bloodSplats.splice(i,1);
 }
 for(var j=gameState.sparks.length-1;j>=0;j--){
  gameState.sparks[j].life-=dt;
  gameState.sparks[j].vy+=dt*200;
  gameState.sparks[j].y+=gameState.sparks[j].vy*dt;
  if(gameState.sparks[j].life<=0)gameState.sparks.splice(j,1);
 }

 var lockedRatio=totalLocked()/totalEntryPoints();
 gameState.heartbeatInterval=.5+lockedRatio*1.5+gameState.noise*.003;
 gameState.heartbeatTimer+=dt;
 if(gameState.heartbeatTimer>=gameState.heartbeatInterval){gameState.heartbeatTimer=0;sfxHeartbeat()}

 if(Math.random()<.004)gameState.flickerTimer=.3;
 gameState.moonFlicker=Math.random()<.015?.15:0;

 if(gameState.formTimer<=0){
  var forms=['baphomet','baphomet_panther','baphomet_wolf'];
  var nf=forms[Math.floor(Math.random()*3)];
  if(nf===gameState.demonForm)nf=forms[(forms.indexOf(nf)+1)%3];
  gameState.demonForm=nf;
  gameState.msg='Demon reveals: '+nf.toUpperCase().replace('_','-');
  gameState.msgTimer=2;
  gameState.formTimer=7+Math.random()*6;
 }

 gameState.attackTimer+=dt;
 if(gameState.attackTimer>=gameState.attackInterval-.9&&gameState.warning<=0){gameState.warning=.9;sfxGrowl()}
 if(gameState.attackTimer>=gameState.attackInterval){gameState.attackTimer=0;performAttack()}

 gameState.hourTimer+=dt;
 if(gameState.hourTimer>=gameState.hourLength){
  gameState.hourTimer=0;
  if(gameState.hour<6){
   gameState.hour++;
   updateHUD();
   if(gameState.hour===4&&!gameState.seenBaphometApproach){
    gameState.seenBaphometApproach=true;
    gameState.scene='cutscene_baphomet';
    gameState.cutsceneFrame=0;
    gameState.cutsceneTimer=0;
    return;
   }
   var st=[1,.85,.72,.6,.5,.38];
   var scale=st[gameState.hour]||.38;
   gameState.baseInterval=DIFFS[gameState.difficulty].baseInterval*scale;
   gameState.attackInterval=Math.min(gameState.attackInterval,gameState.baseInterval);
   gameState.battery=Math.min(gameState.maxBattery,gameState.battery+25);
   gameState.stamina=gameState.maxStamina;
   gameState.sanity=Math.min(gameState.maxSanity,gameState.sanity+15);
   if(gameState.hour>=6){gameState.scene='win';gameState.winTimer=0;sfxWin()}
   else{gameState.msg='Hour '+gameState.hour+' — it grows bolder';gameState.msgTimer=2}
  }
 }
}

function updatePlayer(dt){
 var p=gameState.player;
 p.idleBreathe+=dt;
 if(gameState.hiding){p.state='idle';p.walkTimer=0;return}
 var moveDir=0;
 if(p.state!=='locking'){
  var left=gameState.keys['a']||gameState.keys['arrowleft'];
  var right=gameState.keys['d']||gameState.keys['arrowright'];
  if(left)moveDir=-1;
  if(right)moveDir=1;
  if(moveDir!==0){p.walkTargetX=null;p.state='walking';p.facing=moveDir}
 }
 var speed=PLAYER_SPEED;
 if(gameState.sprinting&&gameState.stamina>0)speed*=SPRINT_MULT;
 if(p.state==='walking'&&p.walkTargetX!==null&&moveDir===0){
  var diff=p.walkTargetX-p.x;
  if(Math.abs(diff)<6){p.x=p.walkTargetX;p.walkTargetX=null;p.state='idle';tryInteract()}
  else{moveDir=diff>0?1:-1;p.facing=moveDir}
 }
 if(moveDir!==0&&p.state!=='locking'){
  p.x+=moveDir*speed*dt;
  if(p.x<60)p.x=60;
  if(p.x>840)p.x=840;
  p.state='walking';
  p.walkTimer+=dt;
  if(Math.floor(p.walkTimer*6)%2===0&&Math.random()<.35)sfxStep();
 } else if(p.state!=='locking'){p.state='idle';p.walkTimer=0}
 if(p.state==='locking'){
  p.lockTimer-=dt;
  if(p.lockTimer<=0){if(p.lockTarget)applyLockAction(p.lockTarget);p.lockTarget=null;p.state='idle'}
 }
}

function updateDemonRoom(dt){
 gameState.demonMoveTimer-=dt;
 if(gameState.demonMoveTimer<=0){
  gameState.demonMoveTimer=4+Math.random()*3;
  var n=gameState.rooms.length;
  var dir=Math.random()<.5?-1:1;
  gameState.demonRoomIndex=(gameState.demonRoomIndex+dir+n)%n;
 }
}

function performAttack(){
 var rooms=gameState.rooms;
 var candidates=[];
 for(var ri=0;ri<rooms.length;ri++){
  var r=rooms[ri];
  for(var ei=0;ei<r.entryPoints.length;ei++){
   var ep=r.entryPoints[ei];
   var weight=1.0;
   if(!ep.locked)weight+=2.8;
   if(ep.barricade>0)weight-=ep.barricade*.4;
   if(ri===gameState.roomIndex)weight+=1.2;
   if(ri===gameState.demonRoomIndex)weight+=1.5;
   if(gameState.roomLights[ri])weight+=1.2;
   if(ri===gameState.demonTargetRoom&&ei===gameState.demonTargetEntry)weight+=1.3;
   if(weight<.1)weight=.1;
   candidates.push({ri:ri,ei:ei,w:weight});
  }
 }
 var total=0;
 for(var i=0;i<candidates.length;i++)total+=candidates[i].w;
 var roll=Math.random()*total;
 var pick=candidates[0];
 for(var k=0;k<candidates.length;k++){roll-=candidates[k].w;if(roll<=0){pick=candidates[k];break}}
 var room=rooms[pick.ri];
 var entry=room.entryPoints[pick.ei];
 var preferredType=gameState.demonForm==='baphomet'?'door':gameState.demonForm==='baphomet_panther'?'window':'vent';
 if(entry.type!==preferredType&&Math.random()<.45){
  var matching=[];
  for(var m=0;m<candidates.length;m++)
   if(rooms[candidates[m].ri].entryPoints[candidates[m].ei].type===preferredType)matching.push(candidates[m]);
  if(matching.length>0){pick=matching[Math.floor(Math.random()*matching.length)];room=rooms[pick.ri];entry=room.entryPoints[pick.ei]}
 }
 gameState.demonTargetRoom=pick.ri;
 gameState.demonTargetEntry=pick.ei;
 gameState.demonRoomIndex=pick.ri;
 attackEntry(room,entry);
}
function attackEntry(room,ep){
 gameState.demonPose='attack';
 gameState.poseTimer=.5;
 gameState.shake=1.0;
 sfxBreak();
 if(ep.barricade>0){
  ep.barricade--;
  gameState.msg=gameState.demonForm.toUpperCase().replace('_','-')+' destroys a barricade!';
  gameState.msgTimer=1.8;
  for(var i=0;i<14;i++)gameState.sparks.push({x:ep.x+ep.w/2+(Math.random()-.5)*ep.w,y:ep.y+ep.h/2+(Math.random()-.5)*ep.h,vy:-Math.random()*200,life:.6+Math.random()*.5});
  return;
 }
 if(ep.locked){
  ep.locked=false;
  gameState.msg=gameState.demonForm.toUpperCase().replace('_','-')+' broke '+ep.label+' in '+room.name+'!';
  gameState.msgTimer=1.8;
  gameState.bloodSplats.push({x:ep.x+ep.w/2,y:ep.y+ep.h/2,life:3});
  updateHUD();
  return;
 }
 // entry broken — if player in same room, check hiding
 if(gameState.roomIndex===gameState.rooms.indexOf(room)){
  if(gameState.hiding){
   // survive hiding
   gameState.sanity=Math.max(0,gameState.sanity-25);
   gameState.msg='Something moves past you...';
   gameState.msgTimer=2.5;
   gameState.shake=1.5;
   sfxWhisper();
   return;
  }
  gameState.scene='dead';
  gameState.deathTimer=0;
  gameState.jumpscareTimer=0;
  gameState.jumpscareForm=gameState.demonForm;
  gameState.deathReason='The demon entered '+room.name+'.';
  sfxScream();
  gameState.shake=2;
 }
}

function inkLine(x1,y1,x2,y2,w,c){

 ctx.restore();
}

function drawEntryPoint(ep){
 var lit=gameState.roomLights[gameState.roomIndex];
 var baseColor=ep.type==='door'?'#2a1f1a':ep.type==='window'?'#0a0f18':ep.type==='vent'?'#1a1a1a':ep.type==='hatch'?'#1a1a1a':'#0a0508';
 px(ep.x,ep.y,ep.w,ep.h,baseColor);
 ctx.strokeStyle='#5b4a3a';ctx.lineWidth=6;ctx.strokeRect(ep.x,ep.y,ep.w,ep.h);
 ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=1;ctx.strokeRect(ep.x+4,ep.y+4,ep.w-8,ep.h-8);
 if(ep.type==='window'){
  var ma=Math.max(.05,.22-gameState.moonFlicker*.5);
  ctx.fillStyle='rgba(180,210,255,'+ma+')';ctx.fillRect(ep.x+4,ep.y+4,ep.w-8,ep.h-8);
  px(ep.x+ep.w/2-3,ep.y,6,ep.h,'#5b4a3a');
  px(ep.x,ep.y+ep.h/2-3,ep.w,6,'#5b4a3a');
 } else if(ep.type==='door'){
  px(ep.x+12,ep.y+15,ep.w-24,70,'#241a15');
  px(ep.x+12,ep.y+100,ep.w-24,70,'#241a15');
  ctx.fillStyle='#c9a86a';ctx.beginPath();ctx.arc(ep.x+ep.w-20,ep.y+ep.h/2,8,0,Math.PI*2);ctx.fill();
 } else if(ep.type==='vent'){
  for(var s=0;s<6;s++){px(ep.x+8,ep.y+15+s*22,ep.w-16,6,'#3a3a3a')}
 } else if(ep.type==='hatch'){
  for(var h=0;h<4;h++)px(ep.x+8,ep.y+15+h*40,ep.w-16,8,'#2a2a2a');
 } else if(ep.type==='drain'){
  for(var d=0;d<6;d++)px(ep.x+10+d*20,ep.y+10,6,ep.h-20,'#0a0508');
 }
 // peek result overlay
 if(gameState.peekTimer>0&&gameState.player.state!=='locking'){
  var near=findNearestEntry();
  if(near===ep){
   ctx.save();
   ctx.globalAlpha=Math.min(1,gameState.peekTimer);
   ctx.textAlign='center';
   ctx.font='bold 16px Georgia,serif';
   ctx.fillStyle=gameState.peekResult.indexOf('RIGHT')>=0?'#ff5050':'#a0e0a0';
   ctx.fillText(gameState.peekResult,ep.x+ep.w/2,ep.y-50);
   ctx.restore();
  }
 }
 // padlock
 var lx=ep.x+ep.w/2,ly=ep.y-24;
 if(ep.locked){
  ctx.strokeStyle='#c0c0c0';ctx.lineWidth=4;ctx.beginPath();ctx.arc(lx,ly-6,8,Math.PI,0);ctx.stroke();
  px(lx-10,ly-2,20,16,'#e5b13b');
  ctx.strokeStyle='#1e1e1e';ctx.lineWidth=2;ctx.strokeRect(lx-10,ly-2,20,16);
  px(lx-2,ly+3,4,7,'#1e1e1e');
 } else {
  ctx.strokeStyle='#5a5a5a';ctx.lineWidth=4;ctx.beginPath();ctx.arc(lx-6,ly-8,6,Math.PI*.7,Math.PI*1.5);ctx.stroke();
  px(lx-10,ly-2,20,16,'#4a3a2a');
  ctx.strokeStyle='#1e1e1e';ctx.lineWidth=2;ctx.strokeRect(lx-10,ly-2,20,16);
 }
 for(var b=0;b<ep.barricade;b++){
  var py=ep.y+20+b*35;
  px(ep.x-8,py,ep.w+16,14,'#7a5a2a');
  px(ep.x-8,py,ep.w+16,3,'#a8803a');
 }
 ctx.textAlign='center';ctx.font='bold 12px "Courier New",monospace';
 ctx.fillStyle=ep.locked?'#c9e0a0':'#c96f6f';
 ctx.fillText(ep.label,lx,ep.y+ep.h+18);
 // blood
 for(var i=0;i<gameState.bloodSplats.length;i++){
  var bs=gameState.bloodSplats[i];
  if(Math.abs(bs.x-lx)<ep.w/2+20&&Math.abs(bs.y-ly)<ep.h/2+20){
   var alpha=Math.min(1,bs.life/3);
   ctx.fillStyle='rgba(120,10,20,'+alpha+')';
   ctx.beginPath();ctx.arc(bs.x,bs.y,18*alpha+4,0,Math.PI*2);ctx.fill();
  }
 }
}

// ============ PLAYER ============
function drawPlayer(){
 var p=gameState.player;
 if(gameState.hiding){
  // peek head only
  var ht=gameState.hideTarget;
  if(ht){
   var hx=ht.x+ht.w/2,hy=ht.y-4;
   ctx.fillStyle='#f0c8a0';
   ctx.beginPath();ctx.arc(hx,hy,10,0,Math.PI*2);ctx.fill();
   ctx.fillStyle='#3a2010';
   ctx.beginPath();ctx.arc(hx,hy-3,10,Math.PI,0);ctx.fill();
   ctx.fillStyle='#1a1010';
   ctx.fillRect(hx-4,hy,3,3);ctx.fillRect(hx+2,hy,3,3);
  }
  return;
 }
 var cx=Math.floor(p.x),cy=p.y,facing=p.facing;
 ctx.fillStyle='rgba(0,0,0,.6)';ctx.beginPath();ctx.ellipse(cx,cy+4,26,8,0,0,Math.PI*2);ctx.fill();
 var breathe=Math.sin(p.idleBreathe*3)*1;
 var walking=p.state==='walking';
 var wp=Math.sin(p.walkTimer*14);
 var bob=walking?Math.abs(Math.sin(p.walkTimer*14))*2:0;
 var lo=walking?wp*4:0,as=walking?wp*4:0;
 var locking=p.state==='locking';
 var lp=locking?(1-p.lockTimer/.55):0;
 var lean=locking?Math.sin(lp*Math.PI)*3:0;
 var ra=locking?Math.sin(lp*Math.PI)*22:0;
 var bY=cy-bob;
 px(cx-14,bY-20+lo,10,20,'#2a3040');
 px(cx+4,bY-20-lo,10,20,'#2a3040');
 px(cx-16,bY-2+lo,14,6,'#1a1010');
 px(cx+2,bY-2-lo,14,6,'#1a1010');
 var tY=bY-46;
 px(cx-14,tY,28,26,'#5a7090');
 px(cx-14,tY,28,4,'#7a90b0');
 px(cx-20,tY+4+as,8,20,'#5a7090');
 px(cx-20,tY+22+as,8,6,'#e8c0a0');
 var rAY=tY+4-as;
 if(locking){
  px(cx+14,rAY-ra,8,20-ra*.5,'#5a7090');
  px(cx+14,rAY-ra-6,8,8,'#e8c0a0');
  if(lp>.6){ctx.fillStyle='rgba(255,220,100,'+((lp-.6)*2.5)+')';ctx.beginPath();ctx.arc(cx+18,rAY-ra-10,6,0,Math.PI*2);ctx.fill()}
 } else {
  px(cx+14,rAY,8,20,'#5a7090');
  px(cx+14,rAY+18,8,6,'#e8c0a0');
 }
 var hY=tY-26+breathe*.5+lean;
 px(cx-12,hY,24,24,'#f0c8a0');
 px(cx-13,hY-4,26,10,'#3a2010');
 if(facing===1){px(cx-2,hY+10,4,5,'#1a1010');px(cx+6,hY+10,4,5,'#1a1010');px(cx-2,hY+10,2,2,'#fff');px(cx+6,hY+10,2,2,'#fff')}
 else{px(cx-6,hY+10,4,5,'#1a1010');px(cx+2,hY+10,4,5,'#1a1010');px(cx-6,hY+10,2,2,'#fff');px(cx+2,hY+10,2,2,'#fff')}
 px(cx-3,hY+18,6,2,'#8a5040');
 // hint
 var near=findNearestEntry();
 var hideable=findNearestHideable();
 if(near&&p.state!=='locking'){
  var dist=Math.abs(p.x-near.anchorX);
  var alpha2=Math.max(0,1-dist/INTERACT_RANGE)*.9;
  if(alpha2>.1){
   ctx.save();ctx.globalAlpha=alpha2;
   ctx.fillStyle='#f0e0a0';ctx.font='bold 14px "Courier New",monospace';ctx.textAlign='center';
   ctx.fillText('[E] lock · [F] peek',cx,hY-20+Math.sin(Date.now()*.01)*3);
   ctx.restore();
  }
 } else if(hideable){
  ctx.save();ctx.globalAlpha=.85;
  ctx.fillStyle='#a0d0a0';ctx.font='bold 14px "Courier New",monospace';ctx.textAlign='center';
  ctx.fillText('[E] hide',cx,hY-20+Math.sin(Date.now()*.01)*3);
  ctx.restore();
 }
}

 ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=2;ctx.shadowColor=color;ctx.shadowBlur=blur||12;
 var pts=[];
 for(var i=0;i<5;i++){var a=-Math.PI/2+(i*4*Math.PI/5)+(invert?Math.PI:0);pts.push([cx+Math.cos(a)*size,cy+Math.sin(a)*size])}
 ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
 for(var j=1;j<=5;j++)ctx.lineTo(pts[(j*2)%5][0],pts[(j*2)%5][1]);
 ctx.stroke();
 ctx.beginPath();ctx.arc(cx,cy,size,0,Math.PI*2);ctx.stroke();
 ctx.restore();
}

function drawHUD(){

  ctx.fillText(gameState.msg,450,105);
  ctx.shadowBlur=0;

 // demon proximity red glow (edges)
 var dist=Math.abs(gameState.demonRoomIndex-gameState.roomIndex);
 if(dist>gameState.rooms.length/2)dist=gameState.rooms.length-dist;
 var proximity=dist===0?1:dist===1?.5:0;
 if(proximity>0){
  var pg=ctx.createRadialGradient(450,300,200,450,300,600);
  pg.addColorStop(0,'rgba(120,0,0,0)');
  pg.addColorStop(1,'rgba(180,0,0,'+(proximity*.5)+')');

 }
 // tabs
 var tabW=128,tabY=555,startX=450-(gameState.rooms.length*tabW)/2;
 for(var i=0;i<gameState.rooms.length;i++){
  var tx=startX+i*tabW,active=i===gameState.roomIndex;
  ctx.fillStyle=active?'rgba(90,120,160,.85)':'rgba(30,40,55,.75)';
  ctx.fillRect(tx+4,tabY,tabW-8,32);

  // demon indicator on tab
  if(i===gameState.demonRoomIndex){
   ctx.fillStyle='rgba(255,50,50,.7)';
   ctx.beginPath();ctx.arc(tx+tabW/2,tabY+6,4,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle=active?'#e5efff':'#8a9aad';
  ctx.font='bold 11px "Courier New",monospace';ctx.textAlign='center';
  ctx.fillText(gameState.rooms[i].name,tx+tabW/2,tabY+24);
 }
 // noise

 ctx.fillStyle=gameState.noise>60?'#e05050':'#6aa0d0';

 ctx.fillText('NOISE',nx,ny-3);
 // form
 ctx.textAlign='right';ctx.font='bold 14px "Courier New",monospace';
 var formCol=gameState.demonForm==='baphomet'?'#ff2a2a':gameState.demonForm==='baphomet_panther'?'#ff2a8c':'#f0e13b';

 // hour progress

}

  ctx.save();ctx.shadowColor='#ffb040';ctx.shadowBlur=22;
  ctx.fillStyle='#ffb040';
  ctx.beginPath();ctx.arc(cx2+5,cy2-6,5,0,Math.PI*2);ctx.fill();
  ctx.restore();
 }
 drawPentagramSoft(450,220,70,'rgba(240,225,60,.5)',.5);
 paperVignette();
}

function drawWin(){
 var t=Math.min(1,gameState.winTimer/3);
 paperBg();
 // warm dawn glow growing
 var g=ctx.createLinearGradient(0,600,0,0);
 g.addColorStop(0,'rgba(255,220,150,'+(t*.9)+')');
 g.addColorStop(.5,'rgba(255,180,120,'+(t*.6)+')');
 g.addColorStop(1,'rgba(200,150,120,'+(t*.3)+')');
 ctx.fillStyle=g;ctx.fillRect(0,0,900,600);
 // sun rising
 var sunY=520-t*300;
 var sg=ctx.createRadialGradient(450,sunY,20,450,sunY,220);
 sg.addColorStop(0,'rgba(255,240,200,'+(.6+t*.4)+')');
 sg.addColorStop(.5,'rgba(255,200,140,'+(.4+t*.4)+')');
 sg.addColorStop(1,'rgba(255,200,140,0)');
 ctx.fillStyle=sg;ctx.beginPath();ctx.arc(450,sunY,220,0,Math.PI*2);ctx.fill();
 inkCircle(450,sunY,70,'#8a5a30',2);
 // horizon
 inkLine(0,510,900,510,'#5a3828',2);
 // birds
 for(var b=0;b<5;b++){
  var bx=200+b*120+Math.sin(Date.now()*.001+b)*10;
  var by=180+b*18;
  inkCurve([[bx-6,by],[bx,by-4],[bx+6,by]],'#3a2820',1.5);
 }
 paperVignette();
 ctx.textAlign='center';
 ctx.font='bold 72px Georgia,serif';
 ctx.fillStyle='#4a2810';
 ctx.shadowColor='#ffb040';ctx.shadowBlur=25;
 ctx.fillText('6:00 AM',450,200);
 ctx.shadowBlur=0;
 ctx.font='italic 32px Georgia,serif';
 ctx.fillStyle='#5a3818';
 ctx.fillText('You survived the night.',450,265);
 ctx.font='20px Georgia,serif';
 ctx.fillStyle='#3a2818';
 ctx.fillText('Time: '+gameState.timeSurvived.toFixed(1)+'s',450,320);
 ctx.fillStyle='#3a2818';
 ctx.fillText('PRESS ENTER TO RETURN',450,400);
}
function drawPause(){
 ctx.fillStyle='rgba(20,10,10,.75)';ctx.fillRect(0,0,900,600);
 ctx.textAlign='center';
 ctx.font='bold 60px Georgia,serif';
 ctx.fillStyle='#e0d0b0';ctx.fillText('PAUSED',450,280);
 ctx.font='italic 18px Georgia,serif';
 ctx.fillStyle='#a09078';ctx.fillText('Press ESC to resume',450,340);
}

// ============ MAIN DRAW ============
function draw(){
 ctx.setTransform(1,0,0,1,0,0);
 if(gameState.scene==='title'){drawTitle();return}
 if(gameState.scene==='cutscene_intro'){drawCutsceneIntro();return}
 if(gameState.scene==='cutscene_baphomet'){drawCutsceneBaphomet();return}
 if(gameState.scene==='dead'){drawDeath();return}
 if(gameState.scene==='win'){drawWin();return}
 ctx.save();
 if(gameState.shake>0)ctx.translate((Math.random()-.5)*gameState.shake*12,(Math.random()-.5)*gameState.shake*12);
 drawHouse();
 if(!gameState.hiding&&gameState.demonRoomIndex===gameState.roomIndex){
  // demon is in this room — draw it looming at back
  ctx.save();ctx.globalAlpha=.35;
  drawDemon();
  ctx.restore();
 } else if(!gameState.hiding){
  drawDemon();
 }
 drawPlayer();
 ctx.restore();
 if(gameState.flickerTimer>0){
  ctx.fillStyle='rgba(80,0,0,'+(Math.random()*.25)+')';ctx.fillRect(0,0,900,600);
  for(var i=0;i<30;i++){ctx.fillStyle='rgba(255,255,255,'+(Math.random()*.1)+')';ctx.fillRect(Math.random()*900,Math.random()*600,8,8)}
 }
 drawHUD();
 if(gameState.paused)drawPause();
}

// ============ LOOP ============
var lastTime=performance.now()/1000;
function gameLoop(now){
 var nowSec=now/1000;
 var dt=nowSec-lastTime;
 if(dt>.1)dt=.1;
 lastTime=nowSec;
 update(dt);
 draw();
 requestAnimationFrame(gameLoop);
}

// ============ INIT ============
document.getElementById('restartButton').addEventListener('click',function(){
 gameState=freshState();
 gameState.scene='title';
 updateHUD();
});
gameState=freshState();
gameState.scene='cutscene_intro';
gameState.cutsceneFrame=0;
gameState.cutsceneTimer=0;
updateHUD();
requestAnimationFrame(gameLoop);

})();
</script>
</body>
