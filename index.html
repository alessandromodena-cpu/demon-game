<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survive Until 6AM · The Baphomet Stalker</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body { background: #05070a; min-height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Courier New', Courier, monospace; overflow: hidden; color: #b3c7e5; }
    .game-wrapper { background: #1a1e24; padding: 16px; border-radius: 16px; box-shadow: 0 0 40px #000, inset 0 0 12px #2f3742; }
    canvas { display: block; width: 900px; height: 600px; image-rendering: crisp-edges; image-rendering: pixelated; border: 4px solid #3e4a5b; border-radius: 12px; background: #0b0d10; cursor: pointer; }
    .info-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 8px; font-weight: bold; letter-spacing: 1px; font-size: 0.8rem; }
    .info-bar span { background: #1f262e; padding: 5px 10px; border-radius: 40px; border: 2px solid #4b5e77; box-shadow: inset 0 0 6px #000; }
    .family-badge { border-color: #4a6a4a !important; }
    .family-badge.dead { border-color: #6a2a2a !important; opacity: 0.5; text-decoration: line-through; }
    .restart-btn { background: #2d3847; border: none; color: #e5efff; font-family: inherit; font-weight: bold; padding: 5px 14px; border-radius: 40px; font-size: 0.85rem; cursor: pointer; border: 2px solid #6a7f9c; box-shadow: 0 4px 0 #0e1217; }
    .restart-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #0e1217; }
    .hint { text-align: center; margin-top: 6px; font-size: 0.72rem; color: #6a7a8a; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="game-wrapper">
    <canvas id="gameCanvas" width="900" height="600"></canvas>
    <div class="info-bar">
        <span class="family-badge" id="badgeMom">👩 MOM</span>
        <span class="family-badge" id="badgeDad">👨 DAD</span>
        <span class="family-badge" id="badgeSis">👧 SIS</span>
        <span>🔒 <span id="lockCount">8/8</span></span>
        <span>⏳ <span id="clockDisplay">12:00 AM</span></span>
        <span>🔋 <span id="batteryDisplay">100%</span></span>
        <button class="restart-btn" id="restartButton">↻ RESTART</button>
    </div>
    <div class="hint">A/D walk · E interact / guide family · SPACE flashlight · SHIFT sprint · TAB switch room · ESC pause</div>
</div>
<script>
(function() {
"use strict";

var canvas = document.getElementById('gameCanvas');
var ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

var lockCountSpan = document.getElementById('lockCount');
var clockDisplaySpan = document.getElementById('clockDisplay');
var batteryDisplaySpan = document.getElementById('batteryDisplay');
var badgeMom = document.getElementById('badgeMom');
var badgeDad = document.getElementById('badgeDad');
var badgeSis = document.getElementById('badgeSis');

// ============ AUDIO ============
var audioCtx = null;
function initAudio() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { audioCtx = null; } }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(f, d, t, v, s) {
    if (!audioCtx) return;
    try {
        var o = audioCtx.createOscillator(); var g = audioCtx.createGain();
        o.type = t || 'square';
        o.frequency.setValueAtTime(f, audioCtx.currentTime);
        if (s) o.frequency.exponentialRampToValueAtTime(s, audioCtx.currentTime + d);
        g.gain.setValueAtTime(v || 0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + d);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + d);
    } catch(e) {}
}
var sfxLock      = function() { beep(220, 0.14, 'sawtooth', 0.09, 110); };
var sfxUnlock    = function() { beep(180, 0.12, 'square', 0.07, 300); };
var sfxBreak     = function() { beep(140, 0.35, 'sawtooth', 0.13, 40); };
var sfxGrowl     = function() { beep(80, 0.5, 'sawtooth', 0.11, 45); };
var sfxHeartbeat = function() { beep(60, 0.1, 'sine', 0.14); };
var sfxStep      = function() { beep(120 + Math.random()*40, 0.03, 'square', 0.02); };
var sfxBarricade = function() { beep(150, 0.2, 'square', 0.09, 80); };
var sfxFlash     = function() { beep(400, 0.05, 'square', 0.03); };
var sfxDoor      = function() { beep(280, 0.15, 'square', 0.05, 160); };
var sfxFamily    = function() { beep(660, 0.08, 'sine', 0.06); setTimeout(function(){ beep(880, 0.1, 'sine', 0.06); }, 80); };
function sfxScream() {
    if (!audioCtx) return;
    try {
        var o = audioCtx.createOscillator(); var g = audioCtx.createGain();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(1400, audioCtx.currentTime);
        o.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 1.3);
        g.gain.setValueAtTime(0.28, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.3);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + 1.3);
    } catch(e) {}
}
function sfxWin() {
    [523, 659, 784, 1047].forEach(function(f, i) { setTimeout(function(){ beep(f, 0.25, 'sine', 0.12); }, i * 180); });
}

// ============ CONSTANTS ============
var HOURS = ['12:00 AM','1:00 AM','2:00 AM','3:00 AM','4:00 AM','5:00 AM','6:00 AM'];
var DIFFICULTIES = {
    easy:      { hourLen: 20, baseInterval: 6.0, label: 'EASY',      color: '#4a8a4a' },
    normal:    { hourLen: 16, baseInterval: 4.5, label: 'NORMAL',    color: '#a8803a' },
    nightmare: { hourLen: 13, baseInterval: 3.2, label: 'NIGHTMARE', color: '#8a2a2a' }
};
var PLAYER_SPEED = 260;
var PLAYER_SPRINT_MULT = 1.8;
var INTERACT_RANGE = 90;
var FAMILY_RANGE = 80;
var FLOOR_Y = 500;

// ============ ROOMS ============
function buildRooms() {
    return [
        { id: 'bedroom', name: 'BEDROOM', wall: '#1a1620', floor: '#13101a',
            entryPoints: [
                { x: 130, y: 300, w: 130, h: 220, type: 'window', label: 'WINDOW', locked: true, barricade: 0, maxBarricade: 3, anchorX: 195 },
                { x: 620, y: 200, w: 140, h: 280, type: 'door', label: 'DOOR', locked: true, barricade: 0, maxBarricade: 4, anchorX: 690 }
            ],
            objects: [
                { type: 'bed', x: 340, y: 380, w: 200, h: 110 },
                { type: 'lamp', x: 60, y: 140, w: 30, h: 60, on: false }
            ] },
        { id: 'hallway', name: 'HALLWAY', wall: '#141820', floor: '#0f131a',
            entryPoints: [
                { x: 380, y: 200, w: 140, h: 260, type: 'door', label: 'FRONT', locked: true, barricade: 0, maxBarricade: 5, anchorX: 450 },
                { x: 100, y: 240, w: 100, h: 180, type: 'vent', label: 'VENT', locked: true, barricade: 0, maxBarricade: 2, anchorX: 150 },
                { x: 700, y: 240, w: 100, h: 180, type: 'vent', label: 'VENT', locked: true, barricade: 0, maxBarricade: 2, anchorX: 750 }
            ],
            objects: [
                { type: 'painting', x: 250, y: 130, w: 60, h: 80 },
                { type: 'pentagram', x: 560, y: 130, w: 100, h: 100 }
            ] },
        { id: 'kitchen', name: 'KITCHEN', wall: '#1c1814', floor: '#161210',
            entryPoints: [
                { x: 700, y: 280, w: 150, h: 240, type: 'window', label: 'WINDOW', locked: true, barricade: 0, maxBarricade: 3, anchorX: 775 },
                { x: 400, y: 180, w: 120, h: 80, type: 'vent', label: 'VENT', locked: true, barricade: 0, maxBarricade: 2, anchorX: 460 }
            ],
            objects: [
                { type: 'counter', x: 100, y: 400, w: 200, h: 60 },
                { type: 'fridge', x: 60, y: 220, w: 70, h: 170 }
            ] },
        { id: 'living', name: 'LIVING ROOM', wall: '#18161c', floor: '#121017',
            entryPoints: [
                { x: 100, y: 260, w: 150, h: 250, type: 'door', label: 'BACK', locked: true, barricade: 0, maxBarricade: 4, anchorX: 175 },
                { x: 620, y: 260, w: 150, h: 250, type: 'window', label: 'WINDOW', locked: true, barricade: 0, maxBarricade: 3, anchorX: 695 }
            ],
            objects: [
                { type: 'sofa', x: 330, y: 420, w: 240, h: 80 },
                { type: 'tv', x: 380, y: 200, w: 140, h: 100, on: false }
            ] }
    ];
}

// ============ FAMILY ============
function makeFamily() {
    return [
        { id: 'mom', name: 'MOM', roomIndex: 2, x: 300, homeRoom: 2, state: 'wander', moveTimer: 3, targetX: 300, alive: true, facing: 1, walkTimer: 0, breathe: 0, following: false },
        { id: 'dad', name: 'DAD', roomIndex: 3, x: 550, homeRoom: 3, state: 'wander', moveTimer: 4, targetX: 550, alive: true, facing: 1, walkTimer: 0, breathe: 0, following: false },
        { id: 'sis', name: 'SIS', roomIndex: 0, x: 250, homeRoom: 0, state: 'wander', moveTimer: 5, targetX: 250, alive: true, facing: 1, walkTimer: 0, breathe: 0, following: false }
    ];
}

// ============ STATE ============
var gameState = {};
function freshState() {
    return {
        scene: 'title', difficulty: 'normal',
        hour: 0, hourTimer: 0, hourLength: 16,
        attackTimer: 0, attackInterval: 4.5, baseInterval: 4.5,
        demonForm: 'baphomet', formTimer: 8,
        flickerTimer: 0, demonBob: 0, demonPose: 'idle', poseTimer: 0,
        msg: '', msgTimer: 0, shake: 0, warning: 0,
        roomIndex: 0,
        stamina: 100, maxStamina: 100, sprinting: false,
        flashlight: false, battery: 100, maxBattery: 100,
        noise: 0, rooms: buildRooms(),
        family: makeFamily(),
        demonTargetRoom: 0, demonTargetEntry: 0,
        timeSurvived: 0, deathTimer: 0, winTimer: 0,
        jumpscareTimer: 0, jumpscareForm: 'baphomet', deathReason: '',
        heartbeatTimer: 0, heartbeatInterval: 1.5,
        moonFlicker: 0, paused: false,
        bloodSplats: [], sparks: [], keys: {},
        player: {
            x: 450, y: FLOOR_Y, facing: 1, state: 'idle',
            walkTimer: 0, lockTimer: 0, lockTarget: null,
            walkTargetX: null, idleBreathe: 0, followingFamily: null
        }
    };
}

// ============ BEST TIME ============
var bestTime = 0;
try { var v = localStorage.getItem('baphometBest'); bestTime = v ? parseFloat(v) : 0; } catch(e){}
function saveBest(t) { try { localStorage.setItem('baphometBest', t.toString()); } catch(e){} }

// ============ HELPERS ============
function currentRoom() { return gameState.rooms[gameState.roomIndex]; }
function totalLocked() {
    var c = 0;
    for (var i = 0; i < gameState.rooms.length; i++)
        for (var j = 0; j < gameState.rooms[i].entryPoints.length; j++)
            if (gameState.rooms[i].entryPoints[j].locked) c++;
    return c;
}
function totalEntryPoints() {
    var c = 0;
    for (var i = 0; i < gameState.rooms.length; i++) c += gameState.rooms[i].entryPoints.length;
    return c;
}
function updateHUD() {
    lockCountSpan.textContent = totalLocked() + '/' + totalEntryPoints();
    clockDisplaySpan.textContent = HOURS[gameState.hour];
    batteryDisplaySpan.textContent = Math.max(0, Math.floor(gameState.battery)) + '%';
    var fam = gameState.family;
    for (var i = 0; i < fam.length; i++) {
        var badge = i === 0 ? badgeMom : i === 1 ? badgeDad : badgeSis;
        if (fam[i].alive) badge.classList.remove('dead');
        else badge.classList.add('dead');
    }
}
function findNearestInteractable() {
    var room = currentRoom();
    var px = gameState.player.x;
    // family first
    var nearest = null; var nd = FAMILY_RANGE; var kind = null;
    for (var i = 0; i < gameState.family.length; i++) {
        var f = gameState.family[i];
        if (!f.alive || f.roomIndex !== gameState.roomIndex) continue;
        var d = Math.abs(px - f.x);
        if (d < nd) { nd = d; nearest = f; kind = 'family'; }
    }
    // entries
    for (var j = 0; j < room.entryPoints.length; j++) {
        var ep = room.entryPoints[j];
        var d2 = Math.abs(px - ep.anchorX);
        if (d2 < Math.min(INTERACT_RANGE, nd)) { nd = d2; nearest = ep; kind = 'entry'; }
    }
    return nearest ? { obj: nearest, kind: kind } : null;
}

// ============ START ============
function startGame(difficulty) {
    initAudio();
    gameState = freshState();
    gameState.difficulty = difficulty;
    var d = DIFFICULTIES[difficulty];
    gameState.hourLength = d.hourLen;
    gameState.baseInterval = d.baseInterval;
    gameState.attackInterval = d.baseInterval;
    gameState.scene = 'playing';
    gameState.msg = 'The family is scattered. Protect them!';
    gameState.msgTimer = 3;
    updateHUD();
}

// ============ INPUT ============
window.addEventListener('keydown', function(e) {
    if (!gameState.keys) gameState.keys = {};
    var k = e.key.toLowerCase();
    gameState.keys[k] = true;
    if (gameState.scene === 'title') {
        if (e.key === '1') startGame('easy');
        if (e.key === '2') startGame('normal');
        if (e.key === '3') startGame('nightmare');
        return;
    }
    if (gameState.scene === 'playing' || gameState.scene === 'paused') {
        if (e.key === 'Escape') { gameState.paused = !gameState.paused; return; }
        if (gameState.paused) return;
        if (e.key === ' ') { e.preventDefault(); toggleFlashlight(); }
        if (k === 'e') tryInteract();
        if (e.key === 'Tab') { e.preventDefault(); switchRoom(1); }
    }
    if (gameState.scene === 'dead' || gameState.scene === 'win') {
        if (e.key === 'Enter' || e.key === ' ') gameState.scene = 'title';
    }
});
window.addEventListener('keyup', function(e) {
    if (gameState.keys) gameState.keys[e.key.toLowerCase()] = false;
});
canvas.addEventListener('click', function(e) {
    initAudio();
    var r = canvas.getBoundingClientRect();
    var mx = (e.clientX - r.left) * (canvas.width / r.width);
    var my = (e.clientY - r.top) * (canvas.height / r.height);
    if (gameState.scene === 'title') {
        var btnY = 400;
        if (my > btnY && my < btnY + 55) {
            if (mx > 200 && mx < 340) startGame('easy');
            else if (mx > 360 && mx < 540) startGame('normal');
            else if (mx > 560 && mx < 700) startGame('nightmare');
        }
        return;
    }
    if (gameState.scene !== 'playing' || gameState.paused) return;
    if (gameState.player.state === 'locking') return;
    var tabW = 150, tabY = 555, startX = 450 - (gameState.rooms.length * tabW) / 2;
    if (my >= tabY && my <= tabY + 32) {
        for (var ti = 0; ti < gameState.rooms.length; ti++) {
            var tx = startX + ti * tabW;
            if (mx >= tx + 4 && mx <= tx + tabW - 4) {
                if (ti !== gameState.roomIndex) switchRoomTo(ti);
                return;
            }
        }
    }
    var room = currentRoom();
    for (var i = 0; i < room.entryPoints.length; i++) {
        var ep = room.entryPoints[i];
        if (mx >= ep.x && mx <= ep.x + ep.w && my >= ep.y && my <= ep.y + ep.h) {
            gameState.player.walkTargetX = ep.anchorX;
            gameState.player.state = 'walking';
            return;
        }
    }
});
function toggleFlashlight() {
    if (gameState.battery <= 0) { gameState.flashlight = false; return; }
    gameState.flashlight = !gameState.flashlight; sfxFlash();
}
function tryInteract() {
    if (gameState.player.state === 'locking') return;
    var near = findNearestInteractable();
    if (!near) {
        gameState.player.followingFamily = null;
        gameState.msg = 'Nothing nearby';
        gameState.msgTimer = 1;
        return;
    }
    if (near.kind === 'family') {
        var fam = near.obj;
        if (gameState.player.followingFamily === fam) {
            gameState.player.followingFamily = null;
            fam.following = false;
            gameState.msg = fam.name + ' stays here.';
        } else {
            gameState.player.followingFamily = fam;
            fam.following = true;
            fam.roomIndex = gameState.roomIndex;
            fam.x = gameState.player.x - gameState.player.facing * 40;
            sfxFamily();
            gameState.msg = fam.name + ' follows you';
        }
        gameState.msgTimer = 1.5;
        return;
    }
    // entry
    var ep = near.obj;
    gameState.player.facing = (ep.anchorX > gameState.player.x) ? 1 : -1;
    gameState.player.state = 'locking';
    gameState.player.lockTimer = 0.55;
    gameState.player.lockTarget = ep;
}
function switchRoom(dir) {
    if (gameState.player.state === 'locking') return;
    var n = gameState.rooms.length;
    switchRoomTo((gameState.roomIndex + dir + n) % n);
}
function switchRoomTo(idx) {
    gameState.roomIndex = idx;
    gameState.player.x = 450;
    gameState.player.walkTargetX = null;
    gameState.player.state = 'idle';
    // if following family, bring them
    if (gameState.player.followingFamily && gameState.player.followingFamily.alive) {
        gameState.player.followingFamily.roomIndex = idx;
        gameState.player.followingFamily.x = 450 - 40;
    }
    sfxDoor();
    gameState.noise = Math.min(100, gameState.noise + 10);
    updateHUD();
}
function applyLockAction(ep) {
    if (ep.locked) { ep.locked = false; sfxUnlock(); gameState.msg = ep.label + ' unlocked!'; }
    else if (ep.barricade < ep.maxBarricade) { ep.barricade++; sfxBarricade(); gameState.msg = 'Barricade ' + ep.barricade + '/' + ep.maxBarricade; }
    else { ep.locked = true; ep.barricade = 0; sfxLock(); gameState.msg = ep.label + ' locked again'; }
    gameState.msgTimer = 1.2;
    updateHUD();
}

// ============ UPDATE ============
function update(dt) {
    if (gameState.scene === 'title') { gameState.demonBob = Math.sin(Date.now() * 0.003) * 4; return; }
    if (gameState.scene === 'dead') { gameState.deathTimer += dt; gameState.jumpscareTimer += dt; gameState.shake = Math.max(0, gameState.shake - dt * 2); return; }
    if (gameState.scene === 'win') { gameState.winTimer += dt; return; }
    if (gameState.paused) return;
    gameState.timeSurvived += dt;
    updatePlayer(dt);
    updateFamily(dt);

    gameState.sprinting = !!gameState.keys['shift'];
    if (gameState.sprinting && gameState.stamina > 0 && gameState.player.state === 'walking') {
        gameState.stamina = Math.max(0, gameState.stamina - dt * 18);
        gameState.noise = Math.min(100, gameState.noise + dt * 25);
    } else {
        gameState.stamina = Math.min(gameState.maxStamina, gameState.stamina + dt * 12);
    }
    if (gameState.flashlight) {
        gameState.battery = Math.max(0, gameState.battery - dt * 4.5);
        if (gameState.battery <= 0) { gameState.flashlight = false; gameState.msg = 'Battery dead!'; gameState.msgTimer = 2; }
    } else {
        gameState.battery = Math.min(gameState.maxBattery, gameState.battery + dt * 0.6);
    }
    gameState.noise = Math.max(0, gameState.noise - dt * 20);

    if (gameState.msgTimer > 0) gameState.msgTimer -= dt;
    if (gameState.formTimer > 0) gameState.formTimer -= dt;
    if (gameState.flickerTimer > 0) gameState.flickerTimer -= dt;
    if (gameState.shake > 0) gameState.shake = Math.max(0, gameState.shake - dt * 2.5);
    if (gameState.warning > 0) gameState.warning = Math.max(0, gameState.warning - dt);
    if (gameState.poseTimer > 0) gameState.poseTimer -= dt;
    gameState.demonBob = Math.sin(Date.now() * 0.008) * 3;

    for (var i = gameState.bloodSplats.length - 1; i >= 0; i--) {
        gameState.bloodSplats[i].life -= dt;
        if (gameState.bloodSplats[i].life <= 0) gameState.bloodSplats.splice(i, 1);
    }
    for (var j = gameState.sparks.length - 1; j >= 0; j--) {
        gameState.sparks[j].life -= dt;
        gameState.sparks[j].vy += dt * 200;
        gameState.sparks[j].y += gameState.sparks[j].vy * dt;
        if (gameState.sparks[j].life <= 0) gameState.sparks.splice(j, 1);
    }

    var lockedRatio = totalLocked() / totalEntryPoints();
    gameState.heartbeatInterval = 0.5 + lockedRatio * 1.5 + gameState.noise * 0.003;
    gameState.heartbeatTimer += dt;
    if (gameState.heartbeatTimer >= gameState.heartbeatInterval) { gameState.heartbeatTimer = 0; sfxHeartbeat(); }
    if (Math.random() < 0.004) gameState.flickerTimer = 0.3;
    gameState.moonFlicker = Math.random() < 0.015 ? 0.15 : 0;

    if (gameState.formTimer <= 0) {
        var forms = ['baphomet', 'panther', 'wolf'];
        var nf = forms[Math.floor(Math.random() * 3)];
        if (nf === gameState.demonForm) nf = forms[(forms.indexOf(nf) + 1) % 3];
        gameState.demonForm = nf;
        gameState.msg = 'Demon reveals: ' + nf.toUpperCase();
        gameState.msgTimer = 2;
        gameState.formTimer = 7 + Math.random() * 6;
    }

    gameState.attackTimer += dt;
    if (gameState.attackTimer >= gameState.attackInterval - 0.9 && gameState.warning <= 0) {
        gameState.warning = 0.9; sfxGrowl();
    }
    if (gameState.attackTimer >= gameState.attackInterval) {
        gameState.attackTimer = 0;
        performAttack();
    }

    gameState.hourTimer += dt;
    if (gameState.hourTimer >= gameState.hourLength) {
        gameState.hourTimer = 0;
        if (gameState.hour < 6) {
            gameState.hour++;
            updateHUD();
            var scaleTable = [1, 0.85, 0.72, 0.60, 0.50, 0.38];
            var scale = scaleTable[gameState.hour] || 0.38;
            gameState.baseInterval = DIFFICULTIES[gameState.difficulty].baseInterval * scale;
            gameState.attackInterval = Math.min(gameState.attackInterval, gameState.baseInterval);
            gameState.battery = Math.min(gameState.maxBattery, gameState.battery + 25);
            gameState.stamina = gameState.maxStamina;
            if (gameState.hour >= 6) {
                gameState.scene = 'win';
                gameState.winTimer = 0;
                sfxWin();
                if (gameState.timeSurvived > bestTime) { bestTime = gameState.timeSurvived; saveBest(bestTime); }
            } else {
                gameState.msg = 'Hour ' + gameState.hour + ' — it grows bolder';
                gameState.msgTimer = 2;
            }
        }
    }
}

// ============ PLAYER ============
function updatePlayer(dt) {
    var p = gameState.player;
    p.idleBreathe += dt;
    var moveDir = 0;
    if (p.state !== 'locking') {
        var left = gameState.keys['a'] || gameState.keys['arrowleft'];
        var right = gameState.keys['d'] || gameState.keys['arrowright'];
        if (left) moveDir = -1;
        if (right) moveDir = 1;
        if (moveDir !== 0) { p.walkTargetX = null; p.state = 'walking'; p.facing = moveDir; }
    }
    var speed = PLAYER_SPEED;
    if (gameState.sprinting && gameState.stamina > 0) speed *= PLAYER_SPRINT_MULT;
    if (p.state === 'walking' && p.walkTargetX !== null && moveDir === 0) {
        var diff = p.walkTargetX - p.x;
        if (Math.abs(diff) < 6) { p.x = p.walkTargetX; p.walkTargetX = null; p.state = 'idle'; tryInteract(); }
        else { moveDir = diff > 0 ? 1 : -1; p.facing = moveDir; }
    }
    if (moveDir !== 0 && p.state !== 'locking') {
        p.x += moveDir * speed * dt;
        if (p.x < 60) p.x = 60;
        if (p.x > 840) p.x = 840;
        p.state = 'walking';
        p.walkTimer += dt;
    } else if (p.state !== 'locking') { p.state = 'idle'; p.walkTimer = 0; }
    if (p.state === 'locking') {
        p.lockTimer -= dt;
        if (p.lockTimer <= 0) {
            if (p.lockTarget) applyLockAction(p.lockTarget);
            p.lockTarget = null;
            p.state = 'idle';
        }
    }
}

// ============ FAMILY AI ============
function updateFamily(dt) {
    for (var i = 0; i < gameState.family.length; i++) {
        var f = gameState.family[i];
        if (!f.alive) continue;
        f.breathe += dt;
        // following player
        if (f.following && gameState.player.followingFamily === f) {
            f.roomIndex = gameState.roomIndex;
            var targetX = gameState.player.x - gameState.player.facing * 45;
            var dx = targetX - f.x;
            if (Math.abs(dx) > 8) {
                f.x += Math.sign(dx) * 200 * dt;
                f.facing = dx > 0 ? 1 : -1;
                f.walkTimer += dt;
            } else { f.walkTimer = 0; }
            f.x = Math.max(60, Math.min(840, f.x));
            continue;
        }
        // wander
        f.moveTimer -= dt;
        if (f.moveTimer <= 0) {
            f.moveTimer = 2 + Math.random() * 4;
            // 20% chance to change room (to home or adjacent)
            if (Math.random() < 0.2) {
                var newRoom = Math.floor(Math.random() * gameState.rooms.length);
                f.roomIndex = newRoom;
                f.x = 150 + Math.random() * 600;
                f.targetX = f.x;
            } else {
                f.targetX = 100 + Math.random() * 700;
            }
        }
        // move toward target
        if (Math.abs(f.x - f.targetX) > 6) {
            var ddx = f.targetX - f.x;
            f.x += Math.sign(ddx) * 60 * dt;
            f.facing = ddx > 0 ? 1 : -1;
            f.walkTimer += dt;
        } else { f.walkTimer = 0; }
    }
}

// ============ DEMON AI ============
function performAttack() {
    var rooms = gameState.rooms;
    var candidates = [];
    for (var ri = 0; ri < rooms.length; ri++) {
        var r = rooms[ri];
        for (var ei = 0; ei < r.entryPoints.length; ei++) {
            var ep = r.entryPoints[ei];
            var weight = 1.0;
            if (!ep.locked) weight += 2.5;
            if (ep.barricade > 0) weight -= ep.barricade * 0.4;
            // strongly prefer rooms with family (demon hunts family)
            for (var fi = 0; fi < gameState.family.length; fi++) {
                if (gameState.family[fi].alive && gameState.family[fi].roomIndex === ri) weight += 1.8;
            }
            if (ri === gameState.demonTargetRoom && ei === gameState.demonTargetEntry) weight += 1.2;
            if (weight < 0.1) weight = 0.1;
            candidates.push({ ri: ri, ei: ei, w: weight });
        }
    }
    var total = 0;
    for (var i = 0; i < candidates.length; i++) total += candidates[i].w;
    var roll = Math.random() * total;
    var pick = candidates[0];
    for (var k = 0; k < candidates.length; k++) { roll -= candidates[k].w; if (roll <= 0) { pick = candidates[k]; break; } }
    var room = rooms[pick.ri];
    var entry = room.entryPoints[pick.ei];
    var preferredType = gameState.demonForm === 'baphomet' ? 'door'
                      : gameState.demonForm === 'panther' ? 'window' : 'vent';
    if (entry.type !== preferredType && Math.random() < 0.4) {
        var matching = [];
        for (var m = 0; m < candidates.length; m++)
            if (rooms[candidates[m].ri].entryPoints[candidates[m].ei].type === preferredType) matching.push(candidates[m]);
        if (matching.length > 0) { pick = matching[Math.floor(Math.random() * matching.length)]; room = rooms[pick.ri]; entry = room.entryPoints[pick.ei]; }
    }
    gameState.demonTargetRoom = pick.ri;
    gameState.demonTargetEntry = pick.ei;
    attackEntry(room, entry);
}

function attackEntry(room, ep) {
    gameState.demonPose = 'attack';
    gameState.poseTimer = 0.5;
    gameState.shake = 1.0;
    sfxBreak();
    if (ep.barricade > 0) {
        ep.barricade--;
        gameState.msg = gameState.demonForm.toUpperCase() + ' destroys a barricade!';
        gameState.msgTimer = 1.8;
        for (var i = 0; i < 12; i++)
            gameState.sparks.push({ x: ep.x + ep.w/2 + (Math.random()-0.5)*ep.w, y: ep.y + ep.h/2 + (Math.random()-0.5)*ep.h, vy: -Math.random()*180, life: 0.6 + Math.random()*0.4 });
        return;
    }
    if (ep.locked) {
        ep.locked = false;
        gameState.msg = gameState.demonForm.toUpperCase() + ' broke ' + ep.label + '!';
        gameState.msgTimer = 1.8;
        gameState.bloodSplats.push({ x: ep.x + ep.w/2, y: ep.y + ep.h/2, life: 3 });
        updateHUD();
        return;
    }
    // entry is BROKEN → demon enters room
    // check if family member is in this room
    var roomIdx = gameState.rooms.indexOf(room);
    for (var fi = 0; fi < gameState.family.length; fi++) {
        var f = gameState.family[fi];
        if (f.alive && f.roomIndex === roomIdx) {
            f.alive = false;
            gameState.scene = 'dead';
            gameState.jumpscareTimer = 0;
            gameState.jumpscareForm = gameState.demonForm;
            gameState.deathReason = 'The demon killed ' + f.name + '!';
            sfxScream();
            gameState.shake = 2;
            updateHUD();
            return;
        }
    }
    // if player is in this room → death
    if (gameState.roomIndex === roomIdx) {
        gameState.scene = 'dead';
        gameState.jumpscareTimer = 0;
        gameState.jumpscareForm = gameState.demonForm;
        gameState.deathReason = 'The demon caught YOU!';
        sfxScream();
        gameState.shake = 2;
        return;
    }
    // empty room — demon just roams
    gameState.msg = 'The demon is inside ' + room.name + '!';
    gameState.msgTimer = 2;
}

// ============ PIXEL PRIMITIVE ============
function px(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(Math.floor(x), Math.floor(y), w, h); }

// ============ PENTAGRAM HELPER ============
function drawPentagram(cx, cy, size, color, alpha, blur) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.shadowColor = color;
    ctx.shadowBlur = blur || 12;
    var pts = [];
    for (var i = 0; i < 5; i++) {
        var a = -Math.PI/2 + (i * 4 * Math.PI / 5) + Math.PI;
        pts.push({ x: cx + Math.cos(a) * size, y: cy + Math.sin(a) * size });
    }
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (var j = 1; j <= 5; j++) ctx.lineTo(pts[(j*2)%5].x, pts[(j*2)%5].y);
    ctx.stroke();
    // circle
    ctx.beginPath(); ctx.arc(cx, cy, size, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
}

function drawEntryPoint(ep) {

    ctx.strokeRect(ep.x+4, ep.y+4, ep.w-8, ep.h-8);

        var ma = Math.max(0.05, 0.22 - gameState.moonFlicker * 0.5);
        ctx.fillStyle = 'rgba(180,210,255,' + ma + ')'; ctx.fillRect(ep.x+4, ep.y+4, ep.w-8, ep.h-8);
        for (var st = 0; st < 8; st++) { ctx.fillStyle = 'rgba(255,255,255,' + (0.3+Math.random()*0.3) + ')'; ctx.fillRect(ep.x+10+(st*17)%(ep.w-20), ep.y+10+(st*23)%(ep.h-20), 2, 2); }
        px(ep.x + ep.w/2 - 3, ep.y, 6, ep.h, '#5b4a3a');
        px(ep.x, ep.y + ep.h/2 - 3, ep.w, 6, '#5b4a3a');

        ctx.fillStyle = '#7a5f3a';
        ctx.beginPath(); ctx.arc(ep.x+ep.w-20, ep.y+ep.h/2, 4, 0, Math.PI*2); ctx.fill();
    } else if (ep.type === 'vent') {
        for (var s = 0; s < 6; s++) { px(ep.x+8, ep.y+15+s*22, ep.w-16, 6, '#3a3a3a'); px(ep.x+8, ep.y+15+s*22, ep.w-16, 2, '#4a4a4a'); }
    }
    // padlock
    var lx = ep.x + ep.w/2, ly = ep.y - 24;

        ctx.strokeStyle = '#c0c0c0'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(lx, ly-6, 8, Math.PI, 0); ctx.stroke();
        px(lx-10, ly-2, 20, 16, '#e5b13b');

        ctx.strokeStyle = '#1e1e1e'; ctx.lineWidth = 2;

        ctx.strokeStyle = '#5a5a5a'; ctx.lineWidth = 4;

        px(lx-10, ly-2, 20, 16, '#4a3a2a');
        ctx.strokeStyle = '#1e1e1e'; ctx.lineWidth = 2;
        ctx.strokeRect(lx-10, ly-2, 20, 16);
    }
    for (var b = 0; b < ep.barricade; b++) {
        var py = ep.y + 20 + b*35;
        px(ep.x-8, py, ep.w+16, 14, '#7a5a2a');

            var alpha = Math.min(1, bs.life/3);
            ctx.fillStyle = 'rgba(120,10,20,' + alpha + ')';

        }

}

// ============ PLAYER SPRITE ============
function drawPlayer() {
    var p = gameState.player;
    var cx = Math.floor(p.x), cy = p.y, facing = p.facing;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.ellipse(cx, cy+4, 26, 8, 0, 0, Math.PI*2); ctx.fill();
    var breathe = Math.sin(p.idleBreathe * 3) * 1;
    var walking = p.state === 'walking';
    var walkPhase = Math.sin(p.walkTimer * 14);
    var bob = walking ? Math.abs(Math.sin(p.walkTimer * 14)) * 2 : 0;
    var legOffset = walking ? walkPhase * 4 : 0;
    var armSwing = walking ? walkPhase * 4 : 0;
    var locking = p.state === 'locking';
    var lockProgress = locking ? (1 - p.lockTimer / 0.55) : 0;
    var lean = locking ? Math.sin(lockProgress * Math.PI) * 3 : 0;
    var reachArm = locking ? Math.sin(lockProgress * Math.PI) * 22 : 0;
    var baseY = cy - bob;
    // legs
    px(cx-14, baseY-20+legOffset, 10, 20, '#2a3040');
    px(cx-14, baseY-20+legOffset, 10, 4, '#3a4050');
    px(cx+4, baseY-20-legOffset, 10, 20, '#2a3040');
    px(cx+4, baseY-20-legOffset, 10, 4, '#3a4050');
    px(cx-16, baseY-2+legOffset, 14, 6, '#1a1010');
    px(cx+2, baseY-2-legOffset, 14, 6, '#1a1010');

            ctx.beginPath(); ctx.arc(cx+18, rightArmY-reachArm-10, 6, 0, Math.PI*2); ctx.fill();

    } else {
        px(cx+14, rightArmY, 8, 20, '#5a7090');
        px(cx+14, rightArmY+18, 8, 6, '#e8c0a0');
    }
    // head
    var headY = torsoY - 26 + breathe*0.5 + lean;
    px(cx-4, torsoY-2, 8, 4, '#d8b090');

    px(cx-3, headY+18, 6, 2, '#8a5040');
    // interact hint
    var near = findNearestInteractable();

// ============ BAPHOMET DEMON ============
function drawDemon() {
    var form = gameState.demonForm;
    var baseX = 450;
    var baseY = 140 + gameState.demonBob;
    var attacking = gameState.demonPose === 'attack';
    var wobble = attacking ? Math.sin(Date.now() * 0.05) * 6 : 0;
    var bx = baseX + wobble;
    var alpha = 1;
    if (gameState.flickerTimer > 0) alpha = 0.4 + Math.abs(Math.sin(Date.now() * 0.04)) * 0.6;
    ctx.save();
    ctx.globalAlpha = alpha;
    // dark hellish aura
    var auraGrad = ctx.createRadialGradient(bx, baseY, 30, bx, baseY, 150);
    auraGrad.addColorStop(0, 'rgba(60,10,10,0.95)');
    auraGrad.addColorStop(0.5, 'rgba(30,5,5,0.7)');
    auraGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = auraGrad;
    ctx.beginPath(); ctx.arc(bx, baseY, 150, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1a0505';
    ctx.beginPath(); ctx.arc(bx, baseY, 95, 0, Math.PI*2); ctx.fill();
    // floating pentagram behind demon (the Baphomet sigil)
    drawPentagram(bx, baseY, 110, gameState.demonForm === 'baphomet' ? '#ff2a2a' : gameState.demonForm === 'panther' ? '#ff2a8c' : '#f0e13b', 0.55, 18);
    // hellfire embers
    for (var i = 0; i < 10; i++) {
        var t = (Date.now() * 0.001 + i * 1.1) % 3;
        var ex = bx + Math.sin(Date.now()*0.002 + i) * 70;
        var ey = baseY + 70 - t * 55;
        var ea = Math.max(0, 1 - t/3);
        ctx.fillStyle = 'rgba(255,120,40,' + (ea * 0.6) + ')';
        ctx.fillRect(ex, ey, 4, 4);
        ctx.fillStyle = 'rgba(255,220,80,' + (ea * 0.4) + ')';
        ctx.fillRect(ex+1, ey+1, 2, 2);
    }
    var breathe = 1 + Math.sin(Date.now() * 0.004) * 0.02;
    ctx.translate(bx, baseY); ctx.scale(breathe, breathe); ctx.translate(-bx, -baseY);
    if (form === 'baphomet') drawBaphomet(bx, baseY, attacking);
    else if (form === 'panther') drawBaphometPanther(bx, baseY, attacking);
    else drawBaphometWolf(bx, baseY, attacking);
    ctx.restore();
}

// ============ HUD ============
function drawHUD() {
    if (gameState.msgTimer > 0 && gameState.msg) {
        ctx.textAlign = 'center';
        ctx.font = 'bold 24px "Courier New", monospace';
        ctx.shadowColor = '#6a1e1e'; ctx.shadowBlur = 12;
        ctx.fillStyle = '#f0d0a0';
        ctx.fillText(gameState.msg, 450, 105);
        ctx.shadowBlur = 0;
    }
    if (gameState.warning > 0) {
        var a = Math.abs(Math.sin(Date.now() * 0.03)) * 0.4;
        ctx.fillStyle = 'rgba(180,0,0,' + a + ')';
        ctx.fillRect(0, 0, 900, 600);
    }
    // room tabs
    var tabW = 150, tabY = 555, startX = 450 - (gameState.rooms.length * tabW) / 2;
    for (var i = 0; i < gameState.rooms.length; i++) {
        var tx = startX + i * tabW;
        var active = i === gameState.roomIndex;
        ctx.fillStyle = active ? 'rgba(90,120,160,0.85)' : 'rgba(30,40,55,0.75)';
        ctx.fillRect(tx+4, tabY, tabW-8, 32);
        ctx.strokeStyle = active ? '#a0c0ff' : '#4b5e77';
        ctx.lineWidth = 2; ctx.strokeRect(tx+4, tabY, tabW-8, 32);
        // family dots
        var famHere = [];
        for (var fi = 0; fi < gameState.family.length; fi++) {
            var f = gameState.family[fi];
            if (f.alive && f.roomIndex === i) famHere.push(f);
        }
        ctx.fillStyle = active ? '#e5efff' : '#8a9aad';
        ctx.font = 'bold 12px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(gameState.rooms[i].name, tx + tabW/2, tabY + 20);
        // dot indicators
        for (var d = 0; d < famHere.length; d++) {
            ctx.fillStyle = famHere[d].id === 'mom' ? '#e08ab0' : famHere[d].id === 'dad' ? '#6a9ad0' : '#f0d060';
            ctx.beginPath(); ctx.arc(tx + 20 + d*14, tabY + 26, 4, 0, Math.PI*2); ctx.fill();
        }
    }
    // noise meter
    var nw = 180, nx = 360, ny = 20;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(nx, ny, nw, 12);
    ctx.fillStyle = gameState.noise > 60 ? '#e05050' : '#6aa0d0';
    ctx.fillRect(nx, ny, nw * (gameState.noise / 100), 12);
    ctx.strokeStyle = '#4b5e77'; ctx.lineWidth = 2; ctx.strokeRect(nx, ny, nw, 12);
    ctx.fillStyle = '#7a8a9a'; ctx.font = '10px "Courier New", monospace';
    ctx.textAlign = 'left'; ctx.fillText('NOISE', nx, ny - 3);
    // form
    ctx.textAlign = 'right'; ctx.font = 'bold 14px "Courier New", monospace';
    var formCol = gameState.demonForm === 'baphomet' ? '#ff2a2a' : gameState.demonForm === 'panther' ? '#ff2a8c' : '#f0e13b';
    ctx.fillStyle = formCol;
    ctx.fillText('▲ ' + gameState.demonForm.toUpperCase(), 880, 25);
    // hour progress
    var prog = Math.min(1, gameState.hourTimer / gameState.hourLength);
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(360, 40, 180, 6);
    ctx.fillStyle = '#c9a86a'; ctx.fillRect(360, 40, 180 * prog, 6);
}

// ============ DEATH ============
function drawDeath() {
    var t = Math.min(1, gameState.jumpscareTimer);
    var scale = 1 + t * 3;
    var bx = 450, baseY = 300 + Math.sin(Date.now()*0.1) * 20;
    ctx.save();
    ctx.translate(bx, baseY); ctx.scale(scale, scale); ctx.translate(-bx, -baseY);
    var form = gameState.jumpscareForm;
    if (form === 'baphomet') drawBaphomet(bx, baseY, true);
    else if (form === 'panther') drawBaphometPanther(bx, baseY, true);
    else drawBaphometWolf(bx, baseY, true);
    ctx.restore();
    ctx.fillStyle = 'rgba(120,0,0,' + (t * 0.55) + ')';
    ctx.fillRect(0, 0, 900, 600);
    if (gameState.shake > 0) {
        ctx.translate((Math.random()-0.5)*gameState.shake*30, (Math.random()-0.5)*gameState.shake*30);
    }
    if (gameState.jumpscareTimer > 1.5) {
        ctx.fillStyle = 'rgba(0,0,0,0.88)'; ctx.fillRect(0, 0, 900, 600);
        ctx.textAlign = 'center';
        ctx.font = 'bold 62px "Courier New", monospace';
        ctx.fillStyle = '#d44';
        ctx.shadowColor = '#500'; ctx.shadowBlur = 20;
        ctx.fillText('GAME OVER', 450, 240);
        ctx.shadowBlur = 0;
        ctx.font = '22px "Courier New", monospace';
        ctx.fillStyle = '#c0a0a0';
        ctx.fillText(gameState.deathReason || 'The demon got you.', 450, 310);
        ctx.fillStyle = '#7a8a9a'; ctx.font = '16px "Courier New", monospace';
        ctx.fillText('Survived: ' + gameState.timeSurvived.toFixed(1) + 's', 450, 350);
        ctx.fillStyle = '#a0c0ff';
        ctx.fillText('PRESS ENTER TO RETURN', 450, 430);
    }
}

function drawWin() {
    var t = Math.min(1, gameState.winTimer / 3);
    var grad = ctx.createLinearGradient(0, 600, 0, 0);
    grad.addColorStop(0, 'rgb(' + Math.floor(40 + t*200) + ',' + Math.floor(20 + t*120) + ',' + Math.floor(30 + t*40) + ')');
    grad.addColorStop(0.5, 'rgb(' + Math.floor(20 + t*100) + ',' + Math.floor(30 + t*60) + ',' + Math.floor(50 + t*60) + ')');
    grad.addColorStop(1, 'rgb(10,15,30)');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, 900, 600);
    var sunY = 500 - t * 250;
    ctx.fillStyle = 'rgba(255,220,120,' + (0.6 + t*0.4) + ')';
    ctx.beginPath(); ctx.arc(450, sunY, 80, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,240,180,' + (0.4 + t*0.4) + ')';
    ctx.beginPath(); ctx.arc(450, sunY, 50, 0, Math.PI*2); ctx.fill();
    ctx.textAlign = 'center';
    ctx.font = 'bold 70px "Courier New", monospace';
    ctx.fillStyle = '#fff0c0';
    ctx.shadowColor = '#ffb040'; ctx.shadowBlur = 30;
    ctx.fillText('6:00 AM', 450, 190);
    ctx.shadowBlur = 0;
    ctx.font = 'bold 38px "Courier New", monospace';
    ctx.fillStyle = '#c8e0a0';
    ctx.fillText('FAMILY SURVIVED', 450, 260);
    // list family
    var alive = 0;
    for (var i = 0; i < gameState.family.length; i++) {
        var f = gameState.family[i];
        ctx.font = 'bold 22px "Courier New", monospace';
        ctx.fillStyle = f.alive ? '#a0e0a0' : '#6a3a3a';
        ctx.fillText((f.alive ? '✓ ' : '✗ ') + f.name, 450, 310 + i * 30);
        if (f.alive) alive++;
    }
    ctx.font = '18px "Courier New", monospace';
    ctx.fillStyle = '#e0e8f0';
    ctx.fillText('Time: ' + gameState.timeSurvived.toFixed(1) + 's · Alive: ' + alive + '/3', 450, 440);
    ctx.fillStyle = '#a0c0ff';
    ctx.fillText('PRESS ENTER TO PLAY AGAIN', 450, 500);
}

function drawPause() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, 900, 600);
    ctx.textAlign = 'center';
    ctx.font = 'bold 60px "Courier New", monospace';
    ctx.fillStyle = '#c8d8f0'; ctx.fillText('PAUSED', 450, 280);
    ctx.font = '18px "Courier New", monospace';
    ctx.fillStyle = '#8a9aad'; ctx.fillText('Press ESC to resume', 450, 340);
}

// ============ MAIN DRAW ============
function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (gameState.scene === 'title') { drawTitle(); return; }
    if (gameState.scene === 'dead') { drawHouse(); drawDemon(); drawFamilyMembers(); drawDeath(); return; }
    if (gameState.scene === 'win') { drawWin(); return; }
    ctx.save();
    if (gameState.shake > 0) ctx.translate((Math.random()-0.5)*gameState.shake*12, (Math.random()-0.5)*gameState.shake*12);
    drawHouse();
    drawDemon();
    drawFamilyMembers();
    drawPlayer();
    ctx.restore();
    if (gameState.flickerTimer > 0) {
        ctx.fillStyle = 'rgba(80,0,0,' + (Math.random()*0.25) + ')';
        ctx.fillRect(0, 0, 900, 600);
        for (var i = 0; i < 30; i++) { ctx.fillStyle = 'rgba(255,255,255,' + (Math.random()*0.1) + ')'; ctx.fillRect(Math.random()*900, Math.random()*600, 8, 8); }
    }
    drawHUD();
    if (gameState.paused) drawPause();
}

// ============ LOOP ============
var lastTime = performance.now() / 1000;
function gameLoop(now) {
    var nowSec = now / 1000;
    var dt = nowSec - lastTime;
    if (dt > 0.1) dt = 0.1;
    lastTime = nowSec;
    update(dt);
    draw();
    requestAnimationFrame(gameLoop);
}

// ============ INIT ============
document.getElementById('restartButton').addEventListener('click', function() {
    gameState.scene = 'title';
    gameState.paused = false;
});
gameState = freshState();
updateHUD();
requestAnimationFrame(gameLoop);

})();
</script>
</body>
