<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survive Until 6AM · Demon Stalker</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body {
        background: #05070a;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Courier New', Courier, monospace;
        overflow: hidden;
        color: #b3c7e5;
    }
    .game-wrapper {
        background: #1a1e24;
        padding: 16px;
        border-radius: 16px;
        box-shadow: 0 0 40px #000, inset 0 0 12px #2f3742;
    }
    canvas {
        display: block;
        width: 900px;
        height: 600px;
        image-rendering: crisp-edges;
        image-rendering: pixelated;
        border: 4px solid #3e4a5b;
        border-radius: 12px;
        background: #0b0d10;
        cursor: pointer;
    }
    .info-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
        gap: 8px;
        font-weight: bold;
        letter-spacing: 1px;
        font-size: 0.85rem;
    }
    .info-bar span {
        background: #1f262e;
        padding: 5px 12px;
        border-radius: 40px;
        border: 2px solid #4b5e77;
        box-shadow: inset 0 0 6px #000;
    }
    .restart-btn {
        background: #2d3847;
        border: none;
        color: #e5efff;
        font-family: inherit;
        font-weight: bold;
        padding: 5px 14px;
        border-radius: 40px;
        font-size: 0.85rem;
        cursor: pointer;
        border: 2px solid #6a7f9c;
        box-shadow: 0 4px 0 #0e1217;
    }
    .restart-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #0e1217; }
    .hint {
        text-align: center;
        margin-top: 6px;
        font-size: 0.75rem;
        color: #6a7a8a;
        letter-spacing: 1px;
    }
</style>
</head>
<body>
<div class="game-wrapper">
    <canvas id="gameCanvas" width="900" height="600"></canvas>
    <div class="info-bar">
        <span>🔒 <span id="lockCount">8/8</span></span>
        <span>⏳ <span id="clockDisplay">12:00 AM</span></span>
        <span>🔋 <span id="batteryDisplay">100%</span></span>
        <span>⚡ <span id="staminaDisplay">100%</span></span>
        <span>🏆 <span id="bestTime">--</span></span>
        <button class="restart-btn" id="restartButton">↻ RESTART</button>
    </div>
    <div class="hint">← → move rooms · SPACE flashlight · E interact · SHIFT sprint · ESC pause</div>
</div>
<script>
(function() {
"use strict";

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const lockCountSpan     = document.getElementById('lockCount');
const clockDisplaySpan  = document.getElementById('clockDisplay');
const batteryDisplaySpan= document.getElementById('batteryDisplay');
const staminaDisplaySpan= document.getElementById('staminaDisplay');
const bestTimeSpan      = document.getElementById('bestTime');
const restartButton     = document.getElementById('restartButton');

// ============================================================
// AUDIO
// ============================================================
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type, vol, slideTo) {
    if (!audioCtx) return;
    try {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = type || 'square';
        o.frequency.setValueAtTime(freq, audioCtx.currentTime);
        if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + dur);
        g.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + dur);
    } catch(e) {}
}
const playClick     = () => beep(880, 0.05, 'square', 0.05, 440);
const playLock      = () => beep(220, 0.14, 'sawtooth', 0.08, 110);
const playUnlock    = () => beep(180, 0.12, 'square', 0.06, 300);
const playBreak     = () => beep(140, 0.35, 'sawtooth', 0.13, 40);
const playGrowl     = () => beep(80, 0.5, 'sawtooth', 0.11, 45);
const playHeartbeat = () => beep(60, 0.1, 'sine', 0.14);
const playStep      = () => beep(120, 0.04, 'square', 0.03);
const playBarricade = () => beep(150, 0.2, 'square', 0.09, 80);
const playFlash     = () => beep(400, 0.05, 'square', 0.03);
function playScream() {
    if (!audioCtx) return;
    try {
        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(1400, audioCtx.currentTime);
        o.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 1.3);
        g.gain.setValueAtTime(0.28, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.3);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + 1.3);
    } catch(e) {}
}
function playWin() {
    [523, 659, 784, 1047].forEach((f,i) => setTimeout(() => beep(f, 0.25, 'sine', 0.12), i*180));
}

// ============================================================
// CONSTANTS
// ============================================================
const HOURS = ['12:00 AM','1:00 AM','2:00 AM','3:00 AM','4:00 AM','5:00 AM','6:00 AM'];
const DIFFICULTIES = {
    easy:      { hourLen: 20, baseInterval: 6.0 },
    normal:    { hourLen: 16, baseInterval: 4.5 },
    nightmare: { hourLen: 13, baseInterval: 3.2 }
};

function buildRooms() {
    return [
        {
            id: 'bedroom', name: 'BEDROOM',
            wall: '#1a1620', floor: '#13101a',
            entryPoints: [
                { x: 130, y: 300, w: 130, h: 220, type: 'window', label: 'WINDOW', locked: true, barricade: 0, maxBarricade: 3 },
                { x: 620, y: 200, w: 140, h: 280, type: 'door',   label: 'DOOR',   locked: true, barricade: 0, maxBarricade: 4 }
            ],
            objects: [
                { type: 'bed',  x: 340, y: 380, w: 200, h: 110 },
                { type: 'lamp', x: 60,  y: 140, w: 30,  h: 60, on: false }
            ]
        },
        {
            id: 'hallway', name: 'HALLWAY',
            wall: '#141820', floor: '#0f131a',
            entryPoints: [
                { x: 380, y: 200, w: 140, h: 260, type: 'door', label: 'FRONT', locked: true, barricade: 0, maxBarricade: 5 },
                { x: 100, y: 240, w: 100, h: 180, type: 'vent', label: 'VENT',  locked: true, barricade: 0, maxBarricade: 2 },
                { x: 700, y: 240, w: 100, h: 180, type: 'vent', label: 'VENT',  locked: true, barricade: 0, maxBarricade: 2 }
            ],
            objects: [
                { type: 'painting', x: 250, y: 130, w: 60, h: 80 },
                { type: 'painting', x: 590, y: 130, w: 60, h: 80 }
            ]
        },
        {
            id: 'kitchen', name: 'KITCHEN',
            wall: '#1c1814', floor: '#161210',
            entryPoints: [
                { x: 700, y: 280, w: 150, h: 240, type: 'window', label: 'WINDOW', locked: true, barricade: 0, maxBarricade: 3 },
                { x: 400, y: 180, w: 120, h: 80,  type: 'vent',   label: 'VENT',   locked: true, barricade: 0, maxBarricade: 2 }
            ],
            objects: [
                { type: 'counter', x: 100, y: 400, w: 200, h: 60 },
                { type: 'fridge',  x: 60,  y: 220, w: 70,  h: 170 }
            ]
        },
        {
            id: 'living', name: 'LIVING ROOM',
            wall: '#18161c', floor: '#121017',
            entryPoints: [
                { x: 100, y: 260, w: 150, h: 250, type: 'door',   label: 'BACK',   locked: true, barricade: 0, maxBarricade: 4 },
                { x: 620, y: 260, w: 150, h: 250, type: 'window', label: 'WINDOW', locked: true, barricade: 0, maxBarricade: 3 }
            ],
            objects: [
                { type: 'sofa', x: 330, y: 420, w: 240, h: 80 },
                { type: 'tv',   x: 380, y: 200, w: 140, h: 100, on: false }
            ]
        }
    ];
}

// ============================================================
// GAME STATE
// ============================================================
let gameState = {};

function freshState() {
    return {
        scene: 'title',
        difficulty: 'normal',
        hour: 0,
        hourTimer: 0,
        hourLength: 16,
        attackTimer: 0,
        attackInterval: 4.5,
        baseInterval: 4.5,
        demonForm: 'panther',
        formTimer: 6,
        flickerTimer: 0,
        clickCooldown: 0,
        demonBob: 0,
        demonPose: 'idle',
        poseTimer: 0,
        msg: '',
        msgTimer: 0,
        shake: 0,
        warning: 0,
        roomIndex: 0,
        stamina: 100,
        maxStamina: 100,
        sprinting: false,
        flashlight: false,
        battery: 100,
        maxBattery: 100,
        noise: 0,
        rooms: buildRooms(),
        demonTargetRoom: 0,
        demonTargetEntry: 0,
        demonAdaptCount: 0,
        timeSurvived: 0,
        deathTimer: 0,
        winTimer: 0,
        jumpscareTimer: 0,
        jumpscareForm: 'panther',
        heartbeatTimer: 0,
        heartbeatInterval: 1.5,
        moonFlicker: 0,
        paused: false,
        bloodSplats: [],
        sparks: [],
        keys: {}
    };
}

// ---------- best time ----------
let bestTime = 0;
try { const v = localStorage.getItem('demonStalkerBest2'); bestTime = v ? parseFloat(v) : 0; } catch(e){}
function saveBest(t) { try { localStorage.setItem('demonStalkerBest2', t.toString()); } catch(e){} }
function updateBestUI() {
    if (bestTime <= 0) { bestTimeSpan.textContent = '--'; return; }
    const h = Math.floor(bestTime / 60);
    const m = Math.floor(bestTime) % 60;
    const s = Math.floor((bestTime*10) % 10);
    bestTimeSpan.textContent = h + 'h' + m + 'm' + s + 's';
}
updateBestUI();

// ---------- helpers ----------
function currentRoom() { return gameState.rooms[gameState.roomIndex]; }
function totalLocked() {
    let c = 0;
    for (const r of gameState.rooms) for (const e of r.entryPoints) if (e.locked) c++;
    return c;
}
function totalEntryPoints() {
    let c = 0;
    for (const r of gameState.rooms) c += r.entryPoints.length;
    return c;
}
function updateHUD() {
    lockCountSpan.textContent = totalLocked() + '/' + totalEntryPoints();
    clockDisplaySpan.textContent = HOURS[gameState.hour];
    batteryDisplaySpan.textContent = Math.max(0, Math.floor(gameState.battery)) + '%';
    staminaDisplaySpan.textContent = Math.max(0, Math.floor(gameState.stamina)) + '%';
}

// ============================================================
// START
// ============================================================
function startGame(difficulty) {
    initAudio();
    gameState = freshState();
    gameState.difficulty = difficulty;
    const d = DIFFICULTIES[difficulty];
    gameState.hourLength = d.hourLen;
    gameState.baseInterval = d.baseInterval;
    gameState.attackInterval = d.baseInterval;
    gameState.scene = 'playing';
    gameState.msg = 'Lock every window & door!';
    gameState.msgTimer = 2.5;
    updateHUD();
}

// ============================================================
// INPUT
// ============================================================
window.addEventListener('keydown', function(e) {
    if (!gameState.keys) gameState.keys = {};
    const k = e.key.toLowerCase();
    gameState.keys[k] = true;

    if (gameState.scene === 'title') {
        if (e.key === '1') startGame('easy');
        if (e.key === '2') startGame('normal');
        if (e.key === '3') startGame('nightmare');
        return;
    }
    if (gameState.scene === 'playing' || gameState.scene === 'paused') {
        if (e.key === 'Escape') gameState.paused = !gameState.paused;
        if (e.key === ' ') { e.preventDefault(); toggleFlashlight(); }
        if (k === 'e') interact();
        if (e.key === 'ArrowLeft')  moveRoom(-1);
        if (e.key === 'ArrowRight') moveRoom(1);
    }
    if (gameState.scene === 'dead' || gameState.scene === 'win') {
        if (e.key === 'Enter' || e.key === ' ') gameState.scene = 'title';
    }
});
window.addEventListener('keyup', function(e) {
    if (gameState.keys) gameState.keys[e.key.toLowerCase()] = false;
});

canvas.addEventListener('click', function(e) {
    initAudio();
    const r = canvas.getBoundingClientRect();
    const mx = (e.clientX - r.left) * (canvas.width / r.width);
    const my = (e.clientY - r.top)  * (canvas.height / r.height);

    if (gameState.scene === 'title') {
        const btnY = 400;
        if (my > btnY && my < btnY + 55) {
            if (mx > 200 && mx < 340) startGame('easy');
            else if (mx > 360 && mx < 540) startGame('normal');
            else if (mx > 560 && mx < 700) startGame('nightmare');
        }
        return;
    }
    if (gameState.scene !== 'playing') return;
    if (gameState.paused) return;

    // room nav arrows
    if (mx < 55 && my > 250 && my < 400) { moveRoom(-1); return; }
    if (mx > 845 && my > 250 && my < 400) { moveRoom(1); return; }

    // interact with entry points
    const room = currentRoom();
    for (const ep of room.entryPoints) {
        if (mx >= ep.x && mx <= ep.x + ep.w && my >= ep.y && my <= ep.y + ep.h) {
            handleEntryClick(ep);
            return;
        }
    }
});

function handleEntryClick(ep) {
    if (ep.locked) {
        ep.locked = false;
        playUnlock();
        gameState.msg = ep.label + ' unlocked!';
        gameState.msgTimer = 1.2;
    } else if (ep.barricade < ep.maxBarricade) {
        ep.barricade++;
        playBarricade();
        gameState.msg = 'Barricade +1 (' + ep.barricade + '/' + ep.maxBarricade + ')';
        gameState.msgTimer = 1.2;
    } else {
        ep.locked = true;
        ep.barricade = 0;
        playLock();
        gameState.msg = ep.label + ' locked again';
        gameState.msgTimer = 1.2;
    }
    updateHUD();
}

function toggleFlashlight() {
    if (gameState.battery <= 0) { gameState.flashlight = false; return; }
    gameState.flashlight = !gameState.flashlight;
    playFlash();
}

function interact() {
    const room = currentRoom();
    for (const obj of room.objects) {
        if (obj.type === 'lamp' && !obj.on) {
            obj.on = true;
            gameState.msg = 'Lamp on. Panther hates light!';
            gameState.msgTimer = 1.8;
            return;
        }
        if (obj.type === 'tv' && !obj.on) {
            obj.on = true;
            gameState.msg = 'TV on. Drowns out noise.';
            gameState.msgTimer = 1.8;
            return;
        }
        if (obj.type === 'bed') {
            gameState.msg = 'You hide under the bed for a moment.';
            gameState.msgTimer = 1.5;
            gameState.noise = Math.max(0, gameState.noise - 25);
            return;
        }
    }
}

function moveRoom(dir) {
    if (gameState.stamina < 10) { gameState.msg = 'Too tired!'; gameState.msgTimer = 1; return; }
    const n = gameState.rooms.length;
    gameState.roomIndex = (gameState.roomIndex + dir + n) % n;
    playStep();
    gameState.stamina = Math.max(0, gameState.stamina - 8);
    gameState.noise = Math.min(100, gameState.noise + 12);
    updateHUD();
}

// ============================================================
// UPDATE
// ============================================================
function update(dt) {
    if (gameState.scene === 'title') {
        gameState.demonBob = Math.sin(Date.now() * 0.003) * 4;
        return;
    }
    if (gameState.scene === 'dead') {
        gameState.deathTimer += dt;
        gameState.jumpscareTimer += dt;
        gameState.shake = Math.max(0, gameState.shake - dt * 2);
        return;
    }
    if (gameState.scene === 'win') { gameState.winTimer += dt; return; }
    if (gameState.paused) return;

    gameState.timeSurvived += dt;

    // sprint / stamina
    gameState.sprinting = !!gameState.keys['shift'];
    if (gameState.sprinting && gameState.stamina > 0) {
        gameState.stamina = Math.max(0, gameState.stamina - dt * 18);
        gameState.noise = Math.min(100, gameState.noise + dt * 25);
    } else {
        gameState.stamina = Math.min(gameState.maxStamina, gameState.stamina + dt * 12);
    }

    // flashlight battery
    if (gameState.flashlight) {
        gameState.battery = Math.max(0, gameState.battery - dt * 4.5);
        if (gameState.battery <= 0) {
            gameState.flashlight = false;
            gameState.msg = 'Battery dead!';
            gameState.msgTimer = 2;
        }
    } else {
        gameState.battery = Math.min(gameState.maxBattery, gameState.battery + dt * 0.6);
    }

    // noise decay
    gameState.noise = Math.max(0, gameState.noise - dt * 20);

    // timers
    if (gameState.clickCooldown > 0) gameState.clickCooldown -= dt;
    if (gameState.msgTimer > 0) gameState.msgTimer -= dt;
    if (gameState.formTimer > 0) gameState.formTimer -= dt;
    if (gameState.flickerTimer > 0) gameState.flickerTimer -= dt;
    if (gameState.shake > 0) gameState.shake = Math.max(0, gameState.shake - dt * 2.5);
    if (gameState.warning > 0) gameState.warning = Math.max(0, gameState.warning - dt);
    if (gameState.poseTimer > 0) gameState.poseTimer -= dt;
    gameState.demonBob = Math.sin(Date.now() * 0.008) * 3;

    // fx decay
    for (let i = gameState.bloodSplats.length - 1; i >= 0; i--) {
        gameState.bloodSplats[i].life -= dt;
        if (gameState.bloodSplats[i].life <= 0) gameState.bloodSplats.splice(i, 1);
    }
    for (let i = gameState.sparks.length - 1; i >= 0; i--) {
        gameState.sparks[i].life -= dt;
        gameState.sparks[i].vy += dt * 200;
        gameState.sparks[i].y += gameState.sparks[i].vy * dt;
        if (gameState.sparks[i].life <= 0) gameState.sparks.splice(i, 1);
    }

    // heartbeat
    const lockedRatio = totalLocked() / totalEntryPoints();
    gameState.heartbeatInterval = 0.5 + lockedRatio * 1.5 + gameState.noise * 0.003;
    gameState.heartbeatTimer += dt;
    if (gameState.heartbeatTimer >= gameState.heartbeatInterval) {
        gameState.heartbeatTimer = 0;
        playHeartbeat();
    }

    // random flicker
    if (Math.random() < 0.004) gameState.flickerTimer = 0.3;
    gameState.moonFlicker = Math.random() < 0.015 ? 0.15 : 0;

    // form change
    if (gameState.formTimer <= 0) {
        const forms = ['panther', 'dog', 'wolf'];
        let nf = forms[Math.floor(Math.random() * 3)];
        if (nf === gameState.demonForm) nf = forms[(forms.indexOf(nf) + 1) % 3];
        gameState.demonForm = nf;
        gameState.msg = 'Demon is now a ' + nf.toUpperCase();
        gameState.msgTimer = 1.8;
        gameState.formTimer = 6 + Math.random() * 6;
    }

    // attack warning + attack
    gameState.attackTimer += dt;
    if (gameState.attackTimer >= gameState.attackInterval - 0.9 && gameState.warning <= 0) {
        gameState.warning = 0.9;
        playGrowl();
    }
    if (gameState.attackTimer >= gameState.attackInterval) {
        gameState.attackTimer = 0;
        performAttack();
    }

    // hour advance
    gameState.hourTimer += dt;
    if (gameState.hourTimer >= gameState.hourLength) {
        gameState.hourTimer = 0;
        if (gameState.hour < 6) {
            gameState.hour++;
            updateHUD();
            const scale = [1, 0.85, 0.72, 0.60, 0.50, 0.38][gameState.hour] || 0.38;
            gameState.baseInterval = DIFFICULTIES[gameState.difficulty].baseInterval * scale;
            gameState.attackInterval = Math.min(gameState.attackInterval, gameState.baseInterval);
            // small mercy heal
            gameState.battery = Math.min(gameState.maxBattery, gameState.battery + 25);
            gameState.stamina = gameState.maxStamina;
            if (gameState.hour >= 6) {
                gameState.scene = 'win';
                gameState.winTimer = 0;
                playWin();
                if (gameState.timeSurvived > bestTime) {
                    bestTime = gameState.timeSurvived;
                    saveBest(bestTime);
                    updateBestUI();
                }
            } else {
                gameState.msg = 'Hour ' + gameState.hour + ' — it grows bolder';
                gameState.msgTimer = 2;
            }
        }
    }
}

// ---------- Demon AI ----------
function performAttack() {
    const rooms = gameState.rooms;
    const candidates = [];
    for (let ri = 0; ri < rooms.length; ri++) {
        const r = rooms[ri];
        for (let ei = 0; ei < r.entryPoints.length; ei++) {
            const ep = r.entryPoints[ei];
            let weight = 1.0;
            if (!ep.locked) weight += 2.5;
            if (ep.barricade > 0) weight -= ep.barricade * 0.4;
            if (ri === gameState.demonTargetRoom && ei === gameState.demonTargetEntry) weight += 1.5;
            if (weight < 0.1) weight = 0.1;
            candidates.push({ ri, ei, w: weight });
        }
    }
    let total = 0;
    for (const c of candidates) total += c.w;
    let roll = Math.random() * total;
    let pick = candidates[0];
    for (const c of candidates) {
        roll -= c.w;
        if (roll <= 0) { pick = c; break; }
    }

    let room = rooms[pick.ri];
    let ep   = room.entryPoints[pick.ei];

    // form-specific preference
    let preferredType = gameState.demonForm === 'panther' ? 'door'
                      : gameState.demonForm === 'dog'     ? 'window'
                      : 'vent';
    if (ep.type !== preferredType && Math.random() < 0.5) {
        const matching = candidates.filter(function(c) {
            return rooms[c.ri].entryPoints[c.ei].type === preferredType;
        });
        if (matching.length > 0) {
            pick = matching[Math.floor(Math.random() * matching.length)];
            room = rooms[pick.ri];
            ep = room.entryPoints[pick.ei];
        }
    }

    gameState.demonTargetRoom = pick.ri;
    gameState.demonTargetEntry = pick.ei;
    attackEntry(room, ep);
}

function attackEntry(room, ep) {
    gameState.demonPose = 'attack';
    gameState.poseTimer = 0.5;
    gameState.shake = 1.0;
    playBreak();

    // barricade absorbs
    if (ep.barricade > 0) {
        ep.barricade--;
        gameState.msg = gameState.demonForm.toUpperCase() + ' smashes a barricade in ' + room.name + '!';
        gameState.msgTimer = 1.8;
        for (let i = 0; i < 12; i++) {
            gameState.sparks.push({
                x: ep.x + ep.w/2 + (Math.random() - 0.5) * ep.w,
                y: ep.y + ep.h/2 + (Math.random() - 0.5) * ep.h,
                vy: -Math.random() * 180,
                life: 0.6 + Math.random() * 0.4
            });
        }
        return;
    }

    if (ep.locked) {
        ep.locked = false;
        gameState.msg = gameState.demonForm.toUpperCase() + ' broke the ' + ep.label + ' lock in ' + room.name + '!';
        gameState.msgTimer = 1.8;
        gameState.bloodSplats.push({ x: ep.x + ep.w/2, y: ep.y + ep.h/2, life: 3 });
        updateHUD();
        handleFormExtra(ep, room);
        return;
    }

    // unlocked entry → demon enters → death
    gameState.scene = 'dead';
    gameState.deathTimer = 0;
    gameState.jumpscareTimer = 0;
    gameState.jumpscareForm = gameState.demonForm;
    playScream();
    gameState.shake = 2;
}

function handleFormExtra(ep, room) {
    if (gameState.demonForm === 'panther' && Math.random() < 0.3) {
        const otherRooms = gameState.rooms.filter(function(r) { return r.id !== room.id; });
        if (otherRooms.length > 0) {
            const or = otherRooms[Math.floor(Math.random() * otherRooms.length)];
            const oep = or.entryPoints[Math.floor(Math.random() * or.entryPoints.length)];
            if (oep.locked) {
                setTimeout(function() {
                    if (gameState.scene !== 'playing') return;
                    oep.locked = false;
                    gameState.msg = '🐾 PANTHER double swipe!';
                    gameState.msgTimer = 1.4;
                    gameState.bloodSplats.push({ x: oep.x + oep.w/2, y: oep.y + oep.h/2, life: 3 });
                    updateHUD();
                }, 260);
            }
        }
    } else if (gameState.demonForm === 'dog' && Math.random() < 0.35) {
        const others = room.entryPoints.filter(function(e) { return e !== ep && e.locked; });
        if (others.length > 0) {
            const o = others[Math.floor(Math.random() * others.length)];
            o.locked = false;
            gameState.msg = '🐕 DOG bites another lock!';
            gameState.msgTimer = 1.4;
            gameState.bloodSplats.push({ x: o.x + o.w/2, y: o.y + o.h/2, life: 3 });
            updateHUD();
        }
    } else if (gameState.demonForm === 'wolf' && Math.random() < 0.45) {
        gameState.flickerTimer = 1.0;
        gameState.msg = '🐺 WOLF howls! Vision blurs...';
        gameState.msgTimer = 1.5;
    }
}
