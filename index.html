// ---------------------------------------------------------
// BAKE SPRITES
// ---------------------------------------------------------
function bake(rows){
  const w = Math.max(...rows.map(r=>r.length));
  const h = rows.length;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  for(let y=0;y<h;y++){
    const row = rows[y];
    for(let x=0;x<row.length;x++){
      const col = PAL[row[x]];
      if(!col) continue;
      g.fillStyle = col;
      g.fillRect(x,y,1,1);
    }
  }
  return c;
}

const SPR = {};
for(const k in RAW){
  const img = bake(RAW[k]);
  // anchor: bottom-center on a 16x16 tile
  SPR[k] = { img, ox: Math.floor((16-img.width)/2), oy: 16-img.height };
}

function makeFloor(v){
  const c = document.createElement('canvas'); c.width=c.height=16;
  const g = c.getContext('2d');
  const bases = ['#2a2434','#272231','#2d2738','#252030','#2b2536','#292333'];
  g.fillStyle = bases[v%6]; g.fillRect(0,0,16,16);

  // slab grout (2x2 slabs of 8)
  g.fillStyle = 'rgba(10,7,16,0.85)';
  g.fillRect(0,0,16,1); g.fillRect(0,8,16,1);
  g.fillRect(0,0,1,16); g.fillRect(8,0,1,16);
  // slab top-left highlight
  g.fillStyle = 'rgba(120,105,150,0.10)';
  g.fillRect(1,1,7,1); g.fillRect(9,1,7,1);
  g.fillRect(1,9,7,1); g.fillRect(9,9,7,1);
  // bottom shadow
  g.fillStyle = 'rgba(0,0,0,0.20)';
  g.fillRect(1,7,7,1); g.fillRect(9,7,7,1);
  g.fillRect(7,1,1,7); g.fillRect(15,1,1,7);

  // speckle noise
  let s = v*7919 + 13;
  const rndp = ()=>{ s = (s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; };
  for(let i=0;i<26;i++){
    const x = Math.floor(rndp()*16), y = Math.floor(rndp()*16);
    const d = rndp();
    if(d<0.55) g.fillStyle='rgba(0,0,0,0.22)';
    else if(d<0.85) g.fillStyle='rgba(150,135,180,0.09)';
    else g.fillStyle='rgba(90,120,80,0.13)';
    g.fillRect(x,y,1,1);
  }
  // cracks
  if(v>=3){
    g.strokeStyle='rgba(0,0,0,0.45)';
    g.lineWidth=1;
    g.beginPath();
    let cx = 2+Math.floor(rndp()*11), cy = 2+Math.floor(rndp()*11);
    g.moveTo(cx,cy);
    for(let i=0;i<4;i++){ cx += Math.floor(rndp()*5)-2; cy += Math.floor(rndp()*5)-2; g.lineTo(cx,cy); }
    g.stroke();
  }
  // moss patches
  if(v===5){
    for(let i=0;i<14;i++){
      const x = Math.floor(rndp()*16), y = Math.floor(rndp()*16);
      g.fillStyle = 'rgba(70,110,60,0.22)';
      g.fillRect(x,y,1,1);
    }
  }
  return c;
}

function makeWall(v){
  const c = document.createElement('canvas'); c.width=c.height=16;
  const g = c.getContext('2d');
  g.fillStyle = '#1a1622'; g.fillRect(0,0,16,16);

  // brick rows of 8px height
  const rowCols = [['#241e2e','#2a2336'],['#221c2b','#281f31']];
  for(let r=0;r<2;r++){
    const y = r*8;
    const offset = (r%2)*4;
    // mortar
    g.fillStyle = '#0b0810';
    g.fillRect(0,y,16,1);
    for(let b=-1;b<3;b++){
      const bx = b*8 + offset;
      g.fillRect(bx, y, 1, 8);
      // brick face
      const shade = (b+r)%2===0 ? rowCols[v%2][0] : rowCols[v%2][1];
      g.fillStyle = shade;
      g.fillRect(bx+1, y+1, 7, 6);
      // top highlight
      g.fillStyle = 'rgba(140,120,175,0.13)';
      g.fillRect(bx+1, y+1, 7, 1);
      // bottom shadow
      g.fillStyle = 'rgba(0,0,0,0.35)';
      g.fillRect(bx+1, y+6, 7, 1);
    }
  }
  // grime
  let s = v*4441 + 71;
  const rndp = ()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; };
  for(let i=0;i<20;i++){
    const x=Math.floor(rndp()*16), y=Math.floor(rndp()*16);
    g.fillStyle = rndp()<0.5 ? 'rgba(0,0,0,0.25)' : 'rgba(80,120,70,0.10)';
    g.fillRect(x,y,1,1);
  }
  return c;
}

for(let i=0;i<6;i++) floorTiles.push(makeFloor(i));
for(let i=0;i<4;i++) wallTiles.push(makeWall(i));

// ---------------------------------------------------------
// AUDIO (tiny synth)
// ---------------------------------------------------------
let actx = null;
function initAudio(){
  if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
}
function sfx(type){
  if(!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.connect(g); g.connect(actx.destination);
  let freq=220, dur=0.08, wave='square', vol=0.05;
  switch(type){
    case 'hit':    freq=160; dur=0.09; wave='square'; vol=0.06; break;
    case 'hurt':   freq=90;  dur=0.16; wave='sawtooth'; vol=0.07; break;
    case 'kill':   freq=60;  dur=0.22; wave='sawtooth'; vol=0.06; break;
    case 'pickup': freq=660; dur=0.07; wave='triangle'; vol=0.05; break;
    case 'raise':  freq=330; dur=0.30; wave='sine'; vol=0.07; break;
    case 'level':  freq=520; dur=0.35; wave='triangle'; vol=0.06; break;
    case 'stairs': freq=440; dur=0.25; wave='sine'; vol=0.05; break;
    case 'boss':   freq=110; dur=0.6;  wave='sawtooth'; vol=0.08; break;
  }
  o.type = wave;
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*0.4), t+dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.start(t); o.stop(t+dur+0.02);
}

// ---------------------------------------------------------
// MAP GENERATION
// ---------------------------------------------------------
function genMap(d){
  tiles = new Uint8Array(MAPW*MAPH);
  seen = new Uint8Array(MAPW*MAPH);
  visible = new Uint8Array(MAPW*MAPH);
  rooms = [];

  const target = 9 + Math.min(7, d);
  for(let i=0;i<500 && rooms.length<target;i++){
    const w = rnd(5,11), h = rnd(4,8);
    const x = rnd(1, MAPW-w-1), y = rnd(1, MAPH-h-1);
    let ok = true;
    for(const o of rooms){
      if(x < o.x+o.w+2 && x+w+2 > o.x && y < o.y+o.h+2 && y+h+2 > o.y){ ok=false; break; }
    }
    if(ok) rooms.push({x,y,w,h});
  }

  const carve=(x,y)=>{ if(x>0&&y>0&&x<MAPW-1&&y<MAPH-1) tiles[y*MAPW+x]=1; };

  for(const r of rooms)
    for(let y=r.y;y<r.y+r.h;y++)
      for(let x=r.x;x<r.x+r.w;x++) carve(x,y);

  const ctr = r => ({ x: Math.floor(r.x+r.w/2), y: Math.floor(r.y+r.h/2) });

  for(let i=1;i<rooms.length;i++){
    const a = ctr(rooms[i-1]), b = ctr(rooms[i]);
    if(Math.random()<0.5){
      for(let x=Math.min(a.x,b.x);x<=Math.max(a.x,b.x);x++){ carve(x,a.y); carve(x,a.y+1); }
      for(let y=Math.min(a.y,b.y);y<=Math.max(a.y,b.y);y++){ carve(b.x,y); carve(b.x+1,y); }
    } else {
      for(let y=Math.min(a.y,b.y);y<=Math.max(a.y,b.y);y++){ carve(a.x,y); carve(a.x+1,y); }
      for(let x=Math.min(a.x,b.x);x<=Math.max(a.x,b.x);x++){ carve(x,b.y); carve(x,b.y+1); }
    }
  }
  // a couple of loops for better flow
  for(let k=0;k<2 && rooms.length>3;k++){
    const a = ctr(choice(rooms)), b = ctr(choice(rooms));
    for(let x=Math.min(a.x,b.x);x<=Math.max(a.x,b.x);x++) carve(x,a.y);
    for(let y=Math.min(a.y,b.y);y<=Math.max(a.y,b.y);y++) carve(b.x,y);
  }

  // stairs in the room farthest from start
  const start = ctr(rooms[0]);
  let best = rooms[1]||rooms[0], bestD = -1;
  for(const r of rooms){
    const c = ctr(r);
    const dd = (c.x-start.x)**2 + (c.y-start.y)**2;
    if(dd>bestD){ bestD=dd; best=r; }
  }
  const sc = ctr(best);
  tiles[sc.y*MAPW+sc.x] = 2;

  return { start, stairRoom: best };
}

// ---------------------------------------------------------
// ENTITY HELPERS
// ---------------------------------------------------------
let uid = 1;
function mkEntity(o){
  return Object.assign({
    id: uid++, x:0, y:0, hp:10, maxhp:10, atk:3, def:0,
    sprite:'skel', name:'?', ai:'hostile', range:1, xp:0,
    cd:0, dead:false, flash:0, bob: Math.random()*6.28,
    isPlayer:false, isAlly:false, boss:false, heal:false
  }, o);
}

function entityAt(x,y){
  return entities.find(e=>!e.dead && e.x===x && e.y===y);
}
function isWall(x,y){
  if(x<0||y<0||x>=MAPW||y>=MAPH) return true;
  return tiles[y*MAPW+x]===0;
}
function walkable(x,y){
  if(isWall(x,y)) return false;
  if(entityAt(x,y)) return false;
  return true;
}

// ---------------------------------------------------------
// FOV
// ---------------------------------------------------------
function los(x0,y0,x1,y1){
  let dx=Math.abs(x1-x0), dy=Math.abs(y1-y0);
  let sx = x0<x1?1:-1, sy = y0<y1?1:-1;
  let err = dx-dy, x=x0, y=y0;
  let guard = 0;
  while(guard++ < 200){
    if(x===x1 && y===y1) return true;
    if(!(x===x0 && y===y0) && tiles[y*MAPW+x]===0) return false;
    const e2 = 2*err;
    if(e2 > -dy){ err -= dy; x += sx; }
    if(e2 <  dx){ err += dx; y += sy; }
  }
  return false;
}

function computeFOV(){
  visible.fill(0);
  const R = 9;
  for(let y=-R;y<=R;y++){
    for(let x=-R;x<=R;x++){
      if(x*x+y*y > R*R+1) continue;
      const cx = player.x+x, cy = player.y+y;
      if(cx<0||cy<0||cx>=MAPW||cy>=MAPH) continue;
      if(los(player.x, player.y, cx, cy)){
        visible[cy*MAPW+cx] = 1;
        seen[cy*MAPW+cx] = 1;
      }
    }
  }
  // light the tile you stand on
  visible[player.y*MAPW+player.x] = 1;
  seen[player.y*MAPW+player.x] = 1;
}

// PARTICLES / FX
// ---------------------------------------------------------
function spawnParticles(x,y,n,color,spd){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2;
    const s = (0.3+Math.random()*0.7)*(spd||1);
    particles.push({
      x: x*TILE+8, y: y*TILE+8,
      vx: Math.cos(a)*s, vy: Math.sin(a)*s - 0.4,
      life: 1, color, size: Math.random()<0.4?2:1
    });
  }
}
function spawnFloater(x,y,text,color){
  floaters.push({ x:x*TILE+8, y:y*TILE+4, text, color, life:1 });
}
function addDecal(x,y,type){
  decals.push({ x, y, type, a: 0.85 });
  if(decals.length>160) decals.shift();
}

// ---------------------------------------------------------
// LEVEL / PLAYER
// ---------------------------------------------------------
function newPlayer(){
  return mkEntity({
    x:0, y:0, hp:34, maxhp:34, atk:6, def:1,
    sprite:'necro', name:'The Reborn', isPlayer:true,
    level:1, xp:0, next:14, essence:12, maxEssence:12,
    potions:1, maxMinions:2, essenceTick:0
  });
}

function xpForLevel(l){ return Math.floor(14 * Math.pow(l, 1.45)); }

function gainXP(n){
  player.xp += n;
  while(player.xp >= player.next){
    player.xp -= player.next;
    player.level++;
    player.next = xpForLevel(player.level);
    player.maxhp += 6; player.hp += 6;
    player.atk += 1;
    if(player.level%3===0) player.def += 1;
    player.maxEssence += 2; player.essence = player.maxEssence;
    if(player.level%4===0) player.maxMinions++;
    sfx('level');
    log(`You ascend to level ${player.level}.`, '#b6ff7a');
    offerBoons();
  }
}

const BOONS = [
  { n:'Ossuary Plate',   d:'+9 Max HP, fully healed',   f:()=>{ player.maxhp+=9; player.hp=player.maxhp; } },
  { n:'Grave Strength',  d:'+3 Attack',                 f:()=>{ player.atk+=3; } },
  { n:'Bone Ward',       d:'+2 Defense',                f:()=>{ player.def+=2; } },
  { n:'Soul Siphon',     d:'+6 Max Essence, refill',    f:()=>{ player.maxEssence+=6; player.essence=player.maxEssence; } },
  { n:'Legion',          d:'+1 Max raised skeleton',    f:()=>{ player.maxMinions++; } },
  { n:'Deathly Vigor',   d:'Heal 50% and +4 Max HP',    f:()=>{ player.maxhp+=4; player.hp=Math.min(player.maxhp, player.hp+Math.floor(player.maxhp*0.5)); } },
  { n:'Hollow Bones',    d:'+1 Attack, +1 Defense',     f:()=>{ player.atk+=1; player.def+=1; } }
];

function offerBoons(){
  const pool = BOONS.slice();
  boonChoices = [];
  for(let i=0;i<3 && pool.length;i++){
    boonChoices.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  }
  state = 'boon';
}

// ---------------------------------------------------------
// FLOOR BUILD
// ---------------------------------------------------------
function buildFloor(d){
  depth = d;
  const info = genMap(d);
  entities = [];
  items = [];
  particles = [];
  decals = [];
  floaters = [];
  boonChoices = null;

  if(!player) player = newPlayer();
  player.x = info.start.x;
  player.y = info.start.y;

  // ensure start tile is walkable floor
  tiles[player.y*MAPW+player.x] = 1;

  const def = FLOORS[Math.min(d-1, FLOORS.length-1)];
  const scaleHP  = 1 + (d-1)*0.16;
  const scaleATK = 1 + (d-1)*0.11;

  // --- enemies ---
  const freeTiles = [];
  for(const r of rooms){
    if(r === rooms[0] && d>1) continue;
    for(let y=r.y;y<r.y+r.h;y++)
      for(let x=r.x;x<r.x+r.w;x++)
        if(!isWall(x,y) && !(x===player.x&&y===player.y)) freeTiles.push({x,y});
  }
  // shuffle
  for(let i=freeTiles.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [freeTiles[i],freeTiles[j]] = [freeTiles[j],freeTiles[i]];
  }

  let count = def.n;
  let fi = 0;
  for(let i=0;i<count && fi<freeTiles.length;i++){
    const t = freeTiles[fi++];
    if(entityAt(t.x,t.y)) continue;
    const key = choice(def.pool);
    const tpl = MOBS[key];
    const e = mkEntity({
      x:t.x, y:t.y,
      hp: Math.round(tpl.hp*scaleHP),
      maxhp: Math.round(tpl.hp*scaleHP),
      atk: Math.round(tpl.atk*scaleATK),
      def: tpl.def,
      sprite: tpl.sprite, name: tpl.name,
      range: tpl.range, xp: tpl.xp, heal: !!tpl.heal
    });
    entities.push(e);
  }

  // --- boss ---
  if(def.boss){
    const sr = info.stairRoom;
    // put stairs elsewhere-ish; boss in the big room
    const bc = { x: Math.floor(sr.x+sr.w/2), y: Math.floor(sr.y+sr.h/2) };
    const boss = mkEntity({
      x:bc.x, y:bc.y,
      hp: BISHOP.hp, maxhp: BISHOP.hp, atk: BISHOP.atk, def: BISHOP.def,
      sprite: BISHOP.sprite, name: BISHOP.name, range: BISHOP.range,
      xp: BISHOP.xp, boss: true
    });
    entities.push(boss);
    // boss guards
    for(let i=0;i<4;i++){
      const t = freeTiles[fi++]; if(!t) continue;
      const e = mkEntity({
        x:t.x, y:t.y, hp:40, maxhp:40, atk:12, def:5,
        sprite:'knight', name:'Temple Knight', range:1, xp:26
      });
      entities.push(e);
    }
    sfx('boss');
  }

  // --- corpses to raise ---
  const corpses = 3 + rnd(0,3);
  for(let i=0;i<corpses && fi<freeTiles.length;i++){
    const t = freeTiles[fi++];
    if(entityAt(t.x,t.y)) continue;
    items.push({ x:t.x, y:t.y, kind:'corpse', spr:'corpse' });
  }

  // --- loot ---
  const lootCount = 3 + rnd(0,3);
  const kinds = ['potion','soul','scroll','shard','charm'];
  for(let i=0;i<lootCount && fi<freeTiles.length;i++){
    const t = freeTiles[fi++];
    if(entityAt(t.x,t.y)) continue;
    let k = choice(kinds);
    if(k==='potion' && Math.random()<0.45) k='soul';
    items.push({ x:t.x, y:t.y, kind:k, spr:k });
  }

  computeFOV();
  log(`— ${def.name} —`, '#8a68b4');
  if(def.boss) log('A cold hymn drifts down the nave...', '#ff8f6a');
}

// ---------------------------------------------------------
// TURN LOGIC
// ---------------------------------------------------------
function playerActed(){
  turn++;
  // essence regen
  player.essenceTick++;
  if(player.essenceTick >= 3){
    player.essenceTick = 0;
    if(player.essence < player.maxEssence) player.essence++;
  }
  // allies & enemies act
  for(const e of entities.slice()){
    if(e.dead || e.isPlayer) continue;
    if(e.isAlly) allyTurn(e); else enemyTurn(e);
  }
  // cleanup dead
  entities = entities.filter(e=>!e.dead);
  computeFOV();

  if(player.hp <= 0 && state === 'play'){
    state = 'dead';
    deathTimer = 0;
    sfx('kill');
    log('Your bones crumble to dust...', '#d4443a');
  }
}

function chebyshev(a,b){ return Math.max(Math.abs(a.x-b.x), Math.abs(a.y-b.y)); }

function tryAttack(attacker, target){
  const dmgBase = attacker.atk - target.def;
  const dmg = Math.max(1, Math.round(dmgBase * (0.75 + Math.random()*0.5)));
  target.hp -= dmg;
  target.flash = 6;
  shake = Math.min(6, shake + 2);
  sfx('hit');
  spawnParticles(target.x, target.y, 7, '#d4443a', 1.3);

  if(target.isPlayer){
    sfx('hurt');
    spawnFloater(target.x, target.y, `-${dmg}`, '#ff8f6a');
  } else {
    spawnFloater(target.x, target.y, `${dmg}`, '#f7f2df');
  }

  if(target.hp <= 0){
    killEntity(target, attacker);
  }
}

function killEntity(target, killer){
  target.dead = true;
  sfx('kill');
  addDecal(target.x, target.y, 'blood');
  spawnParticles(target.x, target.y, 14, target.boss ? '#ffe6a0' : '#8f2622', 1.8);

  if(target.isAlly){
    log(`${target.name} collapses.`, '#a89f80');
    return;
  }

  // drop a corpse to raise
  if(!items.some(i=>i.x===target.x && i.y===target.y && i.kind==='corpse')){
    items.push({ x:target.x, y:target.y, kind:'corpse', spr:'corpse' });
  }

  // soul wisps fly to the player
  spawnParticles(target.x, target.y, 6, '#b6ff7a', 1.2);

  const gain = Math.round(target.xp * 0.6);
  gainXP(target.xp);
  player.essence = Math.min(player.maxEssence, player.essence + gain);

  if(target.isPlayer) return;

  log(`${target.name} is destroyed.`, '#b6ff7a');

  if(target.boss){
    state = 'win';
    winTimer = 0;
    log('The Bishop falls. The cathedral goes silent.', '#ffe6a0');
  }
}

function canSee(a,b){ return visible[b.y*MAPW+b.x] === 1; }

function stepToward(e, tx, ty){
  const dx = Math.sign(tx - e.x), dy = Math.sign(ty - e.y);
  const opts = [];
  if(dx && dy) opts.push({x:e.x+dx, y:e.y+dy});
  if(Math.abs(tx-e.x) > Math.abs(ty-e.y)){
    if(dx) opts.push({x:e.x+dx, y:e.y});
    if(dy) opts.push({x:e.x, y:e.y+dy});
  } else {
    if(dy) opts.push({x:e.x, y:e.y+dy});
    if(dx) opts.push({x:e.x+dx, y:e.y});
  }
  for(const o of opts){
    if(walkable(o.x,o.y)){ e.x=o.x; e.y=o.y; return true; }
  }
  return false;
}

function nearestEnemy(from){
  let best=null, bd=1e9;
  for(const e of entities){
    if(e.dead || e.isAlly || e.isPlayer) continue;
    const d = chebyshev(from,e);
    if(d<bd){ bd=d; best=e; }
  }
  return best;
}

function enemyTurn(e){
  if(e.flash>0) e.flash--;
  const d = chebyshev(e, player);

  // Cleric heals nearby wounded allies
  if(e.heal && Math.random()<0.35){
    let tgt=null, worst=1;
    for(const o of entities){
      if(o.dead || o.isPlayer || o.isAlly) continue;
      if(o===e) continue;
      if(chebyshev(e,o)<=5 && o.hp/o.maxhp < worst){ worst=o.hp/o.maxhp; tgt=o; }
    }
    if(tgt){
      const amt = Math.round(tgt.maxhp*0.28);
      tgt.hp = Math.min(tgt.maxhp, tgt.hp+amt);
      spawnFloater(tgt.x,tgt.y,`+${amt}`,'#f2f2ee');
      spawnParticles(tgt.x,tgt.y,8,'#f2f2ee',1);
      log(`${e.name} mends ${tgt.name}.`, '#f2f2ee');
      return;
    }
  }

  // Bishop summons
  if(e.boss && Math.random()<0.22){
    const free=[];
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
      const nx=e.x+dx, ny=e.y+dy;
      if(walkable(nx,ny)) free.push({x:nx,y:ny});
    }
    if(free.length){
      const s = choice(free);
      const m = mkEntity({
        x:s.x, y:s.y, hp:26, maxhp:26, atk:10, def:3,
        sprite:'inquisitor', name:'Summoned Zealot', range:4, xp:12, isAlly:false
      });
      entities.push(m);
      spawnParticles(s.x,s.y,10,'#ffe6a0',1.4);
      log('Aldous calls forth a zealot!', '#ffe6a0');
      return;
    }
  }

  // ranged attack
  if(e.range > 1 && d <= e.range && d > 1 && canSee(e, player) && los(e.x,e.y,player.x,player.y)){
    tryAttack(e, player);
    // beam fx
    spawnParticles(e.x, e.y, 5, e.boss ? '#ffe6a0' : '#ff8f6a', 0.8);
    return;
  }

  // melee
  if(d <= 1 && e.range === 1){
    tryAttack(e, player);
    return;
  }

  // chase
  if(d <= 11 && canSee(e, player)){
    stepToward(e, player.x, player.y);
  } else if(d <= 4){
    stepToward(e, player.x, player.y);
  } else if(Math.random()<0.4){
    // wander
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    const dd = choice(dirs);
    if(walkable(e.x+dd[0], e.y+dd[1])){ e.x+=dd[0]; e.y+=dd[1]; }
  }
}

function allyTurn(e){
  if(e.flash>0) e.flash--;
  const t = nearestEnemy(e);
  if(!t) {
    // follow the player
    if(chebyshev(e,player) > 2) stepToward(e, player.x, player.y);
    return;
  }
  const d = chebyshev(e,t);
  if(d <= 1){ tryAttack(e, t); return; }
  if(d <= 10) stepToward(e, t.x, t.y);
}

// ---------------------------------------------------------
// PLAYER ACTIONS
// ---------------------------------------------------------
function movePlayer(dx,dy){
  if(state!=='play') return;
  const nx = player.x+dx, ny = player.y+dy;

  const target = entityAt(nx,ny);
  if(target){
    if(target.isAlly){
      // swap-ish: just don't move
      return;
    }
    tryAttack(player, target);
    playerActed();
    return;
  }
  if(isWall(nx,ny)) return;
  player.x = nx; player.y = ny;
  pickUpHere();
  playerActed();
}

function waitTurn(){
  if(state!=='play') return;
  player.hp = Math.min(player.maxhp, player.hp + 0);
  playerActed();
}

function pickUpHere(){
  for(let i=items.length-1;i>=0;i--){
    const it = items[i];
    if(it.x!==player.x || it.y!==player.y) continue;
    if(it.kind==='corpse') continue;
    items.splice(i,1);
    applyItem(it);
  }
}

function applyItem(it){
  sfx('pickup');
  switch(it.kind){
    case 'potion':
      player.potions++;
      log('You clutch a vial of crimson.', '#d4443a');
      break;
    case 'soul':
      const e = 5 + Math.floor(depth*1.5);
      player.essence = Math.min(player.maxEssence, player.essence+e);
      spawnFloater(player.x,player.y,`+${e} essence`,'#b6ff7a');
      log('Soul essence seeps into your bones.', '#b6ff7a');
      break;
    case 'scroll':
      const x = 10 + depth*7;
      gainXP(x);
      spawnFloater(player.x,player.y,`+${x} xp`,'#b99ada');
      log('Forbidden knowledge burns through you.', '#b99ada');
      break;
    case 'shard':
      player.atk += 1;
      spawnFloater(player.x,player.y,'+1 ATK','#7fe0ff');
      log('A shard of cold light fuses to your staff.', '#7fe0ff');
      break;
    case 'charm':
      player.maxhp += 3; player.hp += 3;
      spawnFloater(player.x,player.y,'+3 HP','#f7f2df');
      log('A bone charm rattles against your ribs.', '#f7f2df');
      break;
  }
}

function tryRaise(){
  if(state!=='play') return;
  const COST = 3;
  if(player.essence < COST){ log('Not enough essence.', '#8f2622'); return; }
  const allies = entities.filter(e=>e.isAlly && !e.dead).length;
  if(allies >= player.maxMinions){ log('Your legion is full.', '#8f2622'); return; }

  // find an adjacent corpse
  let idx = -1;
  for(let i=0;i<items.length;i++){
    const it = items[i];
    if(it.kind!=='corpse') continue;
    if(chebyshev(it,player) <= 1){ idx = i; break; }
  }
  if(idx < 0){ log('No corpse within reach.', '#8f2622'); return; }

  const c = items[idx];
  items.splice(idx,1);
  player.essence -= COST;

  const hp = 12 + player.level*4;
  const ally = mkEntity({
    x:c.x, y:c.y, hp, maxhp:hp,
    atk: 4 + Math.floor(player.level*0.9), def: 1 + Math.floor(player.level/4),
    sprite:'skel', name:'Risen Servant', isAlly:true, range:1, xp:0
  });
  entities.push(ally);
  spawnParticles(c.x, c.y, 16, '#b6ff7a', 1.6);
  sfx('raise');
  log('Bones knit together. A servant rises.', '#b6ff7a');
  playerActed();
}

function drinkPotion(){
  if(state!=='play') return;
  if(player.potions<=0){ log('No potions left.', '#8f2622'); return; }
  player.potions--;
  const amt = Math.round(player.maxhp*0.45) + 6;
  player.hp = Math.min(player.maxhp, player.hp + amt);
  spawnFloater(player.x, player.y, `+${amt}`, '#5fd85a');
  spawnParticles(player.x, player.y, 10, '#5fd85a', 1);
  sfx('pickup');
  log('Warmth floods your hollow chest.', '#5fd85a');
  playerActed();
}

function useStairs(){
  if(state!=='play') return;
  if(tiles[player.y*MAPW+player.x] !== 2){ log('No stairway here.', '#8f2622'); return; }
  if(depth >= FLOORS.length){ log('There is nothing above.', '#8f2622'); return; }
  sfx('stairs');
  buildFloor(depth+1);
}

// ---------------------------------------------------------
// INPUT
// ---------------------------------------------------------
function onKey(k){
  initAudio();
  const key = k.length===1 ? k.toLowerCase() : k;

  if(state==='title'){
    if(key===' '||key==='Enter'){ state='play'; depth=0; player=null; msgLog=[]; buildFloor(1); }
    return;
  }
  if(state==='dead'){
    if(key===' '||key==='Enter'){ state='title'; }
    return;
  }
  if(state==='win'){
    if(key===' '||key==='Enter'){ state='title'; }
    return;
  }
  if(state==='boon'){
    if(key==='1'||key==='2'||key==='3'){
      const i = parseInt(key,10)-1;
      if(boonChoices[i]){
        boonChoices[i].f();
        log(`Boon: ${boonChoices[i].n}`, '#b6ff7a');
        boonChoices = null;
        state = 'play';
      }
    }
    return;
  }

  // play
  switch(key){
    case 'ArrowUp': case 'w': case '8': movePlayer(0,-1); break;
    case 'ArrowDown': case 's': case '2': movePlayer(0,1); break;
    case 'ArrowLeft': case 'a': case '4': movePlayer(-1,0); break;
    case 'ArrowRight': case 'd': case '6': movePlayer(1,0); break;
    case '7': movePlayer(-1,-1); break;
    case '9': movePlayer(1,-1); break;
    case '1': movePlayer(-1,1); break;
    case '3': movePlayer(1,1); break;
    case ' ': case '.': waitTurn(); break;
    case 'r': tryRaise(); break;
    case 'q': drinkPotion(); break;
    case 'e': useStairs(); break;
  }
}

window.addEventListener('keydown', e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  onKey(e.key);
});

function drawTile(tx,ty,px,py){
  const i = ty*MAPW+tx;
  const t = tiles[i];
  const v = Math.floor(hash2(tx,ty)*4);
  const fv = Math.floor(hash2(tx*3+7,ty*5+11)*6);

  if(t === 0){
    bx.drawImage(wallTiles[v], px, py);
  } else {
    bx.drawImage(floorTiles[fv], px, py);

    // stairs
    if(t === 2){
      bx.drawImage(SPR.stairs.img, px, py);
    }
    // floor decals
  }
}

function drawDecals(){
  const camX = Math.round(player.x*TILE + TILE/2 - BUFW/2);
  const camY = Math.round(player.y*TILE + TILE/2 - BUFH/2);
  const cX = clamp(camX, 0, Math.max(0, MAPW*TILE - BUFW));
  const cY = clamp(camY, 0, Math.max(0, MAPH*TILE - BUFH));

  for(const d of decals){
    const px = d.x*TILE - cX, py = d.y*TILE - cY;
    if(px < -16 || py < -16 || px > BUFW || py > BUFH) continue;
    if(!visible[d.y*MAPW+d.x]) continue;
    bx.globalAlpha = 0.5;
    bx.fillStyle = d.type === 'blood' ? '#5a1518' : '#1a1620';
    const h = Math.floor(hash2(d.x,d.y)*6);
    for(let i=0;i<8;i++){
      const ax = (hash2(d.x*13+i, d.y*7)*(14))|0;
      const ay = (hash2(d.x*5, d.y*17+i)*(14))|0;
      bx.fillRect(px+ax, py+ay, 2, 2);
    }
    bx.globalAlpha = 1;
  }
}

function drawSprite(spr, x, y, bob){
  const s = SPR[spr];
  bx.drawImage(s.img, Math.round(x + s.ox), Math.round(y + s.oy + bob));
}

function render(){
  const camX = Math.round(player.x*TILE + TILE/2 - BUFW/2);
  const camY = Math.round(player.y*TILE + TILE/2 - BUFH/2);
  const cX = clamp(camX, 0, Math.max(0, MAPW*TILE - BUFW));
  const cY = clamp(camY, 0, Math.max(0, MAPH*TILE - BUFH));

  bx.fillStyle = '#050409';
  bx.fillRect(0,0,BUFW,BUFH);

  const sx0 = Math.floor(cX/TILE), sy0 = Math.floor(cY/TILE);
  const sx1 = sx0 + VW + 2, sy1 = sy0 + VH + 2;

  // --- tiles ---
  for(let ty=sy0; ty<sy1; ty++){
    for(let tx=sx0; tx<sx1; tx++){
      if(tx<0||ty<0||tx>=MAPW||ty>=MAPH) continue;
      const i = ty*MAPW+tx;
      if(!seen[i]) continue;
      const px = tx*TILE - cX, py = ty*TILE - cY;
      drawTile(tx,ty,px,py);

      if(!visible[i]){
        bx.fillStyle = 'rgba(5,4,12,0.78)';
        bx.fillRect(px,py,TILE,TILE);
      }
    }
  }

  drawDecals();

  // --- items ---
  for(const it of items){
    const i = it.y*MAPW+it.x;
    if(!visible[i]) continue;
    const px = it.x*TILE - cX, py = it.y*TILE - cY;
    const bob = Math.sin(animT*3 + it.x + it.y)*1;
    drawSprite(it.spr, px, py, it.kind==='corpse' ? 0 : bob);
    // glow for essence items
    if(it.kind === 'soul' || it.kind === 'shard'){
      bx.globalAlpha = 0.25 + Math.sin(animT*4 + it.x)*0.12;
      bx.fillStyle = it.kind === 'soul' ? '#b6ff7a' : '#7fe0ff';
      bx.fillRect(px+2, py+2, 12, 12);
      bx.globalAlpha = 1;
    }
  }

  // --- entities ---
  const sorted = entities.slice().sort((a,b)=>a.y-b.y);
  for(const e of sorted){
    if(e.dead) continue;
    const i = e.y*MAPW+e.x;
    if(!visible[i]) continue;
    const px = e.x*TILE - cX, py = e.y*TILE - cY;
    const bob = Math.sin(animT*4 + e.bob)*1;

    // ground shadow
    bx.globalAlpha = 0.35;
    bx.fillStyle = '#000';
    bx.fillRect(px+3, py+13, 10, 3);
    bx.globalAlpha = 1;

    if(e.flash > 0){
      bx.globalAlpha = 1;
    }
    drawSprite(e.sprite, px, py, bob);

    if(e.flash > 0){
      bx.globalAlpha = 0.55;
      bx.fillStyle = '#ffffff';
      bx.fillRect(px+2, py+2, 12, 12);
      bx.globalAlpha = 1;
      e.flash--;
    }

    // ally aura
    if(e.isAlly){
      bx.globalAlpha = 0.16 + Math.sin(animT*5+e.id)*0.06;
      bx.fillStyle = '#b6ff7a';
      bx.fillRect(px+3, py+3, 10, 10);
      bx.globalAlpha = 1;
    }
  }

  // --- player ---
  {
    const px = player.x*TILE - cX, py = player.y*TILE - cY;
    const bob = Math.sin(animT*4)*1;
    bx.globalAlpha = 0.4;
    bx.fillStyle = '#000';
    bx.fillRect(px+3, py+13, 10, 3);
    bx.globalAlpha = 1;

    // necromantic aura
    bx.globalAlpha = 0.13 + Math.sin(animT*2.5)*0.05;
    bx.fillStyle = '#b6ff7a';
    bx.fillRect(px, py, 16, 16);
    bx.globalAlpha = 1;

    drawSprite('necro', px, py, bob);
  }

  // --- particles ---
  for(const p of particles){
    const px = p.x - cX, py = p.y - cY;
    if(px<-8||py<-8||px>BUFW+8||py>BUFH+8) continue;
    bx.globalAlpha = clamp(p.life,0,1);
    bx.fillStyle = p.color;
    bx.fillRect(Math.round(px), Math.round(py), p.size, p.size);
  }
  bx.globalAlpha = 1;

  // --- lighting overlay ---
  const lightGrad = bx.createRadialGradient(
    player.x*TILE - cX + 8, player.y*TILE - cY + 8, 8,
    player.x*TILE - cX + 8, player.y*TILE - cY + 8, 180
  );
  lightGrad.addColorStop(0, 'rgba(0,0,0,0)');
  lightGrad.addColorStop(0.55, 'rgba(4,3,10,0.22)');
  lightGrad.addColorStop(1, 'rgba(3,2,8,0.62)');
  bx.fillStyle = lightGrad;
  bx.fillRect(0,0,BUFW,BUFH);

  // torch flicker
  const fl = 0.035 + Math.sin(animT*11)*0.012 + Math.sin(animT*23)*0.008;
  bx.fillStyle = `rgba(255,200,90,${Math.max(0,fl)})`;
  bx.fillRect(0,0,BUFW,BUFH);

  // vignette
  const vg = bx.createRadialGradient(BUFW/2,BUFH/2,120, BUFW/2,BUFH/2, 420);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.72)');
  bx.fillStyle = vg;
  bx.fillRect(0,0,BUFW,BUFH);
}

// ---------------------------------------------------------
// HUD (drawn at full resolution)
// ---------------------------------------------------------
function roundRect(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);
  g.arcTo(x,y,x+w,y,r);
  g.closePath();
}

function bar(g, x, y, w, h, pct, col1, col2, label){
  g.fillStyle = 'rgba(10,8,16,0.85)';
  roundRect(g,x,y,w,h,3); g.fill();
  g.strokeStyle = 'rgba(120,100,160,0.35)';
  g.lineWidth = 1;
  roundRect(g,x+0.5,y+0.5,w-1,h-1,3); g.stroke();

  const fw = Math.max(0, (w-4) * clamp(pct,0,1));
  if(fw > 0){
    const grad = g.createLinearGradient(x, y, x, y+h);
    grad.addColorStop(0, col1);
    grad.addColorStop(1, col2);
    g.fillStyle = grad;
    roundRect(g,x+2,y+2,fw,h-4,2); g.fill();
  }
  if(label){
    g.fillStyle = '#e8e0f0';
    g.font = 'bold 11px ui-monospace, Menlo, Consolas, monospace';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(label, x+w/2, y+h/2+0.5);
    g.textAlign = 'left';
    g.textBaseline = 'alphabetic';
  }
}

function drawHUD(){
  const W = canvas.width, H = canvas.height;
  const pad = 14;

  ctx.save();

  // ---------- top-left panel ----------
  const panW = 250, panH = 108;
  ctx.fillStyle = 'rgba(8,6,14,0.78)';
  roundRect(ctx, pad, pad, panW, panH, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(140,110,200,0.45)';
  ctx.lineWidth = 1.5;
  roundRect(ctx, pad+0.5, pad+0.5, panW-1, panH-1, 6); ctx.stroke();

  ctx.font = 'bold 13px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = '#b99ada';
  ctx.fillText('THE REBORN', pad+12, pad+22);
  ctx.font = '11px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = '#8a7fa8';
  ctx.fillText(`Lv ${player.level}`, pad+panW-52, pad+22);
  ctx.fillStyle = '#6f6852';
  ctx.fillText(`FLOOR ${depth}`, pad+panW-104, pad+22);

  bar(ctx, pad+12, pad+32, panW-24, 14, player.hp/player.maxhp, '#8f2622', '#d4443a',
      `HP  ${Math.max(0,player.hp)} / ${player.maxhp}`);
  bar(ctx, pad+12, pad+52, panW-24, 12, player.essence/player.maxEssence, '#2b7a35', '#5fd85a',
      `ESSENCE  ${player.essence} / ${player.maxEssence}`);
  bar(ctx, pad+12, pad+70, panW-24, 10, player.xp/player.next, '#4a3468', '#8a68b4',
      `XP  ${player.xp} / ${player.next}`);

  const allies = entities.filter(e=>e.isAlly && !e.dead).length;
  ctx.font = '11px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = '#b6ff7a';
  ctx.fillText(`☠ Servants ${allies}/${player.maxMinions}`, pad+12, pad+98);
  ctx.fillStyle = '#d4443a';
  ctx.fillText(`⚗ Potions ${player.potions}`, pad+panW-100, pad+98);

  // ---------- top-right: floor name ----------
  const fl = FLOORS[Math.min(depth-1, FLOORS.length-1)];
  ctx.font = 'bold 15px ui-monospace, Menlo, Consolas, monospace';
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(185,154,218,0.85)';
  ctx.fillText(fl.name, W-pad, pad+22);
  ctx.font = '11px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = 'rgba(138,127,168,0.7)';
  ctx.fillText(`ATK ${player.atk}   DEF ${player.def}`, W-pad, pad+40);
  ctx.textAlign = 'left';

  // ---------- message log ----------
  const logH = 18 + msgLog.length*16;
  const logY = H - pad - logH;
  ctx.fillStyle = 'rgba(8,6,14,0.72)';
  roundRect(ctx, pad, logY, 420, logH, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(140,110,200,0.25)';
  roundRect(ctx, pad+0.5, logY+0.5, 419, logH-1, 6); ctx.stroke();

  ctx.font = '12px ui-monospace, Menlo, Consolas, monospace';
  for(let i=0;i<msgLog.length;i++){
    const m = msgLog[i];
    const a = 0.35 + 0.65 * ((i+1)/msgLog.length);
    ctx.globalAlpha = a;
    ctx.fillStyle = m.c;
    ctx.fillText(m.t, pad+12, logY + 20 + i*16);
  }
  ctx.globalAlpha = 1;

  // ---------- controls ----------
  ctx.textAlign = 'right';
  ctx.font = '11px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = 'rgba(138,127,168,0.55)';
  const ctrls = [
    'WASD / ARROWS  move & attack',
    'R  raise the dead     Q  drink potion',
    'E  ascend stairs      SPACE  wait'
  ];
  for(let i=0;i<ctrls.length;i++){
    ctx.fillText(ctrls[i], W-pad, H-pad-8 - (ctrls.length-1-i)*15);
  }
  ctx.textAlign = 'left';

  // ---------- boon overlay ----------
  if(state === 'boon'){
    ctx.fillStyle = 'rgba(4,3,9,0.82)';
    ctx.fillRect(0,0,W,H);

    const cw = 320, ch = 150, gap = 28;
    const totalW = cw*3 + gap*2;
    const startX = (W-totalW)/2;
    const y = H/2 - ch/2 + 20;

    ctx.textAlign = 'center';
    ctx.font = 'bold 26px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillStyle = '#b6ff7a';
    ctx.fillText('CHOOSE A BOON', W/2, y - 46);
    ctx.font = '13px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillStyle = '#8a7fa8';
    ctx.fillText('press 1, 2, or 3', W/2, y - 24);

    for(let i=0;i<3;i++){
      const b = boonChoices[i];
      if(!b) continue;
      const x = startX + i*(cw+gap);
      ctx.fillStyle = 'rgba(20,14,34,0.95)';
      roundRect(ctx, x, y, cw, ch, 8); ctx.fill();
      ctx.strokeStyle = '#8a68b4';
      ctx.lineWidth = 2;
      roundRect(ctx, x+1, y+1, cw-2, ch-2, 8); ctx.stroke();

      ctx.font = 'bold 30px ui-monospace, Menlo, Consolas, monospace';
      ctx.fillStyle = '#5fd85a';
      ctx.fillText(`${i+1}`, x+cw/2, y+42);

      ctx.font = 'bold 15px ui-monospace, Menlo, Consolas, monospace';
      ctx.fillStyle = '#f7f2df';
      ctx.fillText(b.n, x+cw/2, y+78);

      ctx.font = '12px ui-monospace, Menlo, Consolas, monospace';
      ctx.fillStyle = '#a89f80';
      ctx.fillText(b.d, x+cw/2, y+102);
    }
    ctx.textAlign = 'left';
  }

  // ---------- title ----------
  if(state === 'title'){
    ctx.fillStyle = 'rgba(4,3,9,0.88)';
    ctx.fillRect(0,0,W,H);

    ctx.textAlign = 'center';

    const t = animT;
    const bob = Math.sin(t*2)*6;

    // big necromancer
    ctx.imageSmoothingEnabled = false;
    const ps = 8;
    ctx.drawImage(SPR.necro.img, W/2 - 8*ps, H/2 - 140 + bob, 16*ps, 16*ps);

    ctx.font = 'bold 54px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillStyle = '#b6ff7a';
    ctx.shadowColor = '#5fd85a';
    ctx.shadowBlur = 24;
    ctx.fillText('BONE ASCENSION', W/2, H/2 + 20);
    ctx.shadowBlur = 0;

    ctx.font = '15px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillStyle = '#8a68b4';
    ctx.fillText('They burned you for a witch. They were right.', W/2, H/2 + 52);

    ctx.font = '13px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillStyle = '#6f6852';
    ctx.fillText('Ten floors. One cathedral. One bishop.', W/2, H/2 + 78);

    const pulse = 0.5 + Math.sin(t*4)*0.5;
    ctx.globalAlpha = 0.4 + pulse*0.6;
    ctx.font = 'bold 17px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillStyle = '#f7f2df';
    ctx.fillText('PRESS  SPACE  TO RISE', W/2, H/2 + 128);
    ctx.globalAlpha = 1;

    ctx.font = '11px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillStyle = '#4a4360';
    ctx.fillText('WASD/Arrows move · R raise dead · Q potion · E stairs', W/2, H - 30);

    ctx.textAlign = 'left';
  }

  // ---------- death ----------
  if(state === 'dead'){
    ctx.fillStyle = `rgba(8,2,4,${clamp(deathTimer/60,0,0.88)})`;
    ctx.fillRect(0,0,W,H);
    if(deathTimer > 30){
      ctx.textAlign = 'center';
      ctx.font = 'bold 46px ui-monospace, Menlo, Consolas, monospace';
      ctx.fillStyle = '#d4443a';
      ctx.fillText('YOUR BONES REST', W/2, H/2 - 10);
      ctx.font = '15px ui-monospace, Menlo, Consolas, monospace';
      ctx.fillStyle = '#8a7fa8';
      ctx.fillText(`You reached ${FLOORS[Math.min(depth-1,FLOORS.length-1)].name}`, W/2, H/2 + 26);
      ctx.fillText(`Level ${player.level}`, W/2, H/2 + 50);
      ctx.fillStyle = '#6f6852';
      ctx.fillText('press SPACE', W/2, H/2 + 96);
      ctx.textAlign = 'left';
    }
  }

  // ---------- victory ----------
  if(state === 'win'){
    ctx.fillStyle = `rgba(4,3,9,${clamp(winTimer/90,0,0.9)})`;
    ctx.fillRect(0,0,W,H);
    if(winTimer > 40){
      ctx.textAlign = 'center';
      ctx.font = 'bold 44px ui-monospace, Menlo, Consolas, monospace';
      ctx.fillStyle = '#ffe6a0';
      ctx.fillText('THE CATHEDRAL IS SILENT', W/2, H/2 - 60);
      ctx.font = '15px ui-monospace, Menlo, Consolas, monospace';
      ctx.fillStyle = '#b99ada';
      ctx.fillText('Bishop Aldous lies broken on the marble.', W/2, H/2 - 16);
      ctx.fillText('The village that burned you will wake', W/2, H/2 + 10);
      ctx.fillText('to a sky with no prayers in it.', W/2, H/2 + 34);
      ctx.fillStyle = '#5fd85a';
      ctx.font = 'bold 16px ui-monospace, Menlo, Consolas, monospace';
      ctx.fillText('You did not die. You ascended.', W/2, H/2 + 80);
      ctx.fillStyle = '#6f6852';
      ctx.font = '12px ui-monospace, Menlo, Consolas, monospace';
      ctx.fillText('press SPACE', W/2, H/2 + 128);
      ctx.textAlign = 'left';
    }
  }

  ctx.restore();
}

// ---------------------------------------------------------
// MAIN LOOP
// ---------------------------------------------------------
let last = performance.now();

function loop(now){
  const dt = Math.min(0.05, (now-last)/1000);
  last = now;
  animT += dt;

  if(state === 'dead') deathTimer++;
  if(state === 'win') winTimer++;

  // update particles
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.06;
    p.vx *= 0.96; p.vy *= 0.96;
    p.life -= dt*1.6;
    if(p.life <= 0) particles.splice(i,1);
  }
  for(let i=floaters.length-1;i>=0;i--){
    const f = floaters[i];
    f.y -= 18*dt;
    f.life -= dt*1.1;
    if(f.life <= 0) floaters.splice(i,1);
  }
  if(shake > 0) shake = Math.max(0, shake - dt*30);

  // decay decals slowly
  for(const d of decals){ if(d.a > 0.3) d.a -= dt*0.01; }

  // ---- render world ----
  if(state === 'play' || state === 'boon' || state === 'dead' || state === 'win'){
    if(player){
      render();

      // floaters into buffer
      const camX = clamp(Math.round(player.x*TILE + TILE/2 - BUFW/2), 0, Math.max(0, MAPW*TILE-BUFW));
      const camY = clamp(Math.round(player.y*TILE + TILE/2 - BUFH/2), 0, Math.max(0, MAPH*TILE-BUFH));
      bx.font = 'bold 8px ui-monospace, monospace';
      bx.textAlign = 'center';
      for(const f of floaters){
        bx.globalAlpha = clamp(f.life,0,1);
        bx.fillStyle = '#000';
        bx.fillText(f.text, f.x - camX + 1, f.y - camY + 1);
        bx.fillStyle = f.color;
        bx.fillText(f.text, f.x - camX, f.y - camY);
      }
      bx.globalAlpha = 1;
      bx.textAlign = 'left';
    }
  }

  // ---- blit ----
  ctx.fillStyle = '#07060b';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  const shx = shake > 0 ? (Math.random()-0.5)*shake : 0;
  const shy = shake > 0 ? (Math.random()-0.5)*shake : 0;

  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(buf, 0, 0, BUFW, BUFH,
                Math.round(offX + shx*scale), Math.round(offY + shy*scale),
                Math.round(BUFW*scale), Math.round(BUFH*scale));

  // ---- HUD ----
  if(state === 'play' || state === 'boon') drawHUD();
  else if(state === 'dead' || state === 'win') drawHUD();
  else if(state === 'title') drawHUD();

  requestAnimationFrame(loop);
}

// ---------------------------------------------------------
// BOOT
// ---------------------------------------------------------
log('You claw out of the ash.', '#b6ff7a');
requestAnimationFrame(loop);

</script>
