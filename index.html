// ---------------------------------------------------------
// BAKE with automatic 1px black outline
// ---------------------------------------------------------
function bakeSprite(rows){
  const w = Math.max(...rows.map(r=>r.length));
  const h = rows.length;
  const c = document.createElement('canvas');
  c.width = w + 2; c.height = h + 2;
  const g = c.getContext('2d');

  // silhouette outline
  g.fillStyle = '#050308';
  for(let dy=-1; dy<=1; dy++){
    for(let dx=-1; dx<=1; dx++){
      if(dx===0 && dy===0) continue;
      for(let y=0;y<h;y++){
        const row = rows[y];
        for(let x=0;x<row.length;x++){
          if(!PAL[row[x]]) continue;
          g.fillRect(x+1+dx, y+1+dy, 1, 1);
        }
      }
    }
  }
  // fill
  for(let y=0;y<h;y++){
    const row = rows[y];
    for(let x=0;x<row.length;x++){
      const col = PAL[row[x]];
      if(!col) continue;
      g.fillStyle = col;
      g.fillRect(x+1, y+1, 1, 1);
    }
  }
  return { img: c, ox: Math.floor((16-w)/2)-1, oy: (16-h)-1 };
}

function mirrorCanvas(src){
  const c = document.createElement('canvas');
  c.width = src.width; c.height = src.height;
  const g = c.getContext('2d');
  g.translate(src.width, 0);
  g.scale(-1, 1);
  g.drawImage(src, 0, 0);
  return c;
}

const floorTiles = [];
const wallTiles = [];

function makeFloor(v){
  const c = document.createElement('canvas'); c.width=c.height=16;
  const g = c.getContext('2d');
  const bases = ['#8a6f52','#93785a','#8d7256','#866b4e','#977c5e','#8f7458'];
  g.fillStyle = bases[v%6]; g.fillRect(0,0,16,16);
  g.fillStyle = '#4a3524';
  g.fillRect(0,0,16,1); g.fillRect(0,8,16,1);
  g.fillRect(0,0,1,16); g.fillRect(8,0,1,16);
  g.fillStyle = 'rgba(255,220,170,0.22)';
  g.fillRect(1,1,7,1); g.fillRect(9,1,7,1);
  g.fillRect(1,9,7,1); g.fillRect(9,9,7,1);
  g.fillStyle = 'rgba(40,20,10,0.35)';
  g.fillRect(1,7,7,1); g.fillRect(9,7,7,1);
  g.fillRect(7,1,1,7); g.fillRect(15,1,1,7);
  let s = v*7919 + 13;
  const rndp = ()=>{ s = (s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; };
  for(let i=0;i<36;i++){
    const x = Math.floor(rndp()*16), y = Math.floor(rndp()*16);
    const d = rndp();
    if(d<0.35) g.fillStyle='rgba(40,20,10,0.40)';
    else if(d<0.70) g.fillStyle='rgba(255,230,180,0.30)';
    else if(d<0.90) g.fillStyle='rgba(90,130,70,0.30)';
    else g.fillStyle='rgba(30,10,5,0.35)';
    g.fillRect(x,y,1,1);
  }
  if(v>=3){
    g.strokeStyle='rgba(35,18,8,0.75)'; g.lineWidth=1;
    g.beginPath();
    let cx = 2+Math.floor(rndp()*11), cy = 2+Math.floor(rndp()*11);
    g.moveTo(cx,cy);
    for(let i=0;i<5;i++){ cx += Math.floor(rndp()*5)-2; cy += Math.floor(rndp()*5)-2; g.lineTo(cx,cy); }
    g.stroke();
  }
  return c;
}

function makeWall(v){
  const c = document.createElement('canvas'); c.width=c.height=16;
  const g = c.getContext('2d');
  g.fillStyle = '#1a1018'; g.fillRect(0,0,16,16);
  g.fillStyle = '#a89078'; g.fillRect(0,0,16,3);
  g.fillStyle = '#d8bfa0'; g.fillRect(0,0,16,1);
  g.fillStyle = '#6a5844'; g.fillRect(0,3,16,1);
  const pal = (v%2===0) ? ['#5a4030','#6a4a38'] : ['#4a3428','#5a4030'];
  for(let r=0;r<2;r++){
    const y = 4 + r*6;
    const offset = (r%2)*4;
    g.fillStyle = '#1a1018';
    g.fillRect(0, y, 16, 1);
    for(let b=-1;b<3;b++){
      const bxp = b*8 + offset;
      g.fillRect(bxp, y, 1, 6);
      g.fillStyle = (b+r)%2===0 ? pal[0] : pal[1];
      g.fillRect(bxp+1, y+1, 7, 5);
      g.fillStyle = 'rgba(255,220,180,0.28)';
      g.fillRect(bxp+1, y+1, 7, 1);
      g.fillStyle = 'rgba(0,0,0,0.45)';
      g.fillRect(bxp+1, y+5, 7, 1);
    }
  }
  let s = v*4441 + 71;
  const rndp = ()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; };
  for(let i=0;i<20;i++){
    const x=Math.floor(rndp()*16), y=4+Math.floor(rndp()*12);
    g.fillStyle = rndp()<0.6 ? 'rgba(0,0,0,0.35)' : 'rgba(120,180,100,0.20)';
    g.fillRect(x,y,1,1);
  }
  return c;
}

for(let i=0;i<6;i++) floorTiles.push(makeFloor(i));
for(let i=0;i<4;i++) wallTiles.push(makeWall(i));

const TILE = 16;

const BUFW = VW*TILE, BUFH = VH*TILE;
const MAPW = 56, MAPH = 36;

const buf = document.createElement('canvas');

const bx = buf.getContext('2d');
bx.imageSmoothingEnabled = false;

let scale = 2, offX = 0, offY = 0;

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  canvas.width = w; canvas.height = h;
  ctx.imageSmoothingEnabled = false;
  let s = Math.min(w/BUFW, h/BUFH);
  s = Math.max(1, Math.floor(s*2)/2);
  scale = s;
  offX = Math.floor((w - BUFW*s)/2);
  offY = Math.floor((h - BUFH*s)/2);
}
window.addEventListener('resize', resize);
resize();

// ---------------------------------------------------------
// AUDIO
// ---------------------------------------------------------
let actx = null;
function initAudio(){
  if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state === 'suspended') actx.resume();
}
function sfx(type){
  if(!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.connect(g); g.connect(actx.destination);
  let freq=220, dur=0.08, wave='square', vol=0.05;
  switch(type){
    case 'hit':    freq=180; dur=0.07; wave='square'; vol=0.055; break;
    case 'hurt':   freq=90;  dur=0.16; wave='sawtooth'; vol=0.07; break;
    case 'kill':   freq=60;  dur=0.22; wave='sawtooth'; vol=0.06; break;
    case 'pickup': freq=660; dur=0.07; wave='triangle'; vol=0.05; break;
    case 'raise':  freq=330; dur=0.30; wave='sine'; vol=0.07; break;
    case 'level':  freq=520; dur=0.35; wave='triangle'; vol=0.06; break;
    case 'stairs': freq=440; dur=0.25; wave='sine'; vol=0.05; break;
    case 'boss':   freq=110; dur=0.6;  wave='sawtooth'; vol=0.08; break;
    case 'step':   freq=140; dur=0.025; wave='triangle'; vol=0.018; break;
    case 'swoosh': freq=260; dur=0.08; wave='sine'; vol=0.045; break;
  }
  o.type = wave;
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*0.4), t+dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.start(t); o.stop(t+dur+0.02);
}

  rooms = [];

  const target = 9 + Math.min(7, d);
  for(let i=0;i<500 && rooms.length<target;i++){
    const w = rnd(5,11), h = rnd(4,8);
    const x = rnd(1, MAPW-w-1), y = rnd(1, MAPH-h-1);
    let ok = true;
    for(const o of rooms){
      if(x < o.x+o.w+2 && x+w+2 > o.x && y < o.y+o.h+2 && y+h+2 > o.y){ ok=false; break; }
    }
    if(ok) rooms.push({x,y,w,h});
  }

  const carve=(x,y)=>{ if(x>0&&y>0&&x<MAPW-1&&y<MAPH-1) tiles[y*MAPW+x]=1; };
  for(const r of rooms)
    for(let y=r.y;y<r.y+r.h;y++)
      for(let x=r.x;x<r.x+r.w;x++) carve(x,y);

  const ctr = r => ({ x: Math.floor(r.x+r.w/2), y: Math.floor(r.y+r.h/2) });

  for(let i=1;i<rooms.length;i++){
    const a = ctr(rooms[i-1]), b = ctr(rooms[i]);
    if(Math.random()<0.5){
      for(let x=Math.min(a.x,b.x);x<=Math.max(a.x,b.x);x++){ carve(x,a.y); carve(x,a.y+1); }
      for(let y=Math.min(a.y,b.y);y<=Math.max(a.y,b.y);y++){ carve(b.x,y); carve(b.x+1,y); }
    } else {
      for(let y=Math.min(a.y,b.y);y<=Math.max(a.y,b.y);y++){ carve(a.x,y); carve(a.x+1,y); }
      for(let x=Math.min(a.x,b.x);x<=Math.max(a.x,b.x);x++){ carve(x,b.y); carve(x,b.y+1); }
    }
  }
  for(let k=0;k<2 && rooms.length>3;k++){
    const a = ctr(choice(rooms)), b = ctr(choice(rooms));
    for(let x=Math.min(a.x,b.x);x<=Math.max(a.x,b.x);x++) carve(x,a.y);
    for(let y=Math.min(a.y,b.y);y<=Math.max(a.y,b.y);y++) carve(b.x,y);
  }

  const start = ctr(rooms[0]);
  let best = rooms[1]||rooms[0], bestD = -1;
  for(const r of rooms){
    const c = ctr(r);
    const dd = (c.x-start.x)**2 + (c.y-start.y)**2;
    if(dd>bestD){ bestD=dd; best=r; }
  }
  const sc = ctr(best);
  tiles[sc.y*MAPW+sc.x] = 2;

  return { start, stairRoom: best };
}

let uid = 1;
function mkEntity(o){
  const e = Object.assign({
    id: uid++, x:0, y:0, hp:10, maxhp:10, atk:3, def:0,
    sprite:'skel', name:'?', ai:'hostile', range:1, xp:0,
    cd:0, dead:false, flash:0, bob: Math.random()*6.28,
    isPlayer:false, isAlly:false, boss:false, heal:false,
    // ANIMATION
    rx: 0, ry: 0,             // interpolated pixel position
    face: 1,                  // 1 = right, -1 = left
    walkPhase: 0,
    squash: 0,                // landing squash amount 0..1
    lungeDx: 0, lungeDy: 0,   // attack lunge offset (px)
    recoilDx: 0, recoilDy: 0, // hit recoil offset (px)
    animState: 'idle',        // 'idle' | 'attack'
    animT: 0,
    dying: undefined,         // if set, dying progress 0..1.5
    _wasMoving: false
  }, o);
  e.rx = e.x * TILE;
  e.ry = e.y * TILE;
  return e;
}

function snapEntity(e){ e.rx = e.x * TILE; e.ry = e.y * TILE; e._wasMoving = false; }

function entityAt(x,y){
  return entities.find(e=>!e.dead && e.x===x && e.y===y);
}
function isWall(x,y){
  if(x<0||y<0||x>=MAPW||y>=MAPH) return true;
  return tiles[y*MAPW+x]===0;
}
function walkable(x,y){
  if(isWall(x,y)) return false;
  if(entityAt(x,y)) return false;
  return true;
}

// ---------------------------------------------------------
// FOV
// ---------------------------------------------------------
function los(x0,y0,x1,y1){
  let dx=Math.abs(x1-x0), dy=Math.abs(y1-y0);
  let sx = x0<x1?1:-1, sy = y0<y1?1:-1;
  let err = dx-dy, x=x0, y=y0;
  let guard = 0;
  while(guard++ < 200){
    if(x===x1 && y===y1) return true;
    if(!(x===x0 && y===y0) && tiles[y*MAPW+x]===0) return false;
    const e2 = 2*err;
    if(e2 > -dy){ err -= dy; x += sx; }
    if(e2 <  dx){ err += dx; y += sy; }
  }
  return false;
}

function computeFOV(){
  visible.fill(0);
  const R = 10;
  for(let y=-R;y<=R;y++){
    for(let x=-R;x<=R;x++){
      if(x*x+y*y > R*R+1) continue;
      const cx = player.x+x, cy = player.y+y;
      if(cx<0||cy<0||cx>=MAPW||cy>=MAPH) continue;
      if(los(player.x, player.y, cx, cy)){
        visible[cy*MAPW+cx] = 1;
        seen[cy*MAPW+cx] = 1;
      }
    }
  }
  visible[player.y*MAPW+player.x] = 1;
  seen[player.y*MAPW+player.x] = 1;
}

function spawnParticles(x,y,n,color,spd){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2;
    const s = (0.3+Math.random()*0.7)*(spd||1);
    particles.push({
      x: x*TILE+8, y: y*TILE+8,
      vx: Math.cos(a)*s, vy: Math.sin(a)*s - 0.4,
      life: 1, color, size: Math.random()<0.5?2:1
    });
  }
}
function spawnFloater(x,y,text,color){
  floaters.push({ x:x*TILE+8, y:y*TILE+4, text, color, life:1 });
}
function addDecal(x,y,type){
  decals.push({ x, y, type, a: 0.9 });
  if(decals.length>160) decals.shift();
}

function newPlayer(){
  const p = mkEntity({
    x:0, y:0, hp:34, maxhp:34, atk:6, def:1,
    sprite:'necro', name:'The Reborn', isPlayer:true,
    level:1, xp:0, next:14, essence:12, maxEssence:12,
    potions:1, maxMinions:2, essenceTick:0
  });
  return p;
}

function xpForLevel(l){ return Math.floor(14 * Math.pow(l, 1.45)); }

function gainXP(n){
  player.xp += n;
  while(player.xp >= player.next){
    player.xp -= player.next;
    player.level++;
    player.next = xpForLevel(player.level);
    player.maxhp += 6; player.hp += 6;
    player.atk += 1;
    if(player.level%3===0) player.def += 1;
    player.maxEssence += 2; player.essence = player.maxEssence;
    if(player.level%4===0) player.maxMinions++;
    pendingBoons++;
    sfx('level');
    log(`You ascend to level ${player.level}.`, '#a0ff50');
  }
}

const BOONS = [
  { n:'Ossuary Plate',   d:'+9 Max HP, fully healed',   f:()=>{ player.maxhp+=9; player.hp=player.maxhp; } },
  { n:'Grave Strength',  d:'+3 Attack',                 f:()=>{ player.atk+=3; } },
  { n:'Bone Ward',       d:'+2 Defense',                f:()=>{ player.def+=2; } },
  { n:'Soul Siphon',     d:'+6 Max Essence, refill',    f:()=>{ player.maxEssence+=6; player.essence=player.maxEssence; } },
  { n:'Legion',          d:'+1 Max raised skeleton',    f:()=>{ player.maxMinions++; } },
  { n:'Deathly Vigor',   d:'Heal 50% and +4 Max HP',    f:()=>{ player.maxhp+=4; player.hp=Math.min(player.maxhp, player.hp+Math.floor(player.maxhp*0.5)); } },
  { n:'Hollow Bones',    d:'+1 Attack, +1 Defense',     f:()=>{ player.atk+=1; player.def+=1; } }
];

function offerBoons(){
  const pool = BOONS.slice();
  boonChoices = [];
  for(let i=0;i<3 && pool.length;i++){
    boonChoices.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  }
  if(boonChoices.length === 0){ state = 'play'; return; }
  state = 'boon';
}

// ---------------------------------------------------------
// FLOOR BUILD
// ---------------------------------------------------------
function buildFloor(d){
  depth = d;
  const info = genMap(d);
  entities = [];
  items = [];
  particles = [];
  decals = [];
  floaters = [];
  boonChoices = null;

  if(!player) player = newPlayer();
  player.x = info.start.x;
  player.y = info.start.y;
  player.rx = player.x * TILE;
  player.ry = player.y * TILE;
  player.lungeDx = player.lungeDy = player.recoilDx = player.recoilDy = 0;
  player.animState = 'idle';
  player.animT = 0;
  tiles[player.y*MAPW+player.x] = 1;

  const def = FLOORS[Math.min(d-1, FLOORS.length-1)];
  const scaleHP  = 1 + (d-1)*0.16;
  const scaleATK = 1 + (d-1)*0.11;

  const freeTiles = [];
  for(const r of rooms){
    if(r === rooms[0] && d>1) continue;
    for(let y=r.y;y<r.y+r.h;y++)
      for(let x=r.x;x<r.x+r.w;x++)
        if(!isWall(x,y) && !(x===player.x&&y===player.y)) freeTiles.push({x,y});
  }
  for(let i=freeTiles.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [freeTiles[i],freeTiles[j]] = [freeTiles[j],freeTiles[i]];
  }

  let fi = 0;
  for(let i=0;i<def.n && fi<freeTiles.length;i++){
    const t = freeTiles[fi++];
    if(entityAt(t.x,t.y)) continue;
    const key = choice(def.pool);
    const tpl = MOBS[key];
    const e = mkEntity({
      x:t.x, y:t.y,
      hp: Math.round(tpl.hp*scaleHP),
      maxhp: Math.round(tpl.hp*scaleHP),
      atk: Math.round(tpl.atk*scaleATK),
      def: tpl.def,
      sprite: tpl.sprite, name: tpl.name,
      range: tpl.range, xp: tpl.xp, heal: !!tpl.heal
    });
    e.face = Math.random()<0.5 ? -1 : 1;
    entities.push(e);
  }

  if(def.boss){
    const sr = info.stairRoom;
    const bc = { x: Math.floor(sr.x+sr.w/2), y: Math.floor(sr.y+sr.h/2) };
    entities = entities.filter(e => !(e.x === bc.x && e.y === bc.y));
    const boss = mkEntity({
      x:bc.x, y:bc.y,
      hp: BISHOP.hp, maxhp: BISHOP.hp, atk: BISHOP.atk, def: BISHOP.def,
      sprite: BISHOP.sprite, name: BISHOP.name, range: BISHOP.range,
      xp: BISHOP.xp, boss: true
    });
    entities.push(boss);
    const guards = [];
    for(let dy=-3; dy<=3; dy++)
      for(let dx=-3; dx<=3; dx++){
        if(dx===0 && dy===0) continue;
        const nx = bc.x+dx, ny = bc.y+dy;
        if(walkable(nx,ny)) guards.push({x:nx,y:ny});
      }
    for(let i=0;i<4 && guards.length;i++){
      const s = guards.splice(Math.floor(Math.random()*guards.length),1)[0];
      entities.push(mkEntity({
        x:s.x, y:s.y, hp:40, maxhp:40, atk:12, def:5,
        sprite:'knight', name:'Temple Knight', range:1, xp:26
      }));
    }
    sfx('boss');
  }

  const corpses = 3 + rnd(0,3);
  for(let i=0;i<corpses && fi<freeTiles.length;i++){
    const t = freeTiles[fi++];
    if(entityAt(t.x,t.y)) continue;
    if(items.some(it=>it.x===t.x&&it.y===t.y)) continue;
    items.push({ x:t.x, y:t.y, kind:'corpse', spr:'corpse' });
  }

  const lootCount = 3 + rnd(0,3);
  const kinds = ['potion','soul','scroll','shard','charm'];
  for(let i=0;i<lootCount && fi<freeTiles.length;i++){
    const t = freeTiles[fi++];
    if(entityAt(t.x,t.y)) continue;
    if(items.some(it=>it.x===t.x&&it.y===t.y)) continue;
    let k = choice(kinds);
    if(k==='potion' && Math.random()<0.45) k='soul';
    items.push({ x:t.x, y:t.y, kind:k, spr:k });
  }

  computeFOV();
  log(`— ${def.name} —`, '#d090ff');
  if(def.boss) log('A cold hymn drifts down the nave...', '#ffa080');
}

// ---------------------------------------------------------
// TURN LOGIC
// ---------------------------------------------------------
function playerActed(){
  turn++;
  player.essenceTick++;
  if(player.essenceTick >= 3){
    player.essenceTick = 0;
    if(player.essence < player.maxEssence) player.essence++;
  }
  for(const e of entities.slice()){
    if(e.dead || e.isPlayer) continue;
    if(e.isAlly) allyTurn(e); else enemyTurn(e);
  }
  // keep dying entities briefly for their death anim
  entities = entities.filter(e => !e.dead || e.dying !== undefined);
  computeFOV();

  if(player.hp <= 0 && state !== 'dead' && state !== 'win'){
    state = 'dead';
    deathTimer = 0;
    sfx('kill');
    log('Your bones crumble to dust...', '#ff4030');
    return;
  }

  if(pendingBoons > 0 && state === 'play'){
    pendingBoons--;
    offerBoons();
  }
}

function chebyshev(a,b){ return Math.max(Math.abs(a.x-b.x), Math.abs(a.y-b.y)); }

function tryAttack(attacker, target){
  const dmgBase = attacker.atk - target.def;
  const dmg = Math.max(1, Math.round(dmgBase * (0.75 + Math.random()*0.5)));
  target.hp -= dmg;
  target.flash = 0.18;

  // ATTACK LUNGE — attacker throws itself toward target
  const dx = target.x - attacker.x;
  const dy = target.y - attacker.y;
  const len = Math.hypot(dx, dy) || 1;
  attacker.lungeDx = (dx/len) * 6;
  attacker.lungeDy = (dy/len) * 6;
  attacker.animState = 'attack';
  attacker.animT = 0;

  // HIT RECOIL — target pushed away from attacker
  target.recoilDx = (dx/len) * 5;
  target.recoilDy = (dy/len) * 5;

  // FACE TARGET
  if(dx < 0) { attacker.face = -1; } else if(dx > 0) { attacker.face = 1; }

  shake = Math.min(6, shake + 2.5);
  sfx('swoosh');
  spawnParticles(target.x, target.y, 9, '#ff4030', 1.5);

  if(target.isPlayer){
    sfx('hurt');
    spawnFloater(target.x, target.y, `-${dmg}`, '#ffa080');
  } else {
    spawnFloater(target.x, target.y, `${dmg}`, '#ffffff');
  }

  if(target.hp <= 0) killEntity(target, attacker);
}

function killEntity(target, killer){
  if(target.isPlayer) return;
  target.dead = true;
  target.dying = 0;
  sfx('kill');
  addDecal(target.x, target.y, 'blood');
  spawnParticles(target.x, target.y, 16, target.boss ? '#ffd040' : '#c02020', 1.9);

  if(target.isAlly){
    log(`${target.name} collapses.`, '#e0d0a8');
    return;
  }

  if(!items.some(i=>i.x===target.x && i.y===target.y && i.kind==='corpse')){
    items.push({ x:target.x, y:target.y, kind:'corpse', spr:'corpse' });
  }
  spawnParticles(target.x, target.y, 8, '#a0ff50', 1.3);

  const gain = Math.round(target.xp * 0.6);
  gainXP(target.xp);
  player.essence = Math.min(player.maxEssence, player.essence + gain);
  log(`${target.name} is destroyed.`, '#a0ff50');

  if(target.boss){
    state = 'win';
    winTimer = 0;
    log('The Bishop falls. The cathedral goes silent.', '#ffd040');
  }
}

function canSee(a,b){ return visible[b.y*MAPW+b.x] === 1; }

function stepToward(e, tx, ty){
  const dx = Math.sign(tx - e.x), dy = Math.sign(ty - e.y);
  const opts = [];
  if(dx && dy) opts.push({x:e.x+dx, y:e.y+dy});
  if(Math.abs(tx-e.x) > Math.abs(ty-e.y)){
    if(dx) opts.push({x:e.x+dx, y:e.y});
    if(dy) opts.push({x:e.x, y:e.y+dy});
  } else {
    if(dy) opts.push({x:e.x, y:e.y+dy});
    if(dx) opts.push({x:e.x+dx, y:e.y});
  }
  for(const o of opts){
    if(walkable(o.x,o.y)){
      if(o.x > e.x) e.face = 1; else if(o.x < e.x) e.face = -1;
      e.x=o.x; e.y=o.y;
      return true;
    }
  }
  return false;
}

function nearestEnemy(from){
  let best=null, bd=1e9;
  for(const e of entities){
    if(e.dead || e.isAlly || e.isPlayer) continue;
    const d = chebyshev(from,e);
    if(d<bd){ bd=d; best=e; }
  }
  return best;
}

function enemyTurn(e){
  if(e.dead) return;
  const d = chebyshev(e, player);

  // face the player when in view
  if(canSee(e, player)){
    if(player.x < e.x) e.face = -1; else if(player.x > e.x) e.face = 1;
  }

  if(e.heal && Math.random()<0.35){
    let tgt=null, worst=1;
    for(const o of entities){
      if(o.dead || o.isPlayer || o.isAlly) continue;
      if(o===e) continue;
      if(chebyshev(e,o)<=5 && o.hp/o.maxhp < worst){ worst=o.hp/o.maxhp; tgt=o; }
    }
    if(tgt){
      const amt = Math.round(tgt.maxhp*0.28);
      tgt.hp = Math.min(tgt.maxhp, tgt.hp+amt);
      spawnFloater(tgt.x,tgt.y,`+${amt}`,'#f4f0e0');
      spawnParticles(tgt.x,tgt.y,10,'#f4f0e0',1.2);
      log(`${e.name} mends ${tgt.name}.`, '#f4f0e0');
      return;
    }
  }

  if(e.boss && Math.random()<0.22){
    const free=[];
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
      const nx=e.x+dx, ny=e.y+dy;
      if(walkable(nx,ny)) free.push({x:nx,y:ny});
    }
    if(free.length){
      const s = choice(free);
      entities.push(mkEntity({
        x:s.x, y:s.y, hp:26, maxhp:26, atk:10, def:3,
        sprite:'inquisitor', name:'Summoned Zealot', range:4, xp:12, isAlly:false
      }));
      spawnParticles(s.x,s.y,14,'#ffd040',1.6);
      log('Aldous calls forth a zealot!', '#ffd040');
      return;
    }
  }

  if(e.range > 1 && d <= e.range && d > 1 && canSee(e, player) && los(e.x,e.y,player.x,player.y)){
    tryAttack(e, player);
    spawnParticles(e.x, e.y, 6, e.boss ? '#ffd040' : '#ffa080', 0.9);
    return;
  }
  if(d <= 1 && e.range === 1){ tryAttack(e, player); return; }
  if(d <= 11 && canSee(e, player)){ stepToward(e, player.x, player.y); }
  else if(d <= 4){ stepToward(e, player.x, player.y); }
  else if(Math.random()<0.4){
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    const dd = choice(dirs);
    if(walkable(e.x+dd[0], e.y+dd[1])){
      if(dd[0] > 0) e.face = 1; else if(dd[0] < 0) e.face = -1;
      e.x+=dd[0]; e.y+=dd[1];
    }
  }
}

function allyTurn(e){
  if(e.dead) return;
  const t = nearestEnemy(e);
  if(!t){
    if(chebyshev(e,player) > 2) stepToward(e, player.x, player.y);
    return;
  }
  const d = chebyshev(e,t);
  if(t.x < e.x) e.face = -1; else if(t.x > e.x) e.face = 1;
  if(d <= 1){ tryAttack(e, t); return; }
  if(d <= 10) stepToward(e, t.x, t.y);
}

// ---------------------------------------------------------
// PLAYER ACTIONS
// ---------------------------------------------------------
function movePlayer(dx,dy){
  if(state!=='play') return;
  const nx = player.x+dx, ny = player.y+dy;
  if(dx < 0) player.face = -1; else if(dx > 0) player.face = 1;

  const target = entityAt(nx,ny);
  if(target){
    if(target.isAlly) return;
    tryAttack(player, target);
    playerActed();
    return;
  }
  if(isWall(nx,ny)) return;
  player.x = nx; player.y = ny;
  pickUpHere();
  playerActed();
}

function waitTurn(){ if(state==='play') playerActed(); }

function pickUpHere(){
  for(let i=items.length-1;i>=0;i--){
    const it = items[i];
    if(it.x!==player.x || it.y!==player.y) continue;
    if(it.kind==='corpse') continue;
    items.splice(i,1);
    applyItem(it);
  }
}

function applyItem(it){
  sfx('pickup');
  switch(it.kind){
    case 'potion': player.potions++; log('You clutch a vial of crimson.', '#ff4030'); break;
    case 'soul': {
      const e = 5 + Math.floor(depth*1.5);
      player.essence = Math.min(player.maxEssence, player.essence+e);
      spawnFloater(player.x,player.y,`+${e} essence`,'#a0ff50');
      log('Soul essence seeps into your bones.', '#a0ff50');
      break;
    }
    case 'scroll': {
      const x = 10 + depth*7;
      gainXP(x);
      spawnFloater(player.x,player.y,`+${x} xp`,'#d090ff');
      log('Forbidden knowledge burns through you.', '#d090ff');
      break;
    }
    case 'shard':
      player.atk += 1;
      spawnFloater(player.x,player.y,'+1 ATK','#a0f8ff');
      log('A shard of cold light fuses to your staff.', '#a0f8ff');
      break;
    case 'charm':
      player.maxhp += 3; player.hp += 3;
      spawnFloater(player.x,player.y,'+3 HP','#ffd040');
      log('A bone charm rattles against your ribs.', '#ffd040');
      break;
  }
}

function tryRaise(){
  if(state!=='play') return;
  const COST = 3;
  if(player.essence < COST){ log('Not enough essence.', '#c02020'); return; }
  const allies = entities.filter(e=>e.isAlly && !e.dead).length;
  if(allies >= player.maxMinions){ log('Your legion is full.', '#c02020'); return; }

  let idx = -1;
  for(let i=0;i<items.length;i++){
    const it = items[i];
    if(it.kind!=='corpse') continue;
    if(chebyshev(it,player) <= 1){ idx = i; break; }
  }
  if(idx < 0){ log('No corpse within reach.', '#c02020'); return; }

  const c = items[idx];
  items.splice(idx,1);
  player.essence -= COST;

  const hp = 12 + player.level*4;
  const ally = mkEntity({
    x:c.x, y:c.y, hp, maxhp:hp,
    atk: 4 + Math.floor(player.level*0.9), def: 1 + Math.floor(player.level/4),
    sprite:'skel', name:'Risen Servant', isAlly:true, range:1, xp:0
  });
  ally.face = player.face;
  entities.push(ally);

  // RAISE ANIMATION on player
  player.animState = 'attack';
  player.animT = 0;
  player.lungeDx = 0; player.lungeDy = 0;

  spawnParticles(c.x, c.y, 22, '#a0ff50', 1.9);
  sfx('raise');
  log('Bones knit together. A servant rises.', '#a0ff50');
  playerActed();
}

function drinkPotion(){
  if(state!=='play') return;
  if(player.potions<=0){ log('No potions left.', '#c02020'); return; }
  player.potions--;
  const amt = Math.round(player.maxhp*0.45) + 6;
  player.hp = Math.min(player.maxhp, player.hp + amt);
  spawnFloater(player.x, player.y, `+${amt}`, '#70e020');
  spawnParticles(player.x, player.y, 14, '#70e020', 1.2);
  sfx('pickup');
  log('Warmth floods your hollow chest.', '#70e020');
  playerActed();
}

function useStairs(){
  if(state!=='play') return;
  if(tiles[player.y*MAPW+player.x] !== 2){ log('No stairway here.', '#c02020'); return; }
  if(depth >= FLOORS.length){ log('There is nothing above.', '#c02020'); return; }
  sfx('stairs');
  buildFloor(depth+1);
}

// ---------------------------------------------------------
// INPUT — held-key repeat for smooth continuous movement
// ---------------------------------------------------------
const MOVE_KEYS = {
  'ArrowUp':[0,-1], 'w':[0,-1], '8':[0,-1],
  'ArrowDown':[0,1], 's':[0,1], '2':[0,1],
  'ArrowLeft':[-1,0], 'a':[-1,0], '4':[-1,0],
  'ArrowRight':[1,0], 'd':[1,0], '6':[1,0],
  '7':[-1,-1], '9':[1,-1], '1':[-1,1], '3':[1,1]
};
const REPEAT_DELAY = 0.20;
const REPEAT_RATE  = 0.13;
let repeatTimer = 0;

function handleMoveKey(key){
  const m = MOVE_KEYS[key];
  if(!m) return false;
  movePlayer(m[0], m[1]);
  return true;
}

function onKeyDown(k){
  initAudio();
  const key = k.length===1 ? k.toLowerCase() : k;

  if(state==='title'){
    if(key===' '||key==='Enter'){
      state='play'; depth=0; player=null; msgLog=[]; pendingBoons=0;
      buildFloor(1);
      heldKeys = {};
    }
    return;
  }
  if(state==='dead'){
    if(key===' '||key==='Enter'){ state='title'; heldKeys = {}; }
    return;
  }
  if(state==='win'){
    if(key===' '||key==='Enter'){ state='title'; heldKeys = {}; }
    return;
  }
  if(state==='boon'){
    if(key==='1'||key==='2'||key==='3'){
      const i = parseInt(key,10)-1;
      if(boonChoices && boonChoices[i]){
        boonChoices[i].f();
        log(`Boon: ${boonChoices[i].n}`, '#a0ff50');
        boonChoices = null;
        if(pendingBoons > 0){ pendingBoons--; offerBoons(); }
        else state = 'play';
      }
    }
    return;
  }

  // play — register held key
  heldKeys[key] = 0;
  repeatTimer = REPEAT_DELAY;

  // immediate action
  if(MOVE_KEYS[key]){ handleMoveKey(key); return; }
  switch(key){
    case ' ': case '.': waitTurn(); break;
    case 'r': tryRaise(); break;
    case 'q': drinkPotion(); break;
    case 'e': useStairs(); break;
  }
}

function onKeyUp(k){
  const key = k.length===1 ? k.toLowerCase() : k;
  delete heldKeys[key];
}

window.addEventListener('keydown', e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  if(e.repeat) return;   // ignore OS auto-repeat; we handle our own
  onKeyDown(e.key);
});
window.addEventListener('keyup', e=>{
  onKeyUp(e.key);
});

function updateHeldKeys(dt){
  if(state !== 'play') return;
  let anyHeld = false;
  for(const k in heldKeys){ anyHeld = true; break; }
  if(!anyHeld){ repeatTimer = REPEAT_DELAY; return; }
  repeatTimer -= dt;
  if(repeatTimer > 0) return;
  repeatTimer = REPEAT_RATE;
  for(const k in heldKeys){
    if(handleMoveKey(k)) return;
  }
}

// ---------------------------------------------------------
// ANIMATION UPDATE
// ---------------------------------------------------------
function updateAnimations(dt){
  const all = entities.slice();
  if(player && !all.includes(player)) all.push(player);

  for(const e of all){
    const targetX = e.x * TILE;
    const targetY = e.y * TILE;
    const dx = targetX - e.rx;
    const dy = targetY - e.ry;
    const dist = Math.hypot(dx, dy);
    const moving = dist > 0.4;

    // smooth interpolation
    if(moving){
      const k = 1 - Math.exp(-dt * 18);
      e.rx += dx * k;
      e.ry += dy * k;
    } else {
      e.rx = targetX;
      e.ry = targetY;
    }

    // walk phase
    if(moving) e.walkPhase += dt * 15;

    // landing squash
    if(e._wasMoving && !moving){
      e.squash = 1;
      if(e.isPlayer) sfx('step');
    }
    e._wasMoving = moving;

    // decay squash
    if(e.squash > 0) e.squash = Math.max(0, e.squash - dt * 8);

    // decay lunge / recoil
    const decay = Math.exp(-dt * 14);
    e.lungeDx *= decay; e.lungeDy *= decay;
    e.recoilDx *= decay; e.recoilDy *= decay;
    if(Math.abs(e.lungeDx) < 0.05) e.lungeDx = 0;
    if(Math.abs(e.lungeDy) < 0.05) e.lungeDy = 0;
    if(Math.abs(e.recoilDx) < 0.05) e.recoilDx = 0;
    if(Math.abs(e.recoilDy) < 0.05) e.recoilDy = 0;

    // anim timer
    e.animT += dt;
    if(e.animState === 'attack' && e.animT > 0.28){
      e.animState = 'idle';
      e.animT = 0;
    }

    // dying progress
    if(e.dead && e.dying !== undefined){
      e.dying += dt * 2.5;
    }
  }

  // remove fully-faded dead entities
  entities = entities.filter(e => !e.dead || e.dying === undefined || e.dying < 1.6);
}

// ---------------------------------------------------------
// RENDER
// ---------------------------------------------------------
function drawTile(tx,ty,px,py){
  const i = ty*MAPW+tx;
  const t = tiles[i];
  const v = Math.floor(hash2(tx,ty)*4);
  const fv = Math.floor(hash2(tx*3+7,ty*5+11)*6);
  if(t === 0){
    bx.drawImage(wallTiles[v], px, py);
  } else {
    bx.drawImage(floorTiles[fv], px, py);
    if(t === 2){
      bx.drawImage(SPR.stairs.img, px + SPR.stairs.ox, py + SPR.stairs.oy);
    }
  }
}

function drawDecals(cX, cY){
  for(const d of decals){
    const px = d.x*TILE - cX, py = d.y*TILE - cY;
    if(px < -16 || py < -16 || px > BUFW || py > BUFH) continue;
    if(!visible[d.y*MAPW+d.x]) continue;
    bx.globalAlpha = 0.55 * d.a;
    bx.fillStyle = d.type === 'blood' ? '#8a1010' : '#1a1020';
    for(let i=0;i<8;i++){
      const ax = (hash2(d.x*13+i, d.y*7)*(14))|0;
      const ay = (hash2(d.x*5, d.y*17+i)*(14))|0;
      bx.fillRect(px+ax, py+ay, 2, 2);
    }
    bx.globalAlpha = 1;
  }
}

// animated sprite draw with squash, facing, death
function drawEntitySprite(e, px, py){
  // choose frame
  let key = e.sprite;
  if(e.animState === 'attack'){
    const atk = e.sprite + '_attack';
    if(SPR[atk]) key = atk;
  }
  const base = SPR[key];
  if(!base) return;
  const useFlip = (e.face < 0) && SPR_FLIP[key];
  const spr = useFlip ? SPR_FLIP[key] : base;

  // squash & stretch around the feet
  const sq = e.squash || 0;
  const sx = 1 + sq * 0.18;
  const sy = 1 - sq * 0.18;

  // dying scale + fade
  let alpha = 1;
  let dScale = 1;
  if(e.dead && e.dying !== undefined){
    const t = Math.min(1, e.dying);
    alpha = Math.max(0, 1 - t);
    dScale = 1 - t * 0.55;
  }

  const sw = spr.img.width, sh = spr.img.height;

  // fast path when no squash and no death
  if(sq < 0.02 && dScale === 1){
    bx.globalAlpha *= alpha;
    bx.drawImage(spr.img, Math.round(px + spr.ox), Math.round(py + spr.oy));
    bx.globalAlpha = 1;
    return;
  }

  // pivot at feet center
  const cx = px + spr.ox + sw/2;
  const cy = py + spr.oy + sh;
  bx.save();
  bx.globalAlpha *= alpha;
  bx.translate(cx, cy);
  bx.scale(sx * dScale, sy * dScale);
  bx.drawImage(spr.img, -sw/2, -sh);
  bx.restore();
  bx.globalAlpha = 1;
}

function render(){
  const camX = Math.round(player.rx + TILE/2 - BUFW/2);
  const camY = Math.round(player.ry + TILE/2 - BUFH/2);
  const cX = clamp(camX, 0, Math.max(0, MAPW*TILE - BUFW));
  const cY = clamp(camY, 0, Math.max(0, MAPH*TILE - BUFH));

  bx.fillStyle = '#0d0a14';
  bx.fillRect(0,0,BUFW,BUFH);

  const sx0 = Math.floor(cX/TILE), sy0 = Math.floor(cY/TILE);
  const sx1 = sx0 + VW + 2, sy1 = sy0 + VH + 2;

  for(let ty=sy0; ty<sy1; ty++){
    for(let tx=sx0; tx<sx1; tx++){
      if(tx<0||ty<0||tx>=MAPW||ty>=MAPH) continue;
      const i = ty*MAPW+tx;
      if(!seen[i]) continue;
      const px = tx*TILE - cX, py = ty*TILE - cY;
      drawTile(tx,ty,px,py);
      if(!visible[i]){
        bx.fillStyle = 'rgba(10,8,20,0.66)';
        bx.fillRect(px,py,TILE,TILE);
      }
    }
  }

  drawDecals(cX, cY);

  // items with pulsing glow
  for(const it of items){
    const i = it.y*MAPW+it.x;
    if(!visible[i]) continue;
    const px = it.x*TILE - cX, py = it.y*TILE - cY;
    if(it.kind !== 'corpse'){
      const pulse = 0.5 + Math.sin(animT*3.5 + it.x*0.7 + it.y*0.5)*0.5;
      const col = ITEM_COLORS[it.kind] || '#ffffff';
      bx.globalAlpha = 0.20 + pulse*0.30;
      bx.fillStyle = col;
      bx.fillRect(px+1, py+1, 14, 14);
      bx.globalAlpha = 1;
    }
    const bob = Math.sin(animT*3 + it.x + it.y)*1;
    const sprKey = it.spr;
    const s = SPR[sprKey];
    bx.drawImage(s.img, Math.round(px + s.ox), Math.round(py + s.oy + (it.kind==='corpse'?0:bob)));
  }

  // entities sorted by ry (depth)
  const sorted = entities.slice().sort((a,b)=> a.ry - b.ry);
  for(const e of sorted){
    const i = e.y*MAPW+e.x;
    // allow visible check based on current tile
    if(!visible[i] && !e.isAlly) continue;
    if(e.isAlly && !visible[Math.max(0,Math.min(MAPH-1,e.y))*MAPW + Math.max(0,Math.min(MAPW-1,e.x))] && !seen[i]) continue;

    // pixel position
    let px = e.rx - cX;
    let py = e.ry - cY;

    // walk bob / idle breathe
    const tx = e.x*TILE, ty = e.y*TILE;
    const moving = Math.abs(tx - e.rx) > 0.5 || Math.abs(ty - e.ry) > 0.5;
    let bobY = 0;
    if(moving){
      bobY = -Math.abs(Math.sin(e.walkPhase)) * 2;
    } else {
      bobY = Math.sin(animT * 3 + e.id * 0.7) * 0.6;
    }

    // lunge + recoil
    px += e.lungeDx + e.recoilDx;
    py += e.lungeDy + e.recoilDy + bobY;

    // ground shadow (skip when dying)
    if(!e.dead || e.dying === undefined || e.dying < 0.9){
      bx.globalAlpha = 0.45 * (e.dead ? Math.max(0, 1 - (e.dying||0)) : 1);
      bx.fillStyle = '#000';
      bx.fillRect(px+2, py+12, 12, 4);
      bx.globalAlpha = 1;
    }

    // ally / boss auras
    if(e.isAlly && !e.dead){
      bx.globalAlpha = 0.22 + Math.sin(animT*5+e.id)*0.08;
      bx.fillStyle = '#a0ff50';
      bx.fillRect(px+1, py+1, 14, 14);
      bx.globalAlpha = 1;
    }
    if(e.boss && !e.dead){
      bx.globalAlpha = 0.22 + Math.sin(animT*3)*0.10;
      bx.fillStyle = '#ffd040';
      bx.fillRect(px-4, py-4, 24, 24);
      bx.globalAlpha = 1;
    }

    // sprite
    drawEntitySprite(e, px, py);

    // hit flash
    if(e.flash > 0 && !e.dead){
      bx.globalAlpha = 0.55 * Math.min(1, e.flash / 0.18);
      bx.fillStyle = '#ffffff';
      bx.fillRect(px+1, py+1, 14, 14);
      bx.globalAlpha = 1;
    }

    // enemy HP bar
    if(!e.isAlly && e.hp < e.maxhp && e.hp > 0 && !e.dead){
      const bw = 14, bh = 3;
      const bxp = px + 1, byp = py - 4;
      bx.fillStyle = '#1a0808';
      bx.fillRect(bxp, byp, bw, bh);
      bx.fillStyle = e.boss ? '#ffd040' : '#ff4030';
      bx.fillRect(bxp+1, byp+1, Math.max(1, Math.round((bw-2) * e.hp/e.maxhp)), bh-2);
    }
  }

  // player
  {
    let px = player.rx - cX;
    let py = player.ry - cY;
    const tx = player.x*TILE, ty = player.y*TILE;
    const moving = Math.abs(tx - player.rx) > 0.5 || Math.abs(ty - player.ry) > 0.5;
    let bobY = 0;
    if(moving) bobY = -Math.abs(Math.sin(player.walkPhase)) * 2;
    else bobY = Math.sin(animT * 3) * 0.6;
    px += player.lungeDx + player.recoilDx;
    py += player.lungeDy + player.recoilDy + bobY;

    // shadow
    bx.globalAlpha = 0.5;
    bx.fillStyle = '#000';
    bx.fillRect(px+2, py+12, 12, 4);
    bx.globalAlpha = 1;

    // aura
    bx.globalAlpha = 0.22 + Math.sin(animT*2.5)*0.10;
    bx.fillStyle = '#a0ff50';
    bx.fillRect(px-1, py-1, 18, 18);
    bx.globalAlpha = 1;

    drawEntitySprite(player, px, py);

    if(player.flash > 0){
      bx.globalAlpha = 0.55 * Math.min(1, player.flash / 0.18);
      bx.fillStyle = '#ffffff';
      bx.fillRect(px+1, py+1, 14, 14);
      bx.globalAlpha = 1;
    }
  }

  // particles
  for(const p of particles){
    const px = p.x - cX, py = p.y - cY;
    if(px<-8||py<-8||px>BUFW+8||py>BUFH+8) continue;
    bx.globalAlpha = clamp(p.life,0,1);
    bx.fillStyle = p.color;
    bx.fillRect(Math.round(px), Math.round(py), p.size, p.size);
  }
  bx.globalAlpha = 1;

  // light vignette
  const vg = bx.createRadialGradient(
    player.rx - cX + 8, player.ry - cY + 8, 180,
    player.rx - cX + 8, player.ry - cY + 8, 480
  );
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(6,4,14,0.32)');
  bx.fillStyle = vg;
  bx.fillRect(0,0,BUFW,BUFH);

  bx.fillStyle = 'rgba(255,200,120,0.025)';
  bx.fillRect(0,0,BUFW,BUFH);
}

// ---------------------------------------------------------
// HUD
// ---------------------------------------------------------
function roundRect(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);
  g.arcTo(x,y,x+w,y,r);
  g.closePath();
}

function bar(g, x, y, w, h, pct, col1, col2, label){
  g.fillStyle = 'rgba(8,6,16,0.92)';
  roundRect(g,x,y,w,h,3); g.fill();
  g.strokeStyle = 'rgba(200,160,255,0.55)';
  g.lineWidth = 1.5;
  roundRect(g,x+0.5,y+0.5,w-1,h-1,3); g.stroke();
  const fw = Math.max(0, (w-4) * clamp(pct,0,1));
  if(fw > 0){
    const grad = g.createLinearGradient(x, y, x, y+h);
    grad.addColorStop(0, col1);
    grad.addColorStop(1, col2);
    g.fillStyle = grad;
    roundRect(g,x+2,y+2,fw,h-4,2); g.fill();
  }
  if(label){
    g.fillStyle = '#ffffff';
    g.font = 'bold 12px ui-monospace, Menlo, Consolas, monospace';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.shadowColor = '#000'; g.shadowBlur = 3;
    g.fillText(label, x+w/2, y+h/2+0.5);
    g.shadowBlur = 0;
    g.textAlign = 'left';
    g.textBaseline = 'alphabetic';
  }
}

function drawHUD(){
  const W = canvas.width, H = canvas.height;
  const pad = 14;
  ctx.save();

  if(state === 'title'){
    ctx.fillStyle = 'rgba(8,5,18,0.92)';
    ctx.fillRect(0,0,W,H);
    const tg = ctx.createRadialGradient(W/2, H*0.4, 40, W/2, H*0.5, W*0.55);
    tg.addColorStop(0, 'rgba(120,60,200,0.20)');
    tg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = tg;
    ctx.fillRect(0,0,W,H);

    ctx.textAlign = 'center';
    const t = animT;
    const bob = Math.sin(t*2)*6;
    ctx.imageSmoothingEnabled = false;
    const ps = 9;
    ctx.drawImage(SPR.necro.img, W/2 - 9*ps, H/2 - 160 + bob, 18*ps, 18*ps);

    ctx.font = 'bold 58px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillStyle = '#a0ff50';
    ctx.shadowColor = '#70e020'; ctx.shadowBlur = 30;
    ctx.fillText('BONE ASCENSION', W/2, H/2 + 30);
    ctx.shadowBlur = 0;

    ctx.font = 'bold 16px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillStyle = '#d090ff';
    ctx.fillText('They burned you for a witch. They were right.', W/2, H/2 + 62);

    ctx.font = '14px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillStyle = '#a89078';
    ctx.fillText('Ten floors. One cathedral. One bishop.', W/2, H/2 + 88);

    const pulse = 0.5 + Math.sin(t*4)*0.5;
    ctx.globalAlpha = 0.55 + pulse*0.45;
    ctx.font = 'bold 20px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#a0ff50'; ctx.shadowBlur = 16;
    ctx.fillText('PRESS  SPACE  TO RISE', W/2, H/2 + 140);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;

    ctx.font = '12px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillStyle = '#6a5f88';
    ctx.fillText('WASD/Arrows move · hold to glide · R raise dead · Q potion · E stairs', W/2, H - 30);

    ctx.textAlign = 'left';
    ctx.restore();
    return;
  }

  if(!player){ ctx.restore(); return; }

  const panW = 260, panH = 112;
  ctx.fillStyle = 'rgba(6,4,14,0.85)';
  roundRect(ctx, pad, pad, panW, panH, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(200,160,255,0.55)';
  ctx.lineWidth = 1.5;
  roundRect(ctx, pad+0.5, pad+0.5, panW-1, panH-1, 6); ctx.stroke();

  ctx.font = 'bold 14px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = '#d090ff';
  ctx.fillText('THE REBORN', pad+12, pad+22);
  ctx.font = 'bold 12px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = '#e0d0a8';
  ctx.fillText(`Lv ${player.level}`, pad+panW-56, pad+22);
  ctx.fillStyle = '#a89078';
  ctx.fillText(`FLOOR ${depth}`, pad+panW-120, pad+22);

  bar(ctx, pad+12, pad+32, panW-24, 16, player.hp/player.maxhp, '#8f1a1a', '#ff4030',
      `HP  ${Math.max(0,player.hp)} / ${player.maxhp}`);
  bar(ctx, pad+12, pad+54, panW-24, 13, player.essence/player.maxEssence, '#207820', '#a0ff50',
      `ESSENCE  ${player.essence} / ${player.maxEssence}`);
  bar(ctx, pad+12, pad+73, panW-24, 11, player.xp/player.next, '#4a2470', '#d090ff',
      `XP  ${player.xp} / ${player.next}`);

  const allies = entities.filter(e=>e.isAlly && !e.dead).length;
  ctx.font = 'bold 12px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = '#a0ff50';
  ctx.fillText(`☠ Servants ${allies}/${player.maxMinions}`, pad+12, pad+102);
  ctx.fillStyle = '#ff4030';
  ctx.fillText(`⚗ Potions ${player.potions}`, pad+panW-100, pad+102);

  const fl = FLOORS[Math.min(depth-1, FLOORS.length-1)];
  ctx.font = 'bold 16px ui-monospace, Menlo, Consolas, monospace';
  ctx.textAlign = 'right';
  ctx.fillStyle = '#d090ff';
  ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
  ctx.fillText(fl.name, W-pad, pad+24);
  ctx.shadowBlur = 0;
  ctx.font = 'bold 12px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = '#e0d0a8';
  ctx.fillText(`ATK ${player.atk}   DEF ${player.def}`, W-pad, pad+44);
  ctx.textAlign = 'left';

  const logH = 18 + msgLog.length*16;
  const logY = H - pad - logH;
  ctx.fillStyle = 'rgba(6,4,14,0.85)';
  roundRect(ctx, pad, logY, 440, logH, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(200,160,255,0.35)';
  ctx.lineWidth = 1;
  roundRect(ctx, pad+0.5, logY+0.5, 439, logH-1, 6); ctx.stroke();

  ctx.font = 'bold 12px ui-monospace, Menlo, Consolas, monospace';
  for(let i=0;i<msgLog.length;i++){
    const m = msgLog[i];
    const a = 0.45 + 0.55 * ((i+1)/msgLog.length);
    ctx.globalAlpha = a;
    ctx.fillStyle = m.c;
    ctx.fillText(m.t, pad+12, logY + 20 + i*16);
  }
  ctx.globalAlpha = 1;

  ctx.textAlign = 'right';
  ctx.font = 'bold 12px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = 'rgba(200,170,255,0.65)';
  const ctrls = [
    'WASD / ARROWS  move & attack  (hold to glide)',
    'R  raise the dead     Q  drink potion',
    'E  ascend stairs      SPACE  wait'
  ];
  for(let i=0;i<ctrls.length;i++){
    ctx.fillText(ctrls[i], W-pad, H-pad-8 - (ctrls.length-1-i)*16);
  }
  ctx.textAlign = 'left';

  if(state === 'boon'){
    ctx.fillStyle = 'rgba(6,4,16,0.88)';
    ctx.fillRect(0,0,W,H);
    const cw = 320, ch = 150, gap = 28;
    const totalW = cw*3 + gap*2;
    const startX = (W-totalW)/2;
    const y = H/2 - ch/2 + 20;

    ctx.textAlign = 'center';
    ctx.font = 'bold 28px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillStyle = '#a0ff50';
    ctx.shadowColor = '#70e020'; ctx.shadowBlur = 20;
    ctx.fillText('CHOOSE A BOON', W/2, y - 46);
    ctx.shadowBlur = 0;
    ctx.font = 'bold 13px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillStyle = '#d090ff';
    ctx.fillText('press 1, 2, or 3', W/2, y - 24);

    for(let i=0;i<3;i++){
      const b = boonChoices[i];
      if(!b) continue;
      const x = startX + i*(cw+gap);
      ctx.fillStyle = 'rgba(30,20,50,0.98)';
      roundRect(ctx, x, y, cw, ch, 8); ctx.fill();
      ctx.strokeStyle = '#d090ff';
      ctx.lineWidth = 2.5;
      roundRect(ctx, x+1.5, y+1.5, cw-3, ch-3, 8); ctx.stroke();
      ctx.font = 'bold 32px ui-monospace, Menlo, Consolas, monospace';
      ctx.fillStyle = '#a0ff50';
      ctx.fillText(`${i+1}`, x+cw/2, y+44);
      ctx.font = 'bold 16px ui-monospace, Menlo, Consolas, monospace';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(b.n, x+cw/2, y+80);
      ctx.font = 'bold 12px ui-monospace, Menlo, Consolas, monospace';
      ctx.fillStyle = '#e0d0a8';
      ctx.fillText(b.d, x+cw/2, y+104);
    }
    ctx.textAlign = 'left';
  }

  if(state === 'dead'){
    ctx.fillStyle = `rgba(12,2,6,${clamp(deathTimer/60,0,0.90)})`;
    ctx.fillRect(0,0,W,H);
    if(deathTimer > 30){
      ctx.textAlign = 'center';
      ctx.font = 'bold 50px ui-monospace, Menlo, Consolas, monospace';
      ctx.fillStyle = '#ff4030';
      ctx.shadowColor = '#8a1010'; ctx.shadowBlur = 24;
      ctx.fillText('YOUR BONES REST', W/2, H/2 - 10);
      ctx.shadowBlur = 0;
      ctx.font = 'bold 15px ui-monospace, Menlo, Consolas, monospace';
      ctx.fillStyle = '#d090ff';
      ctx.fillText(`You reached ${FLOORS[Math.min(depth-1,FLOORS.length-1)].name}`, W/2, H/2 + 30);
      ctx.fillStyle = '#e0d0a8';
      ctx.fillText(`Level ${player.level}`, W/2, H/2 + 54);
      ctx.fillStyle = '#a89078';
      ctx.fillText('press SPACE', W/2, H/2 + 100);
      ctx.textAlign = 'left';
    }
  }

  if(state === 'win'){
    ctx.fillStyle = `rgba(6,4,14,${clamp(winTimer/90,0,0.92)})`;
    ctx.fillRect(0,0,W,H);
    if(winTimer > 40){
      ctx.textAlign = 'center';
      ctx.font = 'bold 46px ui-monospace, Menlo, Consolas, monospace';
      ctx.fillStyle = '#ffd040';
      ctx.shadowColor = '#ffd040'; ctx.shadowBlur = 24;
      ctx.fillText('THE CATHEDRAL IS SILENT', W/2, H/2 - 60);
      ctx.shadowBlur = 0;
      ctx.font = 'bold 15px ui-monospace, Menlo, Consolas, monospace';
      ctx.fillStyle = '#d090ff';
      ctx.fillText('Bishop Aldous lies broken on the marble.', W/2, H/2 - 16);
      ctx.fillText('The village that burned you will wake', W/2, H/2 + 10);
      ctx.fillText('to a sky with no prayers in it.', W/2, H/2 + 34);
      ctx.fillStyle = '#a0ff50';
      ctx.font = 'bold 17px ui-monospace, Menlo, Consolas, monospace';
      ctx.fillText('You did not die. You ascended.', W/2, H/2 + 84);
      ctx.fillStyle = '#a89078';
      ctx.font = '12px ui-monospace, Menlo, Consolas, monospace';
      ctx.fillText('press SPACE', W/2, H/2 + 130);
      ctx.textAlign = 'left';
    }
  }

  ctx.restore();
}

// ---------------------------------------------------------
// MAIN LOOP
// ---------------------------------------------------------
let last = performance.now();

function loop(now){
  const dt = Math.min(0.05, (now-last)/1000);
  last = now;
  animT += dt;

  if(state === 'dead') deathTimer++;
  if(state === 'win') winTimer++;

  for(const e of entities){ if(e.flash > 0) e.flash = Math.max(0, e.flash - dt); }
  if(player && player.flash > 0) player.flash = Math.max(0, player.flash - dt);

  if(player){
    updateAnimations(dt);
    updateHeldKeys(dt);
  }

  // particles
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.06;
    p.vx *= 0.96; p.vy *= 0.96;
    p.life -= dt*1.6;
    if(p.life <= 0) particles.splice(i,1);
  }
  for(let i=floaters.length-1;i>=0;i--){
    const f = floaters[i];
    f.y -= 18*dt;
    f.life -= dt*1.1;
    if(f.life <= 0) floaters.splice(i,1);
  }
  if(shake > 0) shake = Math.max(0, shake - dt*30);
  for(const d of decals){ if(d.a > 0.35) d.a -= dt*0.01; }

  if(player){
    render();
    const camX = clamp(Math.round(player.rx + TILE/2 - BUFW/2), 0, Math.max(0, MAPW*TILE-BUFW));
    const camY = clamp(Math.round(player.ry + TILE/2 - BUFH/2), 0, Math.max(0, MAPH*TILE-BUFH));
    bx.font = 'bold 9px ui-monospace, monospace';
    bx.textAlign = 'center';
    for(const f of floaters){
      bx.globalAlpha = clamp(f.life,0,1);
      bx.fillStyle = '#000';
      bx.fillText(f.text, f.x - camX + 1, f.y - camY + 1);
      bx.fillStyle = f.color;
      bx.fillText(f.text, f.x - camX, f.y - camY);
    }
    bx.globalAlpha = 1;
    bx.textAlign = 'left';
  } else {
    bx.fillStyle = '#0d0a14';
    bx.fillRect(0,0,BUFW,BUFH);
  }

  ctx.fillStyle = '#0d0a14';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  const shx = shake > 0 ? (Math.random()-0.5)*shake : 0;
  const shy = shake > 0 ? (Math.random()-0.5)*shake : 0;

  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(buf, 0, 0, BUFW, BUFH,
                Math.round(offX + shx*scale), Math.round(offY + shy*scale),
                Math.round(BUFW*scale), Math.round(BUFH*scale));

  drawHUD();
  requestAnimationFrame(loop);
}

// ---------------------------------------------------------
// BOOT
// ---------------------------------------------------------
log('You claw out of the ash.', '#a0ff50');
requestAnimationFrame(loop);
</script>
