<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survive Until 6AM · Demon Stalker</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body {
        background: #05070a;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Courier New', Courier, monospace;
        overflow: hidden;
        color: #b3c7e5;
    }
    .game-wrapper {
        background: #1a1e24;
        padding: 16px;
        border-radius: 16px;
        box-shadow: 0 0 40px #000, inset 0 0 12px #2f3742;
    }
    canvas {
        display: block;
        width: 900px;
        height: 600px;
        image-rendering: crisp-edges;
        image-rendering: pixelated;
        border: 4px solid #3e4a5b;
        border-radius: 12px;
        background: #0b0d10;
        cursor: pointer;
    }
    .info-bar {
        display: flex; justify-content: space-between; align-items: center;
        margin-top: 10px; gap: 8px; font-weight: bold;
        letter-spacing: 1px; font-size: 0.85rem;
    }
    .info-bar span {
        background: #1f262e; padding: 5px 12px; border-radius: 40px;
        border: 2px solid #4b5e77; box-shadow: inset 0 0 6px #000;
    }
    .restart-btn {
        background: #2d3847; border: none; color: #e5efff;
        font-family: inherit; font-weight: bold; padding: 5px 14px;
        border-radius: 40px; font-size: 0.85rem; cursor: pointer;
        border: 2px solid #6a7f9c; box-shadow: 0 4px 0 #0e1217;
    }
    .restart-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #0e1217; }
    .hint { text-align: center; margin-top: 6px; font-size: 0.75rem; color: #6a7a8a; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="game-wrapper">
    <canvas id="gameCanvas" width="900" height="600"></canvas>
    <div class="info-bar">
        <span>🔒 <span id="lockCount">8/8</span></span>
        <span>⏳ <span id="clockDisplay">12:00 AM</span></span>
        <span>🔋 <span id="batteryDisplay">100%</span></span>
        <span>⚡ <span id="staminaDisplay">100%</span></span>
        <span>🏆 <span id="bestTime">--</span></span>
        <button class="restart-btn" id="restartButton">↻ RESTART</button>
    </div>
    <div class="hint">← → rooms · SPACE flashlight · E interact · SHIFT sprint · ESC pause</div>
</div>
<script>
(function() {
"use strict";

// ============================================================
// SETUP
// ============================================================
var canvas = document.getElementById('gameCanvas');
var ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

var lockCountSpan      = document.getElementById('lockCount');
var clockDisplaySpan   = document.getElementById('clockDisplay');
var batteryDisplaySpan = document.getElementById('batteryDisplay');
var staminaDisplaySpan = document.getElementById('staminaDisplay');
var bestTimeSpan       = document.getElementById('bestTime');

// ============================================================
// AUDIO (procedural)
// ============================================================
var audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch(e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type, vol, slideTo) {
    if (!audioCtx) return;
    try {
        var o = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        o.type = type || 'square';
        o.frequency.setValueAtTime(freq, audioCtx.currentTime);
        if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + dur);
        g.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + dur);
    } catch(e) {}
}
function sfxClick()     { beep(880, 0.05, 'square', 0.05, 440); }
function sfxLock()      { beep(220, 0.14, 'sawtooth', 0.08, 110); }
function sfxUnlock()    { beep(180, 0.12, 'square', 0.06, 300); }
function sfxBreak()     { beep(140, 0.35, 'sawtooth', 0.13, 40); }
function sfxGrowl()     { beep(80, 0.5, 'sawtooth', 0.11, 45); }
function sfxHeartbeat() { beep(60, 0.1, 'sine', 0.14); }
function sfxStep()      { beep(120, 0.04, 'square', 0.03); }
function sfxBarricade() { beep(150, 0.2, 'square', 0.09, 80); }
function sfxFlash()     { beep(400, 0.05, 'square', 0.03); }
function sfxScream() {
    if (!audioCtx) return;
    try {
        var o = audioCtx.createOscillator(); var g = audioCtx.createGain();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(1400, audioCtx.currentTime);
        o.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 1.3);
        g.gain.setValueAtTime(0.28, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.3);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + 1.3);
    } catch(e) {}
}
function sfxWin() {
    [523, 659, 784, 1047].forEach(function(f, i) {
        setTimeout(function(){ beep(f, 0.25, 'sine', 0.12); }, i * 180);
    });
}

// ============================================================
// CONSTANTS
// ============================================================
var HOURS = ['12:00 AM','1:00 AM','2:00 AM','3:00 AM','4:00 AM','5:00 AM','6:00 AM'];
var DIFFICULTIES = {
    easy:      { hourLen: 20, baseInterval: 6.0, label: 'EASY',      color: '#4a8a4a' },
    normal:    { hourLen: 16, baseInterval: 4.5, label: 'NORMAL',    color: '#a8803a' },
    nightmare: { hourLen: 13, baseInterval: 3.2, label: 'NIGHTMARE', color: '#8a2a2a' }
};

// ============================================================
// ROOMS
// ============================================================
function buildRooms() {
    return [
        {
            id: 'bedroom', name: 'BEDROOM',
            wall: '#1a1620', floor: '#13101a',
            entryPoints: [
                { x: 130, y: 300, w: 130, h: 220, type: 'window', label: 'WINDOW', locked: true, barricade: 0, maxBarricade: 3 },
                { x: 620, y: 200, w: 140, h: 280, type: 'door',   label: 'DOOR',   locked: true, barricade: 0, maxBarricade: 4 }
            ],
            objects: [
                { type: 'bed',  x: 340, y: 380, w: 200, h: 110 },
                { type: 'lamp', x: 60,  y: 140, w: 30,  h: 60, on: false }
            ]
        },
        {
            id: 'hallway', name: 'HALLWAY',
            wall: '#141820', floor: '#0f131a',
            entryPoints: [
                { x: 380, y: 200, w: 140, h: 260, type: 'door', label: 'FRONT', locked: true, barricade: 0, maxBarricade: 5 },
                { x: 100, y: 240, w: 100, h: 180, type: 'vent', label: 'VENT',  locked: true, barricade: 0, maxBarricade: 2 },
                { x: 700, y: 240, w: 100, h: 180, type: 'vent', label: 'VENT',  locked: true, barricade: 0, maxBarricade: 2 }
            ],
            objects: [
                { type: 'painting', x: 250, y: 130, w: 60, h: 80 },
                { type: 'painting', x: 590, y: 130, w: 60, h: 80 }
            ]
        },
        {
            id: 'kitchen', name: 'KITCHEN',
            wall: '#1c1814', floor: '#161210',
            entryPoints: [
                { x: 700, y: 280, w: 150, h: 240, type: 'window', label: 'WINDOW', locked: true, barricade: 0, maxBarricade: 3 },
                { x: 400, y: 180, w: 120, h: 80,  type: 'vent',   label: 'VENT',   locked: true, barricade: 0, maxBarricade: 2 }
            ],
            objects: [
                { type: 'counter', x: 100, y: 400, w: 200, h: 60 },
                { type: 'fridge',  x: 60,  y: 220, w: 70,  h: 170 }
            ]
        },
        {
            id: 'living', name: 'LIVING ROOM',
            wall: '#18161c', floor: '#121017',
            entryPoints: [
                { x: 100, y: 260, w: 150, h: 250, type: 'door',   label: 'BACK',   locked: true, barricade: 0, maxBarricade: 4 },
                { x: 620, y: 260, w: 150, h: 250, type: 'window', label: 'WINDOW', locked: true, barricade: 0, maxBarricade: 3 }
            ],
            objects: [
                { type: 'sofa', x: 330, y: 420, w: 240, h: 80 },
                { type: 'tv',   x: 380, y: 200, w: 140, h: 100, on: false }
            ]
        }
    ];
}

// ============================================================
// STATE
// ============================================================
var gameState = {};
function freshState() {
    return {
        scene: 'title',
        difficulty: 'normal',
        hour: 0, hourTimer: 0, hourLength: 16,
        attackTimer: 0, attackInterval: 4.5, baseInterval: 4.5,
        demonForm: 'panther', formTimer: 6,
        flickerTimer: 0, clickCooldown: 0,
        demonBob: 0, demonPose: 'idle', poseTimer: 0,
        msg: '', msgTimer: 0,
        shake: 0, warning: 0,
        roomIndex: 0,
        stamina: 100, maxStamina: 100, sprinting: false,
        flashlight: false, battery: 100, maxBattery: 100,
        noise: 0,
        rooms: buildRooms(),
        demonTargetRoom: 0, demonTargetEntry: 0,
        timeSurvived: 0, deathTimer: 0, winTimer: 0,
        jumpscareTimer: 0, jumpscareForm: 'panther',
        heartbeatTimer: 0, heartbeatInterval: 1.5,
        moonFlicker: 0, paused: false,
        bloodSplats: [], sparks: [],
        keys: {}
    };
}

// ============================================================
// BEST TIME
// ============================================================
var bestTime = 0;
try { var v = localStorage.getItem('demonStalkerBest2'); bestTime = v ? parseFloat(v) : 0; } catch(e){}
function saveBest(t) { try { localStorage.setItem('demonStalkerBest2', t.toString()); } catch(e){} }
function updateBestUI() {
    if (bestTime <= 0) { bestTimeSpan.textContent = '--'; return; }
    var h = Math.floor(bestTime / 60);
    var m = Math.floor(bestTime) % 60;
    var s = Math.floor((bestTime * 10) % 10);
    bestTimeSpan.textContent = h + 'h' + m + 'm' + s + 's';
}
updateBestUI();

// ============================================================
// HELPERS
// ============================================================
function currentRoom() { return gameState.rooms[gameState.roomIndex]; }
function totalLocked() {
    var c = 0;
    for (var i = 0; i < gameState.rooms.length; i++)
        for (var j = 0; j < gameState.rooms[i].entryPoints.length; j++)
            if (gameState.rooms[i].entryPoints[j].locked) c++;
    return c;
}
function totalEntryPoints() {
    var c = 0;
    for (var i = 0; i < gameState.rooms.length; i++) c += gameState.rooms[i].entryPoints.length;
    return c;
}
function updateHUD() {
    lockCountSpan.textContent      = totalLocked() + '/' + totalEntryPoints();
    clockDisplaySpan.textContent   = HOURS[gameState.hour];
    batteryDisplaySpan.textContent = Math.max(0, Math.floor(gameState.battery)) + '%';
    staminaDisplaySpan.textContent = Math.max(0, Math.floor(gameState.stamina)) + '%';
}

// ============================================================
// START
// ============================================================
function startGame(difficulty) {
    initAudio();
    gameState = freshState();
    gameState.difficulty = difficulty;
    var d = DIFFICULTIES[difficulty];
    gameState.hourLength = d.hourLen;
    gameState.baseInterval = d.baseInterval;
    gameState.attackInterval = d.baseInterval;
    gameState.scene = 'playing';
    gameState.msg = 'Lock every window & door!';
    gameState.msgTimer = 2.5;
    updateHUD();
}

// ============================================================
// INPUT
// ============================================================
window.addEventListener('keydown', function(e) {
    if (!gameState.keys) gameState.keys = {};
    var k = e.key.toLowerCase();
    gameState.keys[k] = true;

    if (gameState.scene === 'title') {
        if (e.key === '1') startGame('easy');
        if (e.key === '2') startGame('normal');
        if (e.key === '3') startGame('nightmare');
        return;
    }
    if (gameState.scene === 'playing' || gameState.scene === 'paused') {
        if (e.key === 'Escape') { gameState.paused = !gameState.paused; return; }
        if (gameState.paused) return;
        if (e.key === ' ') { e.preventDefault(); toggleFlashlight(); }
        if (k === 'e') interact();
        if (e.key === 'ArrowLeft')  moveRoom(-1);
        if (e.key === 'ArrowRight') moveRoom(1);
    }
    if (gameState.scene === 'dead' || gameState.scene === 'win') {
        if (e.key === 'Enter' || e.key === ' ') gameState.scene = 'title';
    }
});
window.addEventListener('keyup', function(e) {
    if (gameState.keys) gameState.keys[e.key.toLowerCase()] = false;
});

canvas.addEventListener('click', function(e) {
    initAudio();
    var r = canvas.getBoundingClientRect();
    var mx = (e.clientX - r.left) * (canvas.width / r.width);
    var my = (e.clientY - r.top)  * (canvas.height / r.height);

    if (gameState.scene === 'title') {
        var btnY = 400;
        if (my > btnY && my < btnY + 55) {
            if (mx > 200 && mx < 340) startGame('easy');
            else if (mx > 360 && mx < 540) startGame('normal');
            else if (mx > 560 && mx < 700) startGame('nightmare');
        }
        return;
    }
    if (gameState.scene !== 'playing') return;
    if (gameState.paused) return;

    // room nav arrows
    if (mx < 55 && my > 250 && my < 400) { moveRoom(-1); return; }
    if (mx > 845 && my > 250 && my < 400) { moveRoom(1); return; }

    // room tabs (bottom bar)
    var tabW = 150;
    var tabY = 555;
    var startX = 450 - (gameState.rooms.length * tabW) / 2;
    if (my >= tabY && my <= tabY + 32) {
        for (var ti = 0; ti < gameState.rooms.length; ti++) {
            var tx = startX + ti * tabW;
            if (mx >= tx + 4 && mx <= tx + tabW - 4) {
                gameState.roomIndex = ti;
                sfxStep();
                gameState.stamina = Math.max(0, gameState.stamina - 5);
                gameState.noise = Math.min(100, gameState.noise + 8);
                updateHUD();
                return;
            }
        }
    }

    // entry points
    var room = currentRoom();
    for (var i = 0; i < room.entryPoints.length; i++) {
        var ep = room.entryPoints[i];
        if (mx >= ep.x && mx <= ep.x + ep.w && my >= ep.y && my <= ep.y + ep.h) {
            handleEntryClick(ep);
            return;
        }
    }
});

function handleEntryClick(ep) {
    if (ep.locked) {
        ep.locked = false;
        sfxUnlock();
        gameState.msg = ep.label + ' unlocked!';
        gameState.msgTimer = 1.2;
    } else if (ep.barricade < ep.maxBarricade) {
        ep.barricade++;
        sfxBarricade();
        gameState.msg = 'Barricade +1 (' + ep.barricade + '/' + ep.maxBarricade + ')';
        gameState.msgTimer = 1.2;
    } else {
        ep.locked = true;
        ep.barricade = 0;
        sfxLock();
        gameState.msg = ep.label + ' locked again';
        gameState.msgTimer = 1.2;
    }
    updateHUD();
}

function toggleFlashlight() {
    if (gameState.battery <= 0) { gameState.flashlight = false; return; }
    gameState.flashlight = !gameState.flashlight;
    sfxFlash();
}

function interact() {
    var room = currentRoom();
    for (var i = 0; i < room.objects.length; i++) {
        var obj = room.objects[i];
        if (obj.type === 'lamp' && !obj.on) {
            obj.on = true;
            gameState.msg = 'Lamp on. Panther hates light!';
            gameState.msgTimer = 1.8;
            return;
        }
        if (obj.type === 'tv' && !obj.on) {
            obj.on = true;
            gameState.msg = 'TV on. Drowns out noise.';
            gameState.msgTimer = 1.8;
            return;
        }
        if (obj.type === 'bed') {
            gameState.msg = 'You hide under the bed.';
            gameState.msgTimer = 1.5;
            gameState.noise = Math.max(0, gameState.noise - 25);
            return;
        }
    }
}

function moveRoom(dir) {
    if (gameState.stamina < 10) {
        gameState.msg = 'Too tired!';
        gameState.msgTimer = 1;
        return;
    }
    var n = gameState.rooms.length;
    gameState.roomIndex = (gameState.roomIndex + dir + n) % n;
    sfxStep();
    gameState.stamina = Math.max(0, gameState.stamina - 8);
    gameState.noise = Math.min(100, gameState.noise + 12);
    updateHUD();
}

// ============================================================
// UPDATE LOOP
// ============================================================
function update(dt) {
    if (gameState.scene === 'title') {
        gameState.demonBob = Math.sin(Date.now() * 0.003) * 4;
        return;
    }
    if (gameState.scene === 'dead') {
        gameState.deathTimer += dt;
        gameState.jumpscareTimer += dt;
        gameState.shake = Math.max(0, gameState.shake - dt * 2);
        return;
    }
    if (gameState.scene === 'win') {
        gameState.winTimer += dt;
        return;
    }
    if (gameState.paused) return;

    gameState.timeSurvived += dt;

    // sprint / stamina
    gameState.sprinting = !!gameState.keys['shift'];
    if (gameState.sprinting && gameState.stamina > 0) {
        gameState.stamina = Math.max(0, gameState.stamina - dt * 18);
        gameState.noise = Math.min(100, gameState.noise + dt * 25);
    } else {
        gameState.stamina = Math.min(gameState.maxStamina, gameState.stamina + dt * 12);
    }

    // flashlight battery
    if (gameState.flashlight) {
        gameState.battery = Math.max(0, gameState.battery - dt * 4.5);
        if (gameState.battery <= 0) {
            gameState.flashlight = false;
            gameState.msg = 'Battery dead!';
            gameState.msgTimer = 2;
        }
    } else {
        gameState.battery = Math.min(gameState.maxBattery, gameState.battery + dt * 0.6);
    }

    // noise decay
    gameState.noise = Math.max(0, gameState.noise - dt * 20);

    // timers
    if (gameState.clickCooldown > 0) gameState.clickCooldown -= dt;
    if (gameState.msgTimer > 0)      gameState.msgTimer -= dt;
    if (gameState.formTimer > 0)     gameState.formTimer -= dt;
    if (gameState.flickerTimer > 0)  gameState.flickerTimer -= dt;
    if (gameState.shake > 0)         gameState.shake = Math.max(0, gameState.shake - dt * 2.5);
    if (gameState.warning > 0)       gameState.warning = Math.max(0, gameState.warning - dt);
    if (gameState.poseTimer > 0)     gameState.poseTimer -= dt;
    gameState.demonBob = Math.sin(Date.now() * 0.008) * 3;

    // fx decay
    for (var i = gameState.bloodSplats.length - 1; i >= 0; i--) {
        gameState.bloodSplats[i].life -= dt;
        if (gameState.bloodSplats[i].life <= 0) gameState.bloodSplats.splice(i, 1);
    }
    for (var j = gameState.sparks.length - 1; j >= 0; j--) {
        gameState.sparks[j].life -= dt;
        gameState.sparks[j].vy += dt * 200;
        gameState.sparks[j].y  += gameState.sparks[j].vy * dt;
        if (gameState.sparks[j].life <= 0) gameState.sparks.splice(j, 1);
    }

    // heartbeat
    var lockedRatio = totalLocked() / totalEntryPoints();
    gameState.heartbeatInterval = 0.5 + lockedRatio * 1.5 + gameState.noise * 0.003;
    gameState.heartbeatTimer += dt;
    if (gameState.heartbeatTimer >= gameState.heartbeatInterval) {
        gameState.heartbeatTimer = 0;
        sfxHeartbeat();
    }

    // random flicker
    if (Math.random() < 0.004) gameState.flickerTimer = 0.3;
    gameState.moonFlicker = Math.random() < 0.015 ? 0.15 : 0;

    // form change
    if (gameState.formTimer <= 0) {
        var forms = ['panther', 'dog', 'wolf'];
        var nf = forms[Math.floor(Math.random() * 3)];
        if (nf === gameState.demonForm) nf = forms[(forms.indexOf(nf) + 1) % 3];
        gameState.demonForm = nf;
        gameState.msg = 'Demon is now a ' + nf.toUpperCase();
        gameState.msgTimer = 1.8;
        gameState.formTimer = 6 + Math.random() * 6;
    }

    // attack warning + attack
    gameState.attackTimer += dt;
    if (gameState.attackTimer >= gameState.attackInterval - 0.9 && gameState.warning <= 0) {
        gameState.warning = 0.9;
        sfxGrowl();
    }
    if (gameState.attackTimer >= gameState.attackInterval) {
        gameState.attackTimer = 0;
        performAttack();
    }

    // hour advance
    gameState.hourTimer += dt;
    if (gameState.hourTimer >= gameState.hourLength) {
        gameState.hourTimer = 0;
        if (gameState.hour < 6) {
            gameState.hour++;
            updateHUD();
            var scaleTable = [1, 0.85, 0.72, 0.60, 0.50, 0.38];
            var scale = scaleTable[gameState.hour] || 0.38;
            gameState.baseInterval   = DIFFICULTIES[gameState.difficulty].baseInterval * scale;
            gameState.attackInterval = Math.min(gameState.attackInterval, gameState.baseInterval);
            gameState.battery = Math.min(gameState.maxBattery, gameState.battery + 25);
            gameState.stamina = gameState.maxStamina;

            if (gameState.hour >= 6) {
                gameState.scene = 'win';
                gameState.winTimer = 0;
                sfxWin();
                if (gameState.timeSurvived > bestTime) {
                    bestTime = gameState.timeSurvived;
                    saveBest(bestTime);
                    updateBestUI();
                }
            } else {
                gameState.msg = 'Hour ' + gameState.hour + ' — it grows bolder';
                gameState.msgTimer = 2;
            }
        }
    }
}

// ============================================================
// DEMON AI
// ============================================================
function performAttack() {
    var rooms = gameState.rooms;
    var candidates = [];
    for (var ri = 0; ri < rooms.length; ri++) {
        var r = rooms[ri];
        for (var ei = 0; ei < r.entryPoints.length; ei++) {
            var ep = r.entryPoints[ei];
            var weight = 1.0;
            if (!ep.locked) weight += 2.5;
            if (ep.barricade > 0) weight -= ep.barricade * 0.4;
            if (ri === gameState.demonTargetRoom && ei === gameState.demonTargetEntry) weight += 1.5;
            if (weight < 0.1) weight = 0.1;
            candidates.push({ ri: ri, ei: ei, w: weight });
        }
    }
    var total = 0;
    for (var i = 0; i < candidates.length; i++) total += candidates[i].w;
    var roll = Math.random() * total;
    var pick = candidates[0];
    for (var k = 0; k < candidates.length; k++) {
        roll -= candidates[k].w;
        if (roll <= 0) { pick = candidates[k]; break; }
    }

    var room = rooms[pick.ri];
    var entry = room.entryPoints[pick.ei];

    // form-specific preference
    var preferredType = gameState.demonForm === 'panther' ? 'door'
                      : gameState.demonForm === 'dog'     ? 'window'
                      : 'vent';
    if (entry.type !== preferredType && Math.random() < 0.5) {
        var matching = [];
        for (var m = 0; m < candidates.length; m++) {
            if (rooms[candidates[m].ri].entryPoints[candidates[m].ei].type === preferredType)
                matching.push(candidates[m]);
        }
        if (matching.length > 0) {
            pick = matching[Math.floor(Math.random() * matching.length)];
            room = rooms[pick.ri];
            entry = room.entryPoints[pick.ei];
        }
    }

    gameState.demonTargetRoom = pick.ri;
    gameState.demonTargetEntry = pick.ei;
    attackEntry(room, entry);
}

function attackEntry(room, ep) {
    gameState.demonPose = 'attack';
    gameState.poseTimer = 0.5;
    gameState.shake = 1.0;
    sfxBreak();

    if (ep.barricade > 0) {
        ep.barricade--;
        gameState.msg = gameState.demonForm.toUpperCase() + ' smashes a barricade in ' + room.name + '!';
        gameState.msgTimer = 1.8;
        for (var i = 0; i < 12; i++) {
            gameState.sparks.push({
                x: ep.x + ep.w / 2 + (Math.random() - 0.5) * ep.w,
                y: ep.y + ep.h / 2 + (Math.random() - 0.5) * ep.h,
                vy: -Math.random() * 180,
                life: 0.6 + Math.random() * 0.4
            });
        }
        return;
    }

    if (ep.locked) {
        ep.locked = false;
        gameState.msg = gameState.demonForm.toUpperCase() + ' broke the ' + ep.label + ' in ' + room.name + '!';
        gameState.msgTimer = 1.8;
        gameState.bloodSplats.push({ x: ep.x + ep.w / 2, y: ep.y + ep.h / 2, life: 3 });
        updateHUD();
        handleFormExtra(ep, room);
        return;
    }

    // demon enters → death
    gameState.scene = 'dead';
    gameState.deathTimer = 0;
    gameState.jumpscareTimer = 0;
    gameState.jumpscareForm = gameState.demonForm;
    sfxScream();
    gameState.shake = 2;
}

function handleFormExtra(ep, room) {
    if (gameState.demonForm === 'panther' && Math.random() < 0.3) {
        var otherRooms = [];
        for (var i = 0; i < gameState.rooms.length; i++)
            if (gameState.rooms[i].id !== room.id) otherRooms.push(gameState.rooms[i]);
        if (otherRooms.length > 0) {
            var or = otherRooms[Math.floor(Math.random() * otherRooms.length)];
            var oep = or.entryPoints[Math.floor(Math.random() * or.entryPoints.length)];
            if (oep.locked) {
                setTimeout(function() {
                    if (gameState.scene !== 'playing') return;
                    oep.locked = false;
                    gameState.msg = '🐾 PANTHER double swipe!';
                    gameState.msgTimer = 1.4;
                    gameState.bloodSplats.push({ x: oep.x + oep.w / 2, y: oep.y + oep.h / 2, life: 3 });
                    updateHUD();
                }, 260);
            }
        }
    } else if (gameState.demonForm === 'dog' && Math.random() < 0.35) {
        var others = [];
        for (var j = 0; j < room.entryPoints.length; j++) {
            if (room.entryPoints[j] !== ep && room.entryPoints[j].locked)
                others.push(room.entryPoints[j]);
        }
        if (others.length > 0) {
            var o = others[Math.floor(Math.random() * others.length)];
            o.locked = false;
            gameState.msg = '🐕 DOG bites another lock!';
            gameState.msgTimer = 1.4;
            gameState.bloodSplats.push({ x: o.x + o.w / 2, y: o.y + o.h / 2, life: 3 });
            updateHUD();
        }
    } else if (gameState.demonForm === 'wolf' && Math.random() < 0.45) {
        gameState.flickerTimer = 1.0;
        gameState.msg = '🐺 WOLF howls! Vision blurs...';
        gameState.msgTimer = 1.5;
    }
}

// ============================================================
// HOUSE / ROOM DRAWING
// ============================================================
function drawHouse() {
    var room = currentRoom();

    // walls / floor
    ctx.fillStyle = room.wall;
    ctx.fillRect(0, 0, 900, 600);
    ctx.fillStyle = room.floor;
    ctx.fillRect(0, 380, 900, 220);

    // floorboards
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    for (var i = 0; i < 900; i += 45) ctx.fillRect(i, 380, 2, 220);

    // wall texture
    ctx.fillStyle = 'rgba(255,255,255,0.02)';
    for (var j = 0; j < 900; j += 65) {
        for (var k = 0; k < 380; k += 65) {
            if ((j + k) % 130 === 0) ctx.fillRect(j, k, 32, 32);
        }
    }

    // objects behind
    for (var oi = 0; oi < room.objects.length; oi++) {
        drawObject(room.objects[oi]);
    }

    // entry points (doors/windows/vents)
    for (var ei = 0; ei < room.entryPoints.length; ei++) {
        drawEntryPoint(room.entryPoints[ei]);
    }

    // flashlight cone
    if (gameState.flashlight) {
        var cx = 450, cy = 500;
        var grad = ctx.createRadialGradient(cx, cy, 30, cx, cy, 300);
        grad.addColorStop(0,   'rgba(255,240,190,0.30)');
        grad.addColorStop(0.5, 'rgba(255,220,150,0.10)');
        grad.addColorStop(1,   'rgba(255,220,150,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 900, 600);
    }

    // vignette
    var vg = ctx.createRadialGradient(450, 300, 200, 450, 300, 560);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.75)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, 900, 600);

    // room name
    ctx.textAlign = 'center';
    ctx.font = 'bold 22px "Courier New", monospace';
    ctx.fillStyle = 'rgba(200,220,255,0.55)';
    ctx.fillText('· ' + room.name + ' ·', 450, 72);
}

function drawObject(obj) {
    if (obj.type === 'bed') {
        px(obj.x, obj.y, obj.w, obj.h, '#3a2a2a');
        px(obj.x, obj.y, obj.w, 20, '#5a4040');
        px(obj.x + 10, obj.y + 30, obj.w - 20, obj.h - 40, '#8a7a70');
        px(obj.x + 10, obj.y + 30, obj.w - 20, 40, '#d8d0c8');
    } else if (obj.type === 'lamp') {
        px(obj.x + 8, obj.y + 40, 14, 20, '#3a3a3a');
        px(obj.x, obj.y, 30, 45, obj.on ? '#e8e0a0' : '#3a3a3a');
        if (obj.on) {
            var g = ctx.createRadialGradient(obj.x + 15, obj.y + 20, 5, obj.x + 15, obj.y + 20, 180);
            g.addColorStop(0, 'rgba(255,240,150,0.35)');
            g.addColorStop(1, 'rgba(255,240,150,0)');
            ctx.fillStyle = g;
            ctx.fillRect(obj.x - 150, obj.y - 150, 330, 330);
        }
    } else if (obj.type === 'painting') {
        px(obj.x, obj.y, obj.w, obj.h, '#3a2a1a');
        px(obj.x + 4, obj.y + 4, obj.w - 8, obj.h - 8, '#5a4a3a');
        px(obj.x + 15, obj.y + 20, obj.w - 30, obj.h - 40, '#2a1a0a');
    } else if (obj.type === 'counter') {
        px(obj.x, obj.y, obj.w, obj.h, '#4a3a2a');
        px(obj.x, obj.y, obj.w, 8, '#7a6a5a');
    } else if (obj.type === 'fridge') {
        px(obj.x, obj.y, obj.w, obj.h, '#8a8a90');
        px(obj.x + 4, obj.y + 4, obj.w - 8, obj.h - 8, '#b0b0b8');
        px(obj.x + obj.w - 12, obj.y + 20, 4, 40, '#3a3a3a');
    } else if (obj.type === 'sofa') {
        px(obj.x, obj.y, obj.w, obj.h, '#3a2a3a');
        px(obj.x, obj.y, obj.w, 20, '#5a405a');
        px(obj.x + 10, obj.y + 25, obj.w - 20, obj.h - 35, '#6a5070');
    } else if (obj.type === 'tv') {
        px(obj.x, obj.y, obj.w, obj.h, '#1a1a1a');
        px(obj.x + 6, obj.y + 6, obj.w - 12, obj.h - 12, obj.on ? '#4a8aff' : '#0a0a0a');
        if (obj.on) {
            for (var s = 0; s < 12; s++) {
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.fillRect(obj.x + 8 + Math.random() * (obj.w - 16), obj.y + 8 + Math.random() * (obj.h - 16), 3, 3);
            }
        }
        px(obj.x + obj.w / 2 - 20, obj.y + obj.h, 40, 10, '#1a1a1a');
    }
}

function drawEntryPoint(ep) {
    var baseColor = ep.type === 'door' ? '#2a1f1a'
                  : ep.type === 'window' ? '#0a0f18'
                  : '#1a1a1a';
    px(ep.x, ep.y, ep.w, ep.h, baseColor);

    // frame
    ctx.strokeStyle = '#5b4a3a';
    ctx.lineWidth = 6;
    ctx.strokeRect(ep.x, ep.y, ep.w, ep.h);

    if (ep.type === 'window') {
        var moonAlpha = 0.20 - gameState.moonFlicker * 0.5;
        if (moonAlpha < 0) moonAlpha = 0.05;
        ctx.fillStyle = 'rgba(180,210,255,' + moonAlpha + ')';
        ctx.fillRect(ep.x + 4, ep.y + 4, ep.w - 8, ep.h - 8);
        px(ep.x + ep.w / 2 - 3, ep.y, 6, ep.h, '#5b4a3a');
        px(ep.x, ep.y + ep.h / 2 - 3, ep.w, 6, '#5b4a3a');
    } else if (ep.type === 'door') {
        px(ep.x + 12, ep.y + 15, ep.w - 24, 70, '#241a15');
        px(ep.x + 12, ep.y + 100, ep.w - 24, 70, '#241a15');
        ctx.fillStyle = '#c9a86a';
        ctx.beginPath();
        ctx.arc(ep.x + ep.w - 20, ep.y + ep.h / 2, 7, 0, Math.PI * 2);
        ctx.fill();
    } else if (ep.type === 'vent') {
        for (var s = 0; s < 6; s++) {
            px(ep.x + 8, ep.y + 15 + s * 22, ep.w - 16, 6, '#3a3a3a');
        }
        px(ep.x + ep.w / 2 - 20, ep.y + ep.h - 30, 40, 14, '#3a3a3a');
    }

    // padlock indicator
    var lx = ep.x + ep.w / 2;
    var ly = ep.y - 22;
    if (ep.locked) {
        ctx.strokeStyle = '#b0b0b0';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(lx, ly - 6, 8, Math.PI, 0);
        ctx.stroke();
        ctx.fillStyle = '#e5b13b';
        ctx.fillRect(lx - 10, ly - 2, 20, 16);
        ctx.strokeStyle = '#1e1e1e';
        ctx.lineWidth = 2;
        ctx.strokeRect(lx - 10, ly - 2, 20, 16);
        ctx.fillStyle = '#1e1e1e';
        ctx.fillRect(lx - 2, ly + 3, 4, 6);
    } else {
        ctx.strokeStyle = '#5a5a5a';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(lx - 6, ly - 8, 6, Math.PI * 0.7, Math.PI * 1.5);
        ctx.stroke();
        ctx.fillStyle = '#4a3a2a';
        ctx.fillRect(lx - 10, ly - 2, 20, 16);
        ctx.strokeStyle = '#1e1e1e';
        ctx.lineWidth = 2;
        ctx.strokeRect(lx - 10, ly - 2, 20, 16);
    }

    // barricade planks
    for (var b = 0; b < ep.barricade; b++) {
        px(ep.x - 5, ep.y + 20 + b * 35, ep.w + 10, 12, '#8a6a3a');
        px(ep.x - 5, ep.y + 20 + b * 35, ep.w + 10, 3, '#a88a5a');
    }

    // label
    ctx.textAlign = 'center';
    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.fillStyle = ep.locked ? '#c9e0a0' : '#c96f6f';
    ctx.fillText(ep.label, lx, ep.y + ep.h + 18);

    // blood splats
    for (var i = 0; i < gameState.bloodSplats.length; i++) {
        var bs = gameState.bloodSplats[i];
        var dx = bs.x - lx, dy = bs.y - ly;
        if (Math.abs(dx) < ep.w / 2 + 20 && Math.abs(dy) < ep.h / 2 + 20) {
            var alpha = Math.min(1, bs.life / 3);
            ctx.fillStyle = 'rgba(120,10,20,' + alpha + ')';
            ctx.beginPath();
            ctx.arc(bs.x, bs.y, 18 * alpha + 4, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // sparks
    for (var sp = 0; sp < gameState.sparks.length; sp++) {
        var s2 = gameState.sparks[sp];
        ctx.fillStyle = 'rgba(255,200,80,' + Math.min(1, s2.life / 0.5) + ')';
        ctx.fillRect(s2.x, s2.y, 3, 3);
    }
}

// DEMON SPRITES
// ============================================================
function drawDemon() {
    var form = gameState.demonForm;
    var baseX = 450;
    var baseY = 130 + gameState.demonBob;
    var attacking = gameState.demonPose === 'attack';
    var wobble = attacking ? Math.sin(Date.now() * 0.05) * 6 : 0;
    var bx = baseX + wobble;

    var alpha = 1;
    if (gameState.flickerTimer > 0) alpha = 0.4 + Math.abs(Math.sin(Date.now() * 0.04)) * 0.6;

    ctx.save();
    ctx.globalAlpha = alpha;

    ctx.fillStyle = '#1a0808';
    ctx.beginPath(); ctx.arc(bx, baseY, 95, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2a0d0d';
    ctx.beginPath(); ctx.arc(bx, baseY - 5, 72, 0, Math.PI * 2); ctx.fill();

    if (form === 'panther') drawPanther(bx, baseY, attacking);
    else if (form === 'dog') drawDog(bx, baseY, attacking);
    else drawWolf(bx, baseY, attacking);

    ctx.restore();
}

// ============================================================

function drawHUD() {
    if (gameState.msgTimer > 0 && gameState.msg) {
        ctx.textAlign = 'center';
        ctx.font = 'bold 24px "Courier New", monospace';
        ctx.shadowColor = '#6a1e1e';
        ctx.shadowBlur = 12;
        ctx.fillStyle = '#f0d0a0';
        ctx.fillText(gameState.msg, 450, 100);
        ctx.shadowBlur = 0;
    }

    if (gameState.warning > 0) {
        var a = Math.abs(Math.sin(Date.now() * 0.03)) * 0.35;
        ctx.fillStyle = 'rgba(180,0,0,' + a + ')';
        ctx.fillRect(0, 0, 900, 600);
        ctx.textAlign = 'center';
        ctx.font = 'bold 42px "Courier New", monospace';
        ctx.fillStyle = 'rgba(255,60,60,' + (a * 2) + ')';
        ctx.fillText('!', 450, 300);
    }

    ctx.textAlign = 'center';
    ctx.font = 'bold 60px "Courier New", monospace';
    ctx.fillStyle = 'rgba(200,220,255,0.35)';
    ctx.fillText('<', 30, 340);
    ctx.fillText('>', 870, 340);

    // room tabs
    var tabW = 150;
    var tabY = 555;
    var startX = 450 - (gameState.rooms.length * tabW) / 2;
    for (var i = 0; i < gameState.rooms.length; i++) {
        var tx = startX + i * tabW;
        var active = i === gameState.roomIndex;
        ctx.fillStyle = active ? 'rgba(90,120,160,0.85)' : 'rgba(30,40,55,0.75)';
        ctx.fillRect(tx + 4, tabY, tabW - 8, 32);
        ctx.strokeStyle = active ? '#a0c0ff' : '#4b5e77';
        ctx.lineWidth = 2;
        ctx.strokeRect(tx + 4, tabY, tabW - 8, 32);
        ctx.fillStyle = active ? '#e5efff' : '#8a9aad';
        ctx.font = 'bold 13px "Courier New", monospace';
        ctx.fillText(gameState.rooms[i].name, tx + tabW / 2, tabY + 21);
    }

    // noise meter
    var nw = 180, nx = 360, ny = 20;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(nx, ny, nw, 12);
    ctx.fillStyle = gameState.noise > 60 ? '#e05050' : '#6aa0d0';
    ctx.fillRect(nx, ny, nw * (gameState.noise / 100), 12);
    ctx.strokeStyle = '#4b5e77';
    ctx.lineWidth = 2;
    ctx.strokeRect(nx, ny, nw, 12);
    ctx.fillStyle = '#7a8a9a';
    ctx.font = '10px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.fillText('NOISE', nx, ny - 3);

    // form indicator
    ctx.textAlign = 'right';
    ctx.font = 'bold 14px "Courier New", monospace';
    var formCol = gameState.demonForm === 'panther' ? '#ff2a8c'
                : gameState.demonForm === 'dog' ? '#ff3333' : '#f0e13b';
    ctx.fillStyle = formCol;
    ctx.fillText('▲ ' + gameState.demonForm.toUpperCase(), 880, 25);

    // hour progress
    var prog = Math.min(1, gameState.hourTimer / gameState.hourLength);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(360, 40, 180, 6);
    ctx.fillStyle = '#c9a86a';
    ctx.fillRect(360, 40, 180 * prog, 6);
}

// ============================================================
// JUMPScare + DEATH
// ============================================================
function drawDeath() {
    var t = Math.min(1, gameState.jumpscareTimer);
    var scale = 1 + t * 3;
    var bx = 450;
    var baseY = 300 + Math.sin(Date.now() * 0.1) * 20;

    ctx.save();
    ctx.globalAlpha = 1;
    ctx.translate(bx, baseY);
    ctx.scale(scale, scale);
    ctx.translate(-bx, -baseY);

    var form = gameState.jumpscareForm;
    if (form === 'panther') drawPanther(bx, baseY, true);
    else if (form === 'dog') drawDog(bx, baseY, true);
    else drawWolf(bx, baseY, true);
    ctx.restore();

    ctx.fillStyle = 'rgba(120,0,0,' + (t * 0.5) + ')';
    ctx.fillRect(0, 0, 900, 600);

    if (gameState.shake > 0) {
        var sx = (Math.random() - 0.5) * gameState.shake * 30;
        var sy = (Math.random() - 0.5) * gameState.shake * 30;
        ctx.translate(sx, sy);
    }

    if (gameState.jumpscareTimer > 1.5) {
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(0, 0, 900, 600);
        ctx.textAlign = 'center';
        ctx.font = 'bold 62px "Courier New", monospace';
        ctx.fillStyle = '#d44';
        ctx.shadowColor = '#500';
        ctx.shadowBlur = 20;
        ctx.fillText('GAME OVER', 450, 260);
        ctx.shadowBlur = 0;
        ctx.font = '22px "Courier New", monospace';
        ctx.fillStyle = '#c0a0a0';
        ctx.fillText('The ' + gameState.jumpscareForm + ' got you.', 450, 320);
        ctx.fillStyle = '#7a8a9a';
        ctx.font = '16px "Courier New", monospace';
        ctx.fillText('You survived ' + gameState.timeSurvived.toFixed(1) + 's', 450, 360);
        ctx.fillStyle = '#a0c0ff';
        ctx.fillText('PRESS ENTER TO RETURN', 450, 430);
    }
}

function drawWin() {
    var t = Math.min(1, gameState.winTimer / 3);
    var grad = ctx.createLinearGradient(0, 600, 0, 0);
    grad.addColorStop(0, 'rgb(' + Math.floor(40 + t * 200) + ',' + Math.floor(20 + t * 120) + ',' + Math.floor(30 + t * 40) + ')');
    grad.addColorStop(0.5, 'rgb(' + Math.floor(20 + t * 100) + ',' + Math.floor(30 + t * 60) + ',' + Math.floor(50 + t * 60) + ')');
    grad.addColorStop(1, 'rgb(10,15,30)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 900, 600);

    var sunY = 500 - t * 250;
    ctx.fillStyle = 'rgba(255,220,120,' + (0.6 + t * 0.4) + ')';
    ctx.beginPath(); ctx.arc(450, sunY, 80, 0, Math.PI * 2); ctx.fill();

    ctx.textAlign = 'center';
    ctx.font = 'bold 78px "Courier New", monospace';
    ctx.fillStyle = '#fff0c0';
    ctx.shadowColor = '#ffb040';
    ctx.shadowBlur = 30;
    ctx.fillText('6:00 AM', 450, 200);
    ctx.shadowBlur = 0;

    ctx.font = 'bold 42px "Courier New", monospace';
    ctx.fillStyle = '#c8e0a0';
    ctx.fillText('YOU SURVIVED', 450, 280);

    ctx.font = '20px "Courier New", monospace';
    ctx.fillStyle = '#e0e8f0';
    ctx.fillText('Time: ' + gameState.timeSurvived.toFixed(1) + 's', 450, 340);

    if (gameState.timeSurvived >= bestTime) {
        ctx.fillStyle = '#ffd060';
        ctx.font = 'bold 22px "Courier New", monospace';
        ctx.fillText('★ NEW BEST TIME ★', 450, 380);
    }

    ctx.fillStyle = '#a0c0ff';
    ctx.font = '18px "Courier New", monospace';
    ctx.fillText('PRESS ENTER TO PLAY AGAIN', 450, 460);
}

function drawPause() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, 900, 600);
    ctx.textAlign = 'center';
    ctx.font = 'bold 60px "Courier New", monospace';
    ctx.fillStyle = '#c8d8f0';
    ctx.fillText('PAUSED', 450, 280);
    ctx.font = '18px "Courier New", monospace';
    ctx.fillStyle = '#8a9aad';
    ctx.fillText('Press ESC to resume', 450, 340);
}

// ============================================================
// MAIN RENDER
// ============================================================
function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);   // reset every frame

    if (gameState.scene === 'title') {
        drawTitle();
        return;
    }

    if (gameState.scene === 'dead') {
        drawHouse();
        drawDemon();
        drawDeath();
        return;
    }

    if (gameState.scene === 'win') {
        drawWin();
        return;
    }

    // playing (or paused)
    ctx.save();
    if (gameState.shake > 0) {
        var sx = (Math.random() - 0.5) * gameState.shake * 12;
        var sy = (Math.random() - 0.5) * gameState.shake * 12;
        ctx.translate(sx, sy);
    }

    drawHouse();
    drawDemon();
    ctx.restore();

    // flicker overlay
    if (gameState.flickerTimer > 0) {
        ctx.fillStyle = 'rgba(80,0,0,' + (Math.random() * 0.25) + ')';
        ctx.fillRect(0, 0, 900, 600);
        for (var i = 0; i < 30; i++) {
            ctx.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.1) + ')';
            ctx.fillRect(Math.random() * 900, Math.random() * 600, 8, 8);
        }
    }

    drawHUD();

    if (gameState.paused) drawPause();
}

// ============================================================
// GAME LOOP
// ============================================================
var lastTime = performance.now() / 1000;
function gameLoop(now) {
    var nowSec = now / 1000;
    var dt = nowSec - lastTime;
    if (dt > 0.1) dt = 0.1;
    lastTime = nowSec;

    update(dt);
    draw();
    requestAnimationFrame(gameLoop);
}

// ============================================================
// INIT
// ============================================================
restartButton.addEventListener('click', function() {
    gameState.scene = 'title';
    gameState.paused = false;
});

gameState = freshState();
updateHUD();
requestAnimationFrame(gameLoop);

})();
</script>
</body>
